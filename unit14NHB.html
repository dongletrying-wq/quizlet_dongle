<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizlet Unit 14: Let's Go!</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #4255ff;
            --primary-hover: #2e3ed4;
            --bg-main: #f6f7fb;
            --card-bg: #ffffff;
            --text-main: #1a1d28;
            --text-muted: #646f90;
            --border-color: #e2e8f0;
            --success: #23b26d;
            --danger: #ff495c;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        
        nav.nav-tabs { display: flex; justify-content: center; gap: 10px; padding: 1rem; background: var(--card-bg); border-bottom: 1px solid var(--border-color); flex-wrap: wrap; }
        .tab-btn { background: transparent; border: none; padding: 10px 18px; border-radius: var(--radius-md); font-weight: 600; color: var(--text-muted); cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .tab-btn:hover { background: #f1f3f9; color: var(--text-main); }
        .tab-btn.active { background: var(--primary); color: white; }

        main { flex: 1; max-width: 800px; width: 100%; margin: 0 auto; padding: 1.5rem 1rem; }
        .view-panel { display: none; }
        .view-panel.active { display: block; }

        .filter-select { padding: 10px 18px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--card-bg); font-weight: 600; margin-bottom: 1rem; outline: none; cursor: pointer; color: var(--text-main); width: 100%; max-width: 380px; }

        /* Flashcard 3D */
        .flashcard-wrapper { perspective: 1000px; width: 100%; height: 380px; margin-bottom: 1.5rem; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); cursor: pointer; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius-lg); background: var(--card-bg); border: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.8rem; text-align: center; }
        .card-back { transform: rotateY(180deg); background: #fafbff; }
        .card-category { position: absolute; top: 15px; left: 20px; font-size: 0.8rem; font-weight: 700; color: var(--primary); background: rgba(66, 85, 255, 0.08); padding: 4px 12px; border-radius: 12px; }
        .ai-gen-btn { position: absolute; top: 15px; right: 20px; background: #f0f4ff; color: var(--primary); border: 1px solid rgba(66, 85, 255, 0.2); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .card-word { font-size: 2.2rem; font-weight: 800; margin-bottom: 0.2rem; }
        .card-type { font-size: 0.9rem; font-weight: 700; color: #8e44ad; background: #f3e8f5; padding: 2px 8px; border-radius: 6px; margin-bottom: 0.4rem; }
        .card-phonetic { font-size: 1rem; color: var(--text-muted); margin-bottom: 0.8rem; font-family: monospace; }
        .card-meaning { font-size: 1.8rem; font-weight: 700; color: var(--primary); margin-bottom: 0.8rem; }
        .card-example { font-size: 0.95rem; color: var(--text-muted); font-style: italic; max-width: 90%; line-height: 1.4; }
        .controls-bar { display: flex; justify-content: space-between; align-items: center; }
        .ctrl-btn { background: var(--card-bg); border: 1px solid var(--border-color); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }

        /* Match Game */
        .match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .match-card { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: var(--radius-md); height: 100px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0.8rem; font-weight: 700; cursor: pointer; user-select: none; }
        .match-card.selected { border-color: var(--primary); background: rgba(66, 85, 255, 0.08); color: var(--primary); }
        .match-card.correct { border-color: var(--success); background: rgba(35, 178, 109, 0.1); opacity: 0.2; pointer-events: none; }

        /* Quiz & Spell */
        .quiz-card { background: var(--card-bg); padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-md); }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 1.5rem; }
        .option-btn { padding: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); background: white; font-weight: 600; cursor: pointer; text-align: left; }
        .input-box { display: flex; gap: 10px; margin-top: 1.5rem; }
        .input-box input { flex: 1; padding: 0.8rem 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); font-size: 1rem; outline: none; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 0 1.5rem; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-plane-up"></i> Quizlet - Unit 14: Let's Go!</div>
    </header>

    <nav class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('flashcards', this)"><i class="fa-solid fa-clone"></i> Thẻ ghi nhớ</button>
        <button class="tab-btn" onclick="switchTab('match', this)"><i class="fa-solid fa-puzzle-piece"></i> Ghép từ</button>
        <button class="tab-btn" onclick="switchTab('quiz', this)"><i class="fa-solid fa-circle-question"></i> Kiểm tra</button>
        <button class="tab-btn" onclick="switchTab('spell', this)"><i class="fa-solid fa-headphones"></i> Luyện nghe & Viết</button>
    </nav>

    <main>
        <select id="categoryFilter" class="filter-select" onchange="filterCategory(this.value)">
            <option value="ALL">Tất cả từ vựng Unit 14 (60+ từ)</option>
            <option value="Travel & Transport">Du lịch & Phương tiện</option>
            <option value="Education & Subjects">Giáo dục & Môn học</option>
            <option value="Places & Geography">Địa điểm & Địa lý</option>
            <option value="General Vocabulary">Từ vựng chung khác</option>
        </select>

        <!-- 1. Flashcards -->
        <div id="flashcards-view" class="view-panel active">
            <div class="flashcard-wrapper">
                <div class="flashcard" id="mainCard" onclick="flipCard()">
                    <div class="card-face card-front">
                        <span class="card-category" id="cardCategory">Category</span>
                        <button class="ai-gen-btn" onclick="generateAIImage(event)"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Ảnh</button>
                        <i class="fa-solid fa-plane" id="cardIcon" style="font-size: 2.8rem; color: var(--primary); margin-bottom: 0.8rem;"></i>
                        <img id="cardImg" style="display:none; max-width: 140px; max-height: 100px; border-radius: 8px; margin-bottom: 0.8rem; object-fit: contain;">
                        <div class="card-word" id="cardWord">abroad</div>
                        <span class="card-type" id="cardType">adv</span>
                        <div class="card-phonetic" id="cardPhonetic">/əˈbrɔːd/</div>
                        <button class="ctrl-btn" style="width: 36px; height: 36px;" onclick="speakWord(event)"><i class="fa-solid fa-volume-high"></i></button>
                    </div>
                    <div class="card-face card-back">
                        <span class="card-category">Nghĩa & Ví dụ</span>
                        <div class="card-meaning" id="cardMeaning">nước ngoài, ở nước ngoài</div>
                        <div class="card-example" id="cardExample">"When are they going abroad?"</div>
                    </div>
                </div>
            </div>
            <div class="controls-bar">
                <button class="ctrl-btn" onclick="prevCard()"><i class="fa-solid fa-arrow-left"></i></button>
                <span id="cardProgress" style="font-weight: bold;">1 / 60</span>
                <button class="ctrl-btn" onclick="nextCard()"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div style="text-align: center; margin-top: 1rem; color: var(--text-muted); font-size: 0.85rem;">
                Dùng phím <kbd>Space</kbd> để lật | Phím <kbd>←</kbd> <kbd>→</kbd> để chuyển thẻ
            </div>
        </div>

        <!-- 2. Match Game -->
        <div id="match-view" class="view-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <div style="font-weight: bold; color: var(--primary);">Thời gian: <span id="matchTimer">0.0</span>s</div>
                <button class="btn-submit" style="padding: 6px 16px;" onclick="startMatch()">Chơi lại</button>
            </div>
            <div class="match-grid" id="matchGrid"></div>
        </div>

        <!-- 3. Quiz -->
        <div id="quiz-view" class="view-panel">
            <div class="quiz-card" id="quizContainer"></div>
        </div>

        <!-- 4. Listen & Spell -->
        <div id="spell-view" class="view-panel">
            <div class="quiz-card" style="text-align: center;">
                <button class="ctrl-btn" style="width: 70px; height: 70px; font-size: 1.8rem; margin: 0 auto 1rem;" onclick="speakSpellWord()"><i class="fa-solid fa-volume-high"></i></button>
                <div>Nghe phát âm và gõ lại từ vựng chính xác:</div>
                <div class="input-box" style="max-width: 400px; margin: 1rem auto;">
                    <input type="text" id="spellInput" placeholder="Nhập từ tiếng Anh..." onkeyup="if(event.key==='Enter') checkSpell()">
                    <button class="btn-submit" onclick="checkSpell()">Gửi</button>
                </div>
                <div id="spellFeedback" style="margin-top: 1rem; font-weight: bold;"></div>
            </div>
        </div>
    </main>

    <script>
        const rawVocabulary = [
            // Travel & Transport
            { word: "abroad", type: "adv", phonetic: "/əˈbrɔːd/", meaning: "nước ngoài, ở nước ngoài", example: "When are they going abroad?", category: "Travel & Transport", icon: "fa-earth-americas" },
            { word: "boat", type: "n", phonetic: "/bəʊt/", meaning: "thuyền, tàu nhỏ", example: "They’re going to have a boat cruise on the River Tagus.", category: "Travel & Transport", icon: "fa-ship" },
            { word: "check in", type: "phr v", phonetic: "/ˌtʃek ˈɪn/", meaning: "nhận phòng, làm thủ tục vào", example: "Let's check in to the hotel before we go for dinner.", category: "Travel & Transport", icon: "fa-hotel" },
            { word: "cruise", type: "n", phonetic: "/kruːz/", meaning: "chuyến đi chơi biển, du ngoạn", example: "They’re going to have a boat cruise on the River Tagus.", category: "Travel & Transport", icon: "fa-ferry" },
            { word: "flight", type: "n", phonetic: "/flaɪt/", meaning: "chuyến bay", example: "They have a flight back to Auckland from London.", category: "Travel & Transport", icon: "fa-plane-departure" },
            { word: "jeep", type: "n", phonetic: "/dʒiːp/", meaning: "xe jíp (xe địa hình)", example: "We're travelling by jeep when we’re on safari.", category: "Travel & Transport", icon: "fa-truck-monster" },
            { word: "motorbike", type: "n", phonetic: "/ˈməʊtəbaɪk/", meaning: "xe máy, xe mô tô", example: "I can't ride a motorbike but I can drive a car.", category: "Travel & Transport", icon: "fa-motorcycle" },
            { word: "overnight", type: "adj", phonetic: "/ˌəʊvəˈnaɪt/", meaning: "qua đêm, suốt đêm", example: "They're taking an overnight ferry to Santander.", category: "Travel & Transport", icon: "fa-moon" },
            { word: "port", type: "n", phonetic: "/pɔːt/", meaning: "cảng, hải cảng", example: "They want to walk round the spice market and the old port.", category: "Travel & Transport", icon: "fa-anchor" },
            { word: "rucksack", type: "n", phonetic: "/ˈrʌksæk/", meaning: "ba lô", example: "I’m not going with anyone. Just me and my rucksack.", category: "Travel & Transport", icon: "fa-bag-shopping" },
            { word: "safari", type: "n", phonetic: "/səˈfɑːri/", meaning: "chuyến dã ngoại ngắm thú hoang", example: "We're travelling by jeep when we’re on safari.", category: "Travel & Transport", icon: "fa-hippo" },
            { word: "transport", type: "n", phonetic: "/ˈtrænspɔːt/", meaning: "phương tiện giao thông", example: "Cars, buses and trains are all forms of transport.", category: "Travel & Transport", icon: "fa-bus" },

            // Education & Subjects
            { word: "biology", type: "n", phonetic: "/baɪˈɒlədʒi/", meaning: "môn sinh học", example: "I studied biology, chemistry and physics at school.", category: "Education & Subjects", icon: "fa-dna" },
            { word: "campus", type: "n", phonetic: "/ˈkæmpəs/", meaning: "khuôn viên trường đại học", example: "They’re going to live on the university campus.", category: "Education & Subjects", icon: "fa-building-columns" },
            { word: "chemistry", type: "n", phonetic: "/ˈkemɪstri/", meaning: "môn hóa học", example: "I studied biology, chemistry and physics at school.", category: "Education & Subjects", icon: "fa-flask" },
            { word: "economics", type: "n", phonetic: "/ˌiːkəˈnɒmɪks/", meaning: "kinh tế học", example: "She is studying English, psychology and economics.", category: "Education & Subjects", icon: "fa-chart-line" },
            { word: "exam", type: "n", phonetic: "/ɪgˈzæm/", meaning: "kỳ thi, bài thi", example: "Good luck in the exam! I hope it goes well.", category: "Education & Subjects", icon: "fa-file-pen" },
            { word: "medicine", type: "n", phonetic: "/ˈmedɪsn/", meaning: "y học, ngành y / thuốc", example: "We studied medicine together at the University.", category: "Education & Subjects", icon: "fa-stethoscope" },
            { word: "modern languages", type: "n pl", phonetic: "/ˌmɒdn ˈlæŋgwɪdʒɪz/", meaning: "các ngôn ngữ hiện đại", example: "She was a student of modern languages.", category: "Education & Subjects", icon: "fa-language" },
            { word: "physics", type: "n", phonetic: "/ˈfɪzɪks/", meaning: "môn vật lý", example: "I studied biology, chemistry and physics at school.", category: "Education & Subjects", icon: "fa-atom" },
            { word: "psychology", type: "n", phonetic: "/saɪˈkɒlədʒi/", meaning: "tâm lý học", example: "She is studying English, psychology and economics.", category: "Education & Subjects", icon: "fa-brain" },

            // Places & Geography
            { word: "across", type: "adv", phonetic: "/əˈkrɒs/", meaning: "qua, băng qua", example: "They're taking a ferry across the Mediterranean Sea.", category: "Places & Geography", icon: "fa-route" },
            { word: "Algeria", type: "n", phonetic: "/ælˈdʒɪəriə/", meaning: "nước An-giê-ri", example: "Algeria and Morocco are in the north of Africa.", category: "Places & Geography", icon: "fa-flag" },
            { word: "bridge", type: "n", phonetic: "/brɪdʒ/", meaning: "cây cầu", example: "They want to see the Golden Gate Bridge in San Francisco.", category: "Places & Geography", icon: "fa-bridge" },
            { word: "Czech", type: "adj", phonetic: "/tʃek/", meaning: "thuộc nước Séc / người Séc", example: "Milena Dušek is Czech. She was born in Prague.", category: "Places & Geography", icon: "fa-earth-europe" },
            { word: "developing countries", type: "n pl", phonetic: "/dɪˌveləpɪŋ ˈkʌntriz/", meaning: "các nước đang phát triển", example: "Archie and Fiona want to work in developing countries.", category: "Places & Geography", icon: "fa-globe" },
            { word: "east", type: "n", phonetic: "/iːst/", meaning: "phía đông", example: "St Francis’ Hospital in the east of Zambia.", category: "Places & Geography", icon: "fa-compass" },
            { word: "Europe", type: "n", phonetic: "/ˈjʊərəp/", meaning: "châu Âu", example: "They're travelling round Europe.", category: "Places & Geography", icon: "fa-earth-europe" },
            { word: "Morocco", type: "n", phonetic: "/məˈrɒkəʊ/", meaning: "nước Ma-rốc", example: "Algeria and Morocco are in the north of Africa.", category: "Places & Geography", icon: "fa-flag" },
            { word: "nightclub", type: "n", phonetic: "/ˈnaɪtklʌb/", meaning: "hộp đêm, quán bar đêm", example: "They want to go to a nightclub in Faro.", category: "Places & Geography", icon: "fa-music" },
            { word: "spice market", type: "n", phonetic: "/ˌspaɪs ˈmɑːkɪt/", meaning: "chợ gia vị", example: "They want to walk round the spice market and the old port.", category: "Places & Geography", icon: "fa-store" },
            { word: "Zambia", type: "n", phonetic: "/ˈzæmbiə/", meaning: "nước Zam-bi-a", example: "Next week they’re going to Zambia, in southern Africa.", category: "Places & Geography", icon: "fa-flag" },

            // General Vocabulary
            { word: "all year round", type: "phr", phonetic: "/ˌɔːl jɪə ˈraʊnd/", meaning: "quanh năm", example: "They're looking forward to living in the sun all year round.", category: "General Vocabulary", icon: "fa-calendar-days" },
            { word: "banana", type: "n", phonetic: "/bəˈnɑːnə/", meaning: "quả chuối", example: "Would you like a banana?", category: "General Vocabulary", icon: "fa-basket-shopping" },
            { word: "carefully", type: "adv", phonetic: "/ˈkeəfəli/", meaning: "một cách cẩn thận", example: "Goodbye! Drive carefully!", category: "General Vocabulary", icon: "fa-shield-halved" },
            { word: "divorced", type: "adj", phonetic: "/dɪˈvɔːst/", meaning: "đã ly hôn, ly dị", example: "My parents are divorced.", category: "General Vocabulary", icon: "fa-user-slash" },
            { word: "event", type: "n", phonetic: "/ɪˈvent/", meaning: "sự kiện", example: "Your first day at school is a big event in life.", category: "General Vocabulary", icon: "fa-calendar-check" },
            { word: "future", type: "n", phonetic: "/ˈfjuːtʃə(r)/", meaning: "tương lai", example: "What are your plans for the future?", category: "General Vocabulary", icon: "fa-hourglass-start" },
            { word: "grow up", type: "phr v", phonetic: "/ˌgrəʊ ˈʌp/", meaning: "lớn lên, trưởng thành", example: "Where did you grow up?", category: "General Vocabulary", icon: "fa-user-large" },
            { word: "hope", type: "v", phonetic: "/həʊp/", meaning: "hy vọng", example: "I hope the family are nice, and I hope I like English food!", category: "General Vocabulary", icon: "fa-hands-holding" },
            { word: "housewife", type: "n", phonetic: "/ˈhaʊswaɪf/", meaning: "người vợ nội trợ", example: "Karlotta Reinhardt is a housewife.", category: "General Vocabulary", icon: "fa-house-user" },
            { word: "how long?", type: "phr", phonetic: "/ˌhaʊ ˈlɒŋ/", meaning: "bao lâu?", example: "How long is Evie going to stay?", category: "General Vocabulary", icon: "fa-circle-question" },
            { word: "journalist", type: "n", phonetic: "/ˈdʒɜːnəlɪst/", meaning: "nhà báo, phóng viên", example: "My father is a journalist, and works for a newspaper.", category: "General Vocabulary", icon: "fa-newspaper" },
            { word: "local", type: "adj", phonetic: "/ˈləʊkl/", meaning: "địa phương, thuộc địa phương", example: "We live near the local school so we walk there everyday.", category: "General Vocabulary", icon: "fa-location-dot" },
            { word: "move", type: "v", phonetic: "/muːv/", meaning: "chuyển đi, di chuyển", example: "We moved to Berlin in 1995.", category: "General Vocabulary", icon: "fa-truck-ramp-box" },
            { word: "nearby", type: "adv", phonetic: "/ˈnɪəbaɪ/", meaning: "gần đó, ở gần", example: "I see my father quite often. He lives nearby.", category: "General Vocabulary", icon: "fa-map-pin" },
            { word: "plan", type: "n", phonetic: "/plæn/", meaning: "kế hoạch", example: "What are your future plans?", category: "General Vocabulary", icon: "fa-clipboard-list" },
            { word: "pleasure", type: "n", phonetic: "/ˈpleʒə(r)/", meaning: "niềm hân hạnh, niềm vui", example: "It was a pleasure. We enjoyed having you.", category: "General Vocabulary", icon: "fa-face-smile-beam" },
            { word: "research company", type: "n", phonetic: "/rɪˈsɜːtʃ ˌkʌmpəni/", meaning: "công ty nghiên cứu", example: "His mother works for the research company, Bayer.", category: "General Vocabulary", icon: "fa-building" },
            { word: "sangria", type: "n", phonetic: "/ˈsæŋɡriə/", meaning: "rượu sangria (rượu vang trái cây)", example: "They want to have sangria and tapas in Madrid.", category: "General Vocabulary", icon: "fa-wine-glass" },
            { word: "tapas", type: "n pl", phonetic: "/ˈtæpəs/", meaning: "món khai vị kiểu Tây Ban Nha", example: "They want to have sangria and tapas in Madrid.", category: "General Vocabulary", icon: "fa-utensils" },
            { word: "there", type: "adv", phonetic: "/ðeə(r)/", meaning: "ở đó, tại đó", example: "I’m going put the photos on Facebook. You can see them there.", category: "General Vocabulary", icon: "fa-hand-point-right" }
        ];

        let dataset = [...rawVocabulary];
        let index = 0;

        function loadCard() {
            document.getElementById('mainCard').classList.remove('flipped');
            let item = dataset[index];
            document.getElementById('cardCategory').innerText = item.category;
            document.getElementById('cardWord').innerText = item.word;
            document.getElementById('cardType').innerText = item.type || 'word';
            document.getElementById('cardPhonetic').innerText = item.phonetic;
            document.getElementById('cardMeaning').innerText = item.meaning;
            document.getElementById('cardExample').innerText = item.example ? `"${item.example}"` : '';
            document.getElementById('cardProgress').innerText = `${index + 1} / ${dataset.length}`;

            let imgEl = document.getElementById('cardImg');
            let iconEl = document.getElementById('cardIcon');
            
            if (item.customImg) {
                imgEl.src = item.customImg;
                imgEl.style.display = 'block';
                iconEl.style.display = 'none';
            } else {
                imgEl.style.display = 'none';
                iconEl.style.display = 'block';
                iconEl.className = `fa-solid ${item.icon || 'fa-plane'}`;
            }
            speakWord();
        }

        function filterCategory(cat) {
            dataset = cat === 'ALL' ? [...rawVocabulary] : rawVocabulary.filter(v => v.category === cat);
            index = 0;
            loadCard();
        }

        function flipCard() { document.getElementById('mainCard').classList.toggle('flipped'); }
        function nextCard() { if(index < dataset.length - 1) { index++; loadCard(); } }
        function prevCard() { if(index > 0) { index--; loadCard(); } }

        function speakWord(e) {
            if(e) e.stopPropagation();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(dataset[index].word);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        // Tích hợp AI Tạo Ảnh trực tiếp từ Pollinations AI
        function generateAIImage(e) {
            e.stopPropagation();
            let btn = e.currentTarget;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang sinh ảnh...';
            
            let word = dataset[index].word;
            let imageUrl = `https://pollinations.ai/p/${encodeURIComponent('simple clean travel illustration of ' + word)}?width=300&height=200&seed=${Math.floor(Math.random()*1000)}`;
            
            let tempImg = new Image();
            tempImg.src = imageUrl;
            tempImg.onload = () => {
                dataset[index].customImg = imageUrl;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Đã tạo ảnh';
                loadCard();
            };
            tempImg.onerror = () => {
                btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Thử lại';
            };
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`${tab}-view`).classList.add('active');
            if(tab === 'match') startMatch();
            if(tab === 'quiz') startQuiz();
            if(tab === 'spell') startSpell();
        }

        // Match Game
        let selectedMatch = [], timerInt, time = 0;
        function startMatch() {
            clearInterval(timerInt);
            time = 0;
            document.getElementById('matchTimer').innerText = '0.0';
            timerInt = setInterval(() => { time += 0.1; document.getElementById('matchTimer').innerText = time.toFixed(1); }, 100);

            let grid = document.getElementById('matchGrid');
            grid.innerHTML = '';
            let items = [...dataset].sort(() => 0.5 - Math.random()).slice(0, 6);
            let cards = [];
            items.forEach((item, i) => {
                cards.push({ id: i, text: item.word });
                cards.push({ id: i, text: item.meaning });
            });
            cards.sort(() => 0.5 - Math.random());
            cards.forEach(c => {
                let div = document.createElement('div');
                div.className = 'match-card';
                div.innerText = c.text;
                div.onclick = () => {
                    if (div.classList.contains('correct') || div.classList.contains('selected')) return;
                    div.classList.add('selected');
                    selectedMatch.push({ el: div, id: c.id });
                    if(selectedMatch.length === 2) {
                        if(selectedMatch[0].id === selectedMatch[1].id) {
                            selectedMatch[0].el.className = 'match-card correct';
                            selectedMatch[1].el.className = 'match-card correct';
                            if(document.querySelectorAll('.match-card:not(.correct)').length === 0) {
                                clearInterval(timerInt);
                                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                            }
                        } else {
                            let a = selectedMatch[0].el, b = selectedMatch[1].el;
                            setTimeout(() => { a.classList.remove('selected'); b.classList.remove('selected'); }, 400);
                        }
                        selectedMatch = [];
                    }
                };
                grid.appendChild(div);
            });
        }

        // Quiz
        let qIndex = 0;
        function startQuiz() { qIndex = 0; renderQuiz(); }
        function renderQuiz() {
            let container = document.getElementById('quizContainer');
            if(qIndex >= Math.min(dataset.length, 5)) {
                container.innerHTML = '<h3>Hoàn thành bài kiểm tra!</h3><button class="btn-submit" style="margin-top:1rem; padding:0.8rem 1.5rem;" onclick="startQuiz()">Làm lại</button>';
                return;
            }
            let q = dataset[qIndex];
            let opts = [q.meaning];
            while(opts.length < 4) {
                let r = rawVocabulary[Math.floor(Math.random()*rawVocabulary.length)].meaning;
                if(!opts.includes(r)) opts.push(r);
            }
            opts.sort(() => 0.5 - Math.random());
            container.innerHTML = `
                <div>Câu ${qIndex + 1}: Từ "<b>${q.word}</b>" (${q.type || 'word'} ${q.phonetic}) nghĩa là gì?</div>
                <div class="options-grid">
                    ${opts.map(o => `<button class="option-btn" onclick="ansQuiz(this, '${o === q.meaning}')">${o}</button>`).join('')}
                </div>
            `;
        }
        function ansQuiz(btn, isCorrect) {
            btn.style.background = isCorrect ? '#23b26d' : '#ff495c';
            btn.style.color = 'white';
            setTimeout(() => { qIndex++; renderQuiz(); }, 800);
        }

        // Spell
        let sIndex = 0;
        function startSpell() { sIndex = 0; document.getElementById('spellInput').value = ''; document.getElementById('spellFeedback').innerText = ''; speakSpellWord(); }
        function speakSpellWord() {
            let u = new SpeechSynthesisUtterance(dataset[sIndex].word);
            u.lang = 'en-US';
            window.speechSynthesis.speak(u);
        }
        function checkSpell() {
            let input = document.getElementById('spellInput').value.trim().toLowerCase();
            let target = dataset[sIndex].word.toLowerCase();
            let fb = document.getElementById('spellFeedback');
            if(input === target) {
                fb.style.color = '#23b26d';
                fb.innerText = 'Chính xác!';
                setTimeout(() => { sIndex = (sIndex + 1) % dataset.length; startSpell(); }, 800);
            } else {
                fb.style.color = '#ff495c';
                fb.innerText = `Chưa đúng! Gợi ý nghĩa: ${dataset[sIndex].meaning}`;
            }
        }

        document.addEventListener('keydown', (e) => {
            if(!document.getElementById('flashcards-view').classList.contains('active')) return;
            if(e.code === 'Space') { e.preventDefault(); flipCard(); }
            if(e.code === 'ArrowRight') nextCard();
            if(e.code === 'ArrowLeft') prevCard();
        });

        window.onload = loadCard;
    </script>
</body>
</html>
