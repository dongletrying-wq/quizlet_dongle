<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizlet Unit 11: We Can Do It!</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #4255ff;
            --primary-hover: #2e3ed4;
            --bg-main: #f6f7fb;
            --card-bg: #ffffff;
            --text-main: #1a1d28;
            --text-muted: #646f90;
            --border-color: #e2e8f0;
            --success: #23b26d;
            --danger: #ff495c;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        
        nav.nav-tabs { display: flex; justify-content: center; gap: 10px; padding: 1rem; background: var(--card-bg); border-bottom: 1px solid var(--border-color); flex-wrap: wrap; }
        .tab-btn { background: transparent; border: none; padding: 10px 18px; border-radius: var(--radius-md); font-weight: 600; color: var(--text-muted); cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .tab-btn:hover { background: #f1f3f9; color: var(--text-main); }
        .tab-btn.active { background: var(--primary); color: white; }

        main { flex: 1; max-width: 800px; width: 100%; margin: 0 auto; padding: 1.5rem 1rem; }
        .view-panel { display: none; }
        .view-panel.active { display: block; }

        .filter-select { padding: 10px 18px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--card-bg); font-weight: 600; margin-bottom: 1rem; outline: none; cursor: pointer; color: var(--text-main); width: 100%; max-width: 360px; }

        /* Flashcard 3D */
        .flashcard-wrapper { perspective: 1000px; width: 100%; height: 380px; margin-bottom: 1.5rem; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); cursor: pointer; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius-lg); background: var(--card-bg); border: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.8rem; text-align: center; }
        .card-back { transform: rotateY(180deg); background: #fafbff; }
        .card-category { position: absolute; top: 15px; left: 20px; font-size: 0.8rem; font-weight: 700; color: var(--primary); background: rgba(66, 85, 255, 0.08); padding: 4px 12px; border-radius: 12px; }
        .ai-gen-btn { position: absolute; top: 15px; right: 20px; background: #f0f4ff; color: var(--primary); border: 1px solid rgba(66, 85, 255, 0.2); padding: 6px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .card-word { font-size: 2.2rem; font-weight: 800; margin-bottom: 0.2rem; }
        .card-type { font-size: 0.9rem; font-weight: 700; color: #8e44ad; background: #f3e8f5; padding: 2px 8px; border-radius: 6px; margin-bottom: 0.4rem; }
        .card-phonetic { font-size: 1rem; color: var(--text-muted); margin-bottom: 0.8rem; font-family: monospace; }
        .card-meaning { font-size: 1.8rem; font-weight: 700; color: var(--primary); margin-bottom: 0.8rem; }
        .card-example { font-size: 0.95rem; color: var(--text-muted); font-style: italic; max-width: 90%; line-height: 1.4; }
        .controls-bar { display: flex; justify-content: space-between; align-items: center; }
        .ctrl-btn { background: var(--card-bg); border: 1px solid var(--border-color); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .ctrl-btn:hover { background: #f1f3f9; }

        /* Match Game */
        .match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .match-card { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: var(--radius-md); height: 100px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0.8rem; font-weight: 700; cursor: pointer; user-select: none; }
        .match-card.selected { border-color: var(--primary); background: rgba(66, 85, 255, 0.08); color: var(--primary); }
        .match-card.correct { border-color: var(--success); background: rgba(35, 178, 109, 0.1); opacity: 0.2; pointer-events: none; }

        /* Quiz & Spell */
        .quiz-card { background: var(--card-bg); padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-md); }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 1.5rem; }
        .option-btn { padding: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); background: white; font-weight: 600; cursor: pointer; text-align: left; transition: 0.2s; }
        .input-box { display: flex; gap: 10px; margin-top: 1.5rem; }
        .input-box input { flex: 1; padding: 0.8rem 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); font-size: 1rem; outline: none; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 0 1.5rem; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-bolt"></i> Quizlet - Unit 11: We Can Do It!</div>
    </header>

    <nav class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('flashcards', this)"><i class="fa-solid fa-clone"></i> Thẻ ghi nhớ</button>
        <button class="tab-btn" onclick="switchTab('match', this)"><i class="fa-solid fa-puzzle-piece"></i> Ghép từ</button>
        <button class="tab-btn" onclick="switchTab('quiz', this)"><i class="fa-solid fa-circle-question"></i> Kiểm tra</button>
        <button class="tab-btn" onclick="switchTab('spell', this)"><i class="fa-solid fa-headphones"></i> Luyện nghe & Viết</button>
    </nav>

    <main>
        <select id="categoryFilter" class="filter-select" onchange="filterCategory(this.value)">
            <option value="ALL">Tất cả từ vựng Unit 11 (49 từ)</option>
            <option value="Abilities & Verbs">Kỹ năng & Động từ</option>
            <option value="Technology & Devices">Công nghệ & Thiết bị</option>
            <option value="Jobs & People">Nghề nghiệp & Con người</option>
            <option value="Adjectives & Adverbs">Tính từ & Trạng từ</option>
            <option value="Communication & Phrases">Giao tiếp & Cụm từ</option>
        </select>

        <!-- 1. Flashcards -->
        <div id="flashcards-view" class="view-panel active">
            <div class="flashcard-wrapper">
                <div class="flashcard" id="mainCard" onclick="flipCard()">
                    <div class="card-face card-front">
                        <span class="card-category" id="cardCategory">Category</span>
                        <button class="ai-gen-btn" onclick="generateAIImage(event)"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Ảnh</button>
                        <i class="fa-solid fa-mobile-screen-button" id="cardIcon" style="font-size: 2.8rem; color: var(--primary); margin-bottom: 0.8rem;"></i>
                        <img id="cardImg" style="display:none; max-width: 140px; max-height: 100px; border-radius: 8px; margin-bottom: 0.8rem; object-fit: contain;">
                        <div class="card-word" id="cardWord">smartphone</div>
                        <span class="card-type" id="cardType">n</span>
                        <div class="card-phonetic" id="cardPhonetic">/ˈsmɑːtfəʊn/</div>
                        <button class="ctrl-btn" style="width: 38px; height: 38px;" onclick="speakWord(event)" title="Phát âm"><i class="fa-solid fa-volume-high"></i></button>
                    </div>
                    <div class="card-face card-back">
                        <span class="card-category">Nghĩa & Ví dụ</span>
                        <div class="card-meaning" id="cardMeaning">điện thoại thông minh</div>
                        <div class="card-example" id="cardExample">"The first smartphone was big and heavy."</div>
                    </div>
                </div>
            </div>
            <div class="controls-bar">
                <button class="ctrl-btn" onclick="prevCard()"><i class="fa-solid fa-arrow-left"></i></button>
                <span id="cardProgress" style="font-weight: bold;">1 / 49</span>
                <button class="ctrl-btn" onclick="nextCard()"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div style="text-align: center; margin-top: 1rem; color: var(--text-muted); font-size: 0.85rem;">
                Dùng phím <kbd>Space</kbd> để lật | Phím <kbd>←</kbd> <kbd>→</kbd> để chuyển thẻ
            </div>
        </div>

        <!-- 2. Match Game -->
        <div id="match-view" class="view-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <div style="font-weight: bold; color: var(--primary);">Thời gian: <span id="matchTimer">0.0</span>s</div>
                <button class="btn-submit" style="padding: 6px 16px;" onclick="startMatch()">Chơi lại</button>
            </div>
            <div class="match-grid" id="matchGrid"></div>
        </div>

        <!-- 3. Quiz -->
        <div id="quiz-view" class="view-panel">
            <div class="quiz-card" id="quizContainer"></div>
        </div>

        <!-- 4. Listen & Spell -->
        <div id="spell-view" class="view-panel">
            <div class="quiz-card" style="text-align: center;">
                <button class="ctrl-btn" style="width: 70px; height: 70px; font-size: 1.8rem; margin: 0 auto 1rem;" onclick="speakSpellWord()"><i class="fa-solid fa-volume-high"></i></button>
                <div>Nghe phát âm và gõ lại từ vựng chính xác:</div>
                <div class="input-box" style="max-width: 400px; margin: 1rem auto;">
                    <input type="text" id="spellInput" placeholder="Nhập từ tiếng Anh..." autocomplete="off" onkeyup="if(event.key==='Enter') checkSpell()">
                    <button class="btn-submit" onclick="checkSpell()">Gửi</button>
                </div>
                <div id="spellFeedback" style="margin-top: 1rem; font-weight: bold; min-height: 24px;"></div>
            </div>
        </div>
    </main>

    <script>
        const rawVocabulary = [
            // Abilities & Verbs
            { word: "build", type: "v", phonetic: "/bɪld/", meaning: "xây dựng", example: "Can you build a house for me?", category: "Abilities & Verbs", icon: "fa-hammer" },
            { word: "chat", type: "v", phonetic: "/tʃæt/", meaning: "tán gẫu, trò chuyện", example: "I can chat to my friends on my computer.", category: "Abilities & Verbs", icon: "fa-comments" },
            { word: "fly", type: "v", phonetic: "/flaɪ/", meaning: "bay, lái (máy bay)", example: "Anna is a pilot. She can fly an Airbus A380.", category: "Abilities & Verbs", icon: "fa-plane" },
            { word: "lock", type: "v", phonetic: "/lɒk/", meaning: "khóa", example: "Our phones can open and lock our front doors.", category: "Abilities & Verbs", icon: "fa-lock" },
            { word: "mend", type: "v", phonetic: "/mend/", meaning: "sửa chữa, vá", example: "Tomas is a mechanic. He can mend cars.", category: "Abilities & Verbs", icon: "fa-wrench" },
            { word: "ride", type: "v", phonetic: "/raɪd/", meaning: "cưỡi (ngựa), chạy (xe đạp)", example: "I can't ride a horse.", category: "Abilities & Verbs", icon: "fa-person-biking" },
            { word: "send", type: "v", phonetic: "/send/", meaning: "gửi", example: "Can you send me a message about it?", category: "Abilities & Verbs", icon: "fa-paper-plane" },
            { word: "surf", type: "v", phonetic: "/sɜːf/", meaning: "lướt (sóng/mạng)", example: "All my Portuguese friends can surf really well.", category: "Abilities & Verbs", icon: "fa-water" },
            { word: "swim", type: "v", phonetic: "/swɪm/", meaning: "bơi", example: "Can cats swim?", category: "Abilities & Verbs", icon: "fa-person-swimming" },
            { word: "text", type: "v", phonetic: "/tekst/", meaning: "nhắn tin", example: "We text all the time, about everything in our lives.", category: "Abilities & Verbs", icon: "fa-message" },
            { word: "try", type: "v", phonetic: "/traɪ/", meaning: "thử, cố gắng", example: "Turn everything off and try again.", category: "Abilities & Verbs", icon: "fa-rotate-right" },
            { word: "understand", type: "v", phonetic: "/ˌʌndəˈstænd/", meaning: "hiểu, am hiểu", example: "Can you understand me now?", category: "Abilities & Verbs", icon: "fa-brain" },
            { word: "use", type: "v", phonetic: "/juːz/", meaning: "sử dụng, dùng", example: "We use our smartphones more than 110 times a day!", category: "Abilities & Verbs", icon: "fa-hand-pointer" },
            { word: "turn off", type: "phr v", phonetic: "/ˌtɜːn ˈɒf/", meaning: "tắt (thiết bị)", example: "Turn everything off and try again.", category: "Abilities & Verbs", icon: "fa-power-off" },
            { word: "get on (the Internet)", type: "phr v", phonetic: "/ɡet ɒn (ði ˈɪntənet)/", meaning: "kết nối, truy cập Internet", example: "I can’t get on the Internet!", category: "Abilities & Verbs", icon: "fa-wifi" },
            { word: "take photos", type: "phr", phonetic: "/ˌteɪk ˈfəʊtəʊz/", meaning: "chụp ảnh", example: "You can take photos with your phone.", category: "Abilities & Verbs", icon: "fa-camera" },

            // Technology & Devices
            { word: "button", type: "n", phonetic: "/ˈbʌtn/", meaning: "nút, nút bấm", example: "Did you press the green button?", category: "Technology & Devices", icon: "fa-toggle-on" },
            { word: "computer games", type: "n pl", phonetic: "/kəmˈpjuːtə ˌgeɪmz/", meaning: "trò chơi máy tính", example: "I'm good at playing computer games.", category: "Technology & Devices", icon: "fa-gamepad" },
            { word: "radio", type: "n", phonetic: "/ˈreɪdiəʊ/", meaning: "đài phát thanh, radio", example: "We can ask our phone what song is on the radio.", category: "Technology & Devices", icon: "fa-radio" },
            { word: "satnav", type: "n", phonetic: "/ˈsætnæv/", meaning: "thiết bị định vị vệ tinh", example: "A satnav app can give us directions when we’re lost.", category: "Technology & Devices", icon: "fa-location-arrow" },
            { word: "smartphone", type: "n", phonetic: "/ˈsmɑːtfəʊn/", meaning: "điện thoại thông minh", example: "The first smartphone was big and heavy.", category: "Technology & Devices", icon: "fa-mobile-screen-button" },
            { word: "the net", type: "n", phonetic: "/ðə ˈnet/", meaning: "mạng internet", example: "The Blackberry sent emails and ‘surfed’ the net.", category: "Technology & Devices", icon: "fa-globe" },
            { word: "ticket machine", type: "n", phonetic: "/ˈtɪkɪt məˌʃiːn/", meaning: "máy bán vé tự động", example: "This ticket machine doesn’t work.", category: "Technology & Devices", icon: "fa-cash-register" },

            // Jobs & People
            { word: "athlete", type: "n", phonetic: "/ˈæθliːt/", meaning: "vận động viên", example: "An athlete can usually run very fast.", category: "Jobs & People", icon: "fa-person-running" },
            { word: "dad", type: "n", phonetic: "/dæd/", meaning: "bố, ba", example: "Dad makes great cakes, and sometimes I help him.", category: "Jobs & People", icon: "fa-user-tie" },
            { word: "film star", type: "n", phonetic: "/ˈfɪlm ˌstɑː(r)/", meaning: "ngôi sao điện ảnh", example: "Who's your favourite film star?", category: "Jobs & People", icon: "fa-star" },
            { word: "grandad", type: "n", phonetic: "/ˈɡrændæd/", meaning: "ông (nội/ngoại)", example: "Can you speak French, Grandad?", category: "Jobs & People", icon: "fa-user-group" },
            { word: "interpreter", type: "n", phonetic: "/ɪnˈtɜːprɪtə(r)/", meaning: "thông dịch viên", example: "He's an interpreter and speaks German and Spanish fluently.", category: "Jobs & People", icon: "fa-language" },
            { word: "mechanic", type: "n", phonetic: "/məˈkænɪk/", meaning: "thợ cơ khí, thợ sửa máy", example: "Tomas is a mechanic. He can mend cars.", category: "Jobs & People", icon: "fa-screwdriver-wrench" },
            { word: "pilot", type: "n", phonetic: "/ˈpaɪlət/", meaning: "phi công", example: "Anna is a pilot. She can fly an Airbus A380.", category: "Jobs & People", icon: "fa-user-astronaut" },
            { word: "schoolgirl", type: "n", phonetic: "/ˈskuːlɡɜːl/", meaning: "nữ sinh", example: "Her name is Elina, and she’s a schoolgirl.", category: "Jobs & People", icon: "fa-graduation-cap" },

            // Adjectives & Adverbs
            { word: "better", type: "adj", phonetic: "/ˈbetə(r)/", meaning: "tốt hơn", example: "I’m sorry. Is this better?", category: "Adjectives & Adverbs", icon: "fa-thumbs-up" },
            { word: "clever", type: "adj", phonetic: "/ˈklevə(r)/", meaning: "thông minh, lanh lợi", example: "Wow! That is clever.", category: "Adjectives & Adverbs", icon: "fa-lightbulb" },
            { word: "dangerous", type: "adj", phonetic: "/ˈdeɪndʒərəs/", meaning: "nguy hiểm", example: "Is it a dangerous sport?", category: "Adjectives & Adverbs", icon: "fa-triangle-exclamation" },
            { word: "fluently", type: "adv", phonetic: "/ˈfluːəntli/", meaning: "trôi chảy, lưu loát", example: "She can speak French fluently.", category: "Adjectives & Adverbs", icon: "fa-comment-dots" },
            { word: "heavy", type: "adj", phonetic: "/ˈhevi/", meaning: "nặng, nặng nề", example: "The first smartphone was big and heavy.", category: "Adjectives & Adverbs", icon: "fa-weight-hanging" },
            { word: "kind", type: "adj", phonetic: "/kaɪnd/", meaning: "tốt bụng, tử tế", example: "That’s so kind of you!", category: "Adjectives & Adverbs", icon: "fa-heart" },
            { word: "lost", type: "adj", phonetic: "/lɒst/", meaning: "bị lạc, lạc đường", example: "A satnav app can give us directions when we’re lost.", category: "Adjectives & Adverbs", icon: "fa-map-location-dot" },
            { word: "popular", type: "adj", phonetic: "/ˈbɒpjələ(r)/", meaning: "phổ biến, được yêu thích", example: "Apple’s first iPhone was very popular.", category: "Adjectives & Adverbs", icon: "fa-fire" },
            { word: "safe", type: "adj", phonetic: "/seɪf/", meaning: "an toàn", example: "It isn't dangerous, it's safe.", category: "Adjectives & Adverbs", icon: "fa-shield" },
            { word: "slowly", type: "adv", phonetic: "/ˈsləʊli/", meaning: "chậm rãi, từ từ", example: "Please speak more slowly.", category: "Adjectives & Adverbs", icon: "fa-gauge-low" },
            { word: "terrible", type: "adj", phonetic: "/ˈterəbl/", meaning: "tồi tệ, dở tệ", example: "Don’t tell Mum, but I’m terrible at French.", category: "Adjectives & Adverbs", icon: "fa-face-frown" },
            { word: "worldwide", type: "adv", phonetic: "/ˈwɜːldwaɪd/", meaning: "trên toàn thế giới", example: "Today Samsung sells the most smartphones worldwide.", category: "Adjectives & Adverbs", icon: "fa-earth-americas" },
            { word: "young", type: "adj", phonetic: "/jʌŋ/", meaning: "trẻ, trẻ tuổi", example: "I spend time with my wife and two young daughters.", category: "Adjectives & Adverbs", icon: "fa-child" },

            // Communication & Phrases
            { word: "a little bit", type: "phr", phonetic: "/ə ˈlɪtl ˌbɪt/", meaning: "một chút, một ít", example: "Can you speak German? A little bit.", category: "Communication & Phrases", icon: "fa-sliders" },
            { word: "accident", type: "n", phonetic: "/ˈæksɪdənt/", meaning: "tai nạn, sự cố", example: "There was an accident on my way to work.", category: "Communication & Phrases", icon: "fa-car-burst" },
            { word: "bill", type: "n", phonetic: "/bɪl/", meaning: "hóa đơn", example: "I pay bills on my smartphone.", category: "Communication & Phrases", icon: "fa-file-invoice-dollar" },
            { word: "chess", type: "n", phonetic: "/tʃes/", meaning: "cờ vua", example: "We can play chess with a friend thousands of miles away.", category: "Communication & Phrases", icon: "fa-chess" },
            { word: "good at", type: "phr", phonetic: "/ˈɡʊd æt/", meaning: "giỏi việc gì", example: "I'm good at playing computer games.", category: "Communication & Phrases", icon: "fa-award" },
            { word: "guitar", type: "n", phonetic: "/gɪˈtɑː(r)/", meaning: "đàn ghi-ta", example: "Can you play the guitar?", category: "Communication & Phrases", icon: "fa-guitar" },
            { word: "history", type: "n", phonetic: "/ˈhɪstri/", meaning: "lịch sử", example: "The history of the smartphone starts at IBM in 1993.", category: "Communication & Phrases", icon: "fa-book-bookmark" },
            { word: "lift", type: "n", phonetic: "/lɪft/", meaning: "sự đi nhờ xe", example: "Can I give you a lift? Oh yes please!", category: "Communication & Phrases", icon: "fa-car" },
            { word: "musical instrument", type: "n", phonetic: "/ˌmjuːzɪkl ˈɪnstrəmənt/", meaning: "nhạc cụ", example: "Are you any good at playing a musical instrument?", category: "Communication & Phrases", icon: "fa-music" },
            { word: "really well", type: "phr", phonetic: "/ˌriːəli ˈwel/", meaning: "rất giỏi, cực kỳ tốt", example: "All my Portuguese friends can surf really well.", category: "Communication & Phrases", icon: "fa-star" },
            { word: "violin", type: "n", phonetic: "/ˌvaɪəˈlɪn/", meaning: "đàn vi-ô-lông (vĩ cầm)", example: "She can play the violin really well.", category: "Communication & Phrases", icon: "fa-music" },
            { word: "What’s the matter?", type: "phr", phonetic: "/ˌwɒts ðə ˈmætə(r)/", meaning: "Có chuyện gì thế?", example: "Oh no! What’s the matter?", category: "Communication & Phrases", icon: "fa-circle-question" }
        ];

        let dataset = [...rawVocabulary];
        let index = 0;
        let systemVoices = [];

        // Hệ thống phát âm an toàn, tự nạp voice chuẩn
        function initVoices() {
            if ('speechSynthesis' in window) {
                systemVoices = window.speechSynthesis.getVoices();
            }
        }
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = initVoices;
            initVoices();
        }

        function playAudioText(text) {
            if (!('speechSynthesis' in window)) {
                alert("Trình duyệt của bạn không hỗ trợ tính năng đọc âm thanh Web Speech API.");
                return;
            }
            window.speechSynthesis.cancel();
            
            // Xử lý loại bỏ dấu ngoặc đơn khi phát âm (ví dụ: "get on (the Internet)")
            let cleanText = text.replace(/[()]/g, '').trim();
            let utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = 'en-US';
            utterance.rate = 0.88;

            if (systemVoices.length === 0) systemVoices = window.speechSynthesis.getVoices();
            let englishVoice = systemVoices.find(v => v.lang.startsWith('en') && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Samantha')));
            if (!englishVoice) englishVoice = systemVoices.find(v => v.lang.startsWith('en'));
            if (englishVoice) utterance.voice = englishVoice;

            window.speechSynthesis.speak(utterance);
        }

        function loadCard() {
            document.getElementById('mainCard').classList.remove('flipped');
            let item = dataset[index];
            document.getElementById('cardCategory').innerText = item.category;
            document.getElementById('cardWord').innerText = item.word;
            document.getElementById('cardType').innerText = item.type || 'word';
            document.getElementById('cardPhonetic').innerText = item.phonetic;
            document.getElementById('cardMeaning').innerText = item.meaning;
            document.getElementById('cardExample').innerText = item.example ? `"${item.example}"` : '';
            document.getElementById('cardProgress').innerText = `${index + 1} / ${dataset.length}`;

            let imgEl = document.getElementById('cardImg');
            let iconEl = document.getElementById('cardIcon');
            
            if (item.customImg) {
                imgEl.src = item.customImg;
                imgEl.style.display = 'block';
                iconEl.style.display = 'none';
            } else {
                imgEl.style.display = 'none';
                iconEl.style.display = 'block';
                iconEl.className = `fa-solid ${item.icon || 'fa-bolt'}`;
            }
        }

        function filterCategory(cat) {
            dataset = cat === 'ALL' ? [...rawVocabulary] : rawVocabulary.filter(v => v.category === cat);
            index = 0;
            loadCard();
        }

        function flipCard() { document.getElementById('mainCard').classList.toggle('flipped'); }
        function nextCard() { if (index < dataset.length - 1) { index++; loadCard(); } }
        function prevCard() { if (index > 0) { index--; loadCard(); } }

        function speakWord(e) {
            if (e) e.stopPropagation();
            if (dataset[index]) playAudioText(dataset[index].word);
        }

        function generateAIImage(e) {
            e.stopPropagation();
            let btn = e.currentTarget;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang tạo...';
            
            let word = dataset[index].word;
            let imageUrl = `https://pollinations.ai/p/${encodeURIComponent('minimal clean modern graphic icon of ' + word)}?width=300&height=200&seed=${Math.floor(Math.random()*1000)}`;
            
            let tempImg = new Image();
            tempImg.src = imageUrl;
            tempImg.onload = () => {
                dataset[index].customImg = imageUrl;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Đã tạo ảnh';
                loadCard();
            };
            tempImg.onerror = () => {
                btn.innerHTML = '<i class="fa-solid fa-rotate-right"></i> Thử lại';
            };
        }

        function switchTab(tab, btn) {
            window.speechSynthesis.cancel();
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`${tab}-view`).classList.add('active');
            if (tab === 'match') startMatch();
            if (tab === 'quiz') startQuiz();
            if (tab === 'spell') startSpell();
        }

        // Match Game
        let selectedMatch = [], timerInt, time = 0;
        function startMatch() {
            clearInterval(timerInt);
            time = 0;
            document.getElementById('matchTimer').innerText = '0.0';
            timerInt = setInterval(() => { time += 0.1; document.getElementById('matchTimer').innerText = time.toFixed(1); }, 100);

            let grid = document.getElementById('matchGrid');
            grid.innerHTML = '';
            let items = [...dataset].sort(() => 0.5 - Math.random()).slice(0, 6);
            let cards = [];
            items.forEach((item, i) => {
                cards.push({ id: i, text: item.word });
                cards.push({ id: i, text: item.meaning });
            });
            cards.sort(() => 0.5 - Math.random());
            cards.forEach(c => {
                let div = document.createElement('div');
                div.className = 'match-card';
                div.innerText = c.text;
                div.onclick = () => {
                    if (div.classList.contains('correct') || div.classList.contains('selected')) return;
                    div.classList.add('selected');
                    selectedMatch.push({ el: div, id: c.id });
                    if (selectedMatch.length === 2) {
                        if (selectedMatch[0].id === selectedMatch[1].id) {
                            selectedMatch[0].el.className = 'match-card correct';
                            selectedMatch[1].el.className = 'match-card correct';
                            if (document.querySelectorAll('.match-card:not(.correct)').length === 0) {
                                clearInterval(timerInt);
                                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                            }
                        } else {
                            let a = selectedMatch[0].el, b = selectedMatch[1].el;
                            setTimeout(() => { a.classList.remove('selected'); b.classList.remove('selected'); }, 400);
                        }
                        selectedMatch = [];
                    }
                };
                grid.appendChild(div);
            });
        }

        // Quiz
        let qIndex = 0;
        function startQuiz() { qIndex = 0; renderQuiz(); }
        function renderQuiz() {
            let container = document.getElementById('quizContainer');
            if (qIndex >= Math.min(dataset.length, 5)) {
                container.innerHTML = '<h3>Hoàn thành bài kiểm tra!</h3><button class="btn-submit" style="margin-top:1rem; padding:0.8rem 1.5rem;" onclick="startQuiz()">Làm lại</button>';
                return;
            }
            let q = dataset[qIndex];
            let opts = [q.meaning];
            while (opts.length < 4) {
                let r = rawVocabulary[Math.floor(Math.random() * rawVocabulary.length)].meaning;
                if (!opts.includes(r)) opts.push(r);
            }
            opts.sort(() => 0.5 - Math.random());
            container.innerHTML = `
                <div>Câu ${qIndex + 1}: Từ "<b>${q.word}</b>" (${q.type || 'word'} ${q.phonetic}) nghĩa là gì?</div>
                <div class="options-grid">
                    ${opts.map(o => `<button class="option-btn" onclick="ansQuiz(this, ${o === q.meaning})">${o}</button>`).join('')}
                </div>
            `;
        }
        function ansQuiz(btn, isCorrect) {
            btn.style.background = isCorrect ? '#23b26d' : '#ff495c';
            btn.style.color = 'white';
            setTimeout(() => { qIndex++; renderQuiz(); }, 800);
        }

        // Spell & Listen
        let sIndex = 0;
        function startSpell() { 
            sIndex = 0; 
            document.getElementById('spellInput').value = ''; 
            document.getElementById('spellFeedback').innerText = ''; 
            // Người dùng click vào tab đã thỏa mãn user gesture nên có thể gọi phát âm trực tiếp
            speakSpellWord(); 
        }

        function speakSpellWord() {
            if (dataset[sIndex]) playAudioText(dataset[sIndex].word);
        }

        function checkSpell() {
            let input = document.getElementById('spellInput').value.trim().toLowerCase();
            // Chuẩn hóa so sánh (bỏ bớt phần ghi chú trong ngoặc đơn nếu có)
            let target = dataset[sIndex].word.toLowerCase().replace(/[()]/g, '').trim();
            let rawTarget = dataset[sIndex].word.toLowerCase().trim();
            let fb = document.getElementById('spellFeedback');

            if (input === target || input === rawTarget) {
                fb.style.color = 'var(--success)';
                fb.innerText = 'Chính xác!';
                setTimeout(() => { 
                    sIndex = (sIndex + 1) % dataset.length; 
                    document.getElementById('spellInput').value = '';
                    fb.innerText = '';
                    speakSpellWord();
                }, 900);
            } else {
                fb.style.color = 'var(--danger)';
                fb.innerText = `Chưa đúng! Gợi ý: "${dataset[sIndex].meaning}"`;
            }
        }

        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('flashcards-view').classList.contains('active')) return;
            if (e.code === 'Space') { e.preventDefault(); flipCard(); }
            if (e.code === 'ArrowRight') nextCard();
            if (e.code === 'ArrowLeft') prevCard();
        });

        window.onload = loadCard;
    </script>
</body>
</html>
