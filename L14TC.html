<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 14: 天氣這麼冷！ (Thời tiết lạnh thế này!) - Flashcard & Game</title>
    <!-- Google Font Noto Serif TC (Khải Thể / Phồn Thể chuẩn nét thư pháp giáo trình) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #2980b9;
            --primary-hover: #1f618d;
            --bg-main: #f0f8ff;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #d4e6f1;
            --success: #27ae60;
            --danger: #e74c3c;
            --warning: #e67e22;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-md: 0 10px 25px rgba(41, 128, 185, 0.08);
            --font-kai: 'DFKai-SB', 'BiauKai', 'KaiTi', 'STKaiti', 'KaiTi_GB2312', 'Noto Serif TC', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.3rem; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .logo span { font-family: var(--font-kai); font-weight: normal; }
        
        nav.nav-tabs { display: flex; justify-content: center; gap: 8px; padding: 0.8rem; background: var(--card-bg); border-bottom: 1px solid var(--border-color); flex-wrap: wrap; }
        .tab-btn { background: transparent; border: none; padding: 10px 18px; border-radius: var(--radius-md); font-weight: 700; color: var(--text-muted); cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
        .tab-btn:hover { background: #ebf5fb; color: var(--primary); }
        .tab-btn.active { background: var(--primary); color: white; }

        main { flex: 1; max-width: 800px; width: 100%; margin: 0 auto; padding: 1.5rem 1rem; }
        .view-panel { display: none; }
        .view-panel.active { display: block; }

        .filter-select { padding: 10px 18px; border-radius: 20px; border: 1.5px solid var(--border-color); background: var(--card-bg); font-weight: 700; margin-bottom: 1.2rem; outline: none; cursor: pointer; color: var(--text-main); width: 100%; max-width: 420px; font-size: 0.95rem; }

        /* Flashcard 3D */
        .flashcard-wrapper { perspective: 1000px; width: 100%; height: 410px; margin-bottom: 1.5rem; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); cursor: pointer; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius-lg); background: var(--card-bg); border: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.8rem; text-align: center; }
        .card-back { transform: rotateY(180deg); background: #fffdf9; }
        .card-category { position: absolute; top: 16px; left: 20px; font-size: 0.8rem; font-weight: 700; color: var(--primary); background: rgba(41, 128, 185, 0.08); padding: 5px 14px; border-radius: 12px; }
        .ai-gen-btn { position: absolute; top: 16px; right: 20px; background: #ebf5fb; color: var(--primary); border: 1px solid rgba(41, 128, 185, 0.2); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        
        .card-hanzi { font-family: var(--font-kai); font-size: 4.2rem; font-weight: normal; margin-bottom: 0.1rem; color: #1e272e; letter-spacing: 2px; }
        .card-pinyin { font-size: 1.35rem; color: #d35400; margin-bottom: 0.4rem; font-weight: 700; }
        .card-type { font-size: 0.85rem; font-weight: 700; color: #8e44ad; background: #f4ecf7; padding: 2px 10px; border-radius: 6px; margin-bottom: 0.8rem; }
        .card-meaning { font-size: 1.9rem; font-weight: 800; color: var(--primary); margin-bottom: 0.8rem; }
        .card-note { font-size: 1rem; color: var(--text-muted); font-style: italic; max-width: 90%; line-height: 1.4; }
        .controls-bar { display: flex; justify-content: space-between; align-items: center; }
        .ctrl-btn { background: var(--card-bg); border: 1px solid var(--border-color); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; color: var(--text-main); transition: 0.2s; }
        .ctrl-btn:hover { background: #ebf5fb; color: var(--primary); }

        /* Sub-navigation & Luyện Chữ & Nghĩa */
        .sub-nav { display: flex; justify-content: center; background: #e0f2fe; border-radius: 12px; padding: 4px; margin-bottom: 2rem; }
        .sub-btn { flex: 1; border: none; background: transparent; padding: 10px 14px; font-weight: 700; font-size: 0.95rem; border-radius: 9px; cursor: pointer; color: var(--text-muted); transition: 0.2s; text-align: center; }
        .sub-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

        .tag-badge { background: #e0f2fe; color: #0369a1; padding: 4px 14px; border-radius: 20px; font-weight: 800; font-size: 0.8rem; letter-spacing: 0.5px; display: inline-block; text-transform: uppercase; }
        .review-badge { background: #fef3c7; color: #b45309; padding: 4px 12px; border-radius: 20px; font-weight: 800; font-size: 0.78rem; margin-left: 6px; display: inline-block; }
        .hanzi-display { font-family: var(--font-kai); font-size: 5rem; font-weight: normal; color: #1e272e; margin: 0.5rem 0 0.8rem; }
        .sound-circle-btn { width: 48px; height: 48px; border-radius: 50%; background: #edf2f7; border: none; color: #4a5568; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 1.25rem; transition: 0.2s; margin-bottom: 1.2rem; }
        .sound-circle-btn:hover { background: #e2e8f0; color: var(--primary); }

        /* Anki Status Bar */
        .anki-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; font-weight: 800; font-size: 0.92rem; flex-wrap: wrap; gap: 8px; }
        .stat-pill { padding: 5px 12px; border-radius: 12px; }
        .stat-mastered { color: var(--success); background: rgba(39, 174, 96, 0.12); }
        .stat-left { color: var(--warning); background: rgba(230, 126, 34, 0.12); }

        /* Match Game */
        .match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .match-card { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: var(--radius-md); height: 100px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0.8rem; font-weight: 700; cursor: pointer; user-select: none; font-size: 1.15rem; transition: 0.2s; }
        .match-card.hanzi-font { font-family: var(--font-kai); font-size: 1.65rem; font-weight: normal; }
        .match-card.selected { border-color: var(--primary); background: rgba(41, 128, 185, 0.08); color: var(--primary); transform: scale(1.02); }
        .match-card.correct { border-color: var(--success); background: rgba(39, 174, 96, 0.1); opacity: 0.2; pointer-events: none; }

        /* Quiz & Spell */
        .quiz-card { background: var(--card-bg); padding: 2.2rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-md); text-align: center; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 1rem; }
        .option-btn { padding: 1.1rem; border: 2px solid #edf2f7; border-radius: var(--radius-md); background: white; font-weight: 700; cursor: pointer; text-align: center; font-size: 1.15rem; color: #2d3748; transition: 0.2s; }
        .option-btn:hover:not(:disabled) { border-color: var(--primary); background: #f0f7fc; }
        .option-btn:disabled { cursor: default; }
        .input-box { display: flex; gap: 10px; margin-top: 1.5rem; }
        .input-box input { flex: 1; padding: 0.9rem 1.2rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); font-size: 1.15rem; outline: none; }
        .input-box input:disabled { background: #f8f9fa; color: #7f8c8d; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 0 1.4rem; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }

        .btn-next-spell {
            display: none;
            margin: 1.2rem auto 0;
            padding: 0.85rem 2rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 1.05rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-next-spell:hover { background: var(--primary-hover); transform: translateY(-1px); }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-snowflake"></i> Bài 14: <span>天氣這麼冷！</span> (Thời tiết lạnh thế này!)</div>
    </header>

    <nav class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('flashcards', this)"><i class="fa-solid fa-clone"></i> Thẻ Ghi Nhớ 3D</button>
        <button class="tab-btn" onclick="switchTab('quiz', this)"><i class="fa-solid fa-circle-question"></i> Luyện Chữ & Nghĩa (Anki)</button>
        <button class="tab-btn" onclick="switchTab('match', this)"><i class="fa-solid fa-puzzle-piece"></i> Ghép Cặp (Match Game)</button>
        <button class="tab-btn" onclick="switchTab('spell', this)"><i class="fa-solid fa-headphones"></i> Luyện Nghe & Viết (Anki)</button>
    </nav>

    <main>
        <select id="categoryFilter" class="filter-select" onchange="filterCategory(this.value)">
            <option value="ALL">Tất cả bài học (32 mục)</option>
            <option value="Thời tiết & Hiện tượng">Thời tiết & Hiện tượng (天氣與自然)</option>
            <option value="Bốn mùa & Thời gian">Bốn mùa & Thời gian (四季與時間)</option>
            <option value="Từ vựng Phần I">Từ vựng Phần I</option>
            <option value="Từ vựng Phần II">Từ vựng Phần II</option>
            <option value="Địa danh & Cụm từ">Địa danh & Cụm từ thường dùng</option>
        </select>

        <!-- 1. Flashcards -->
        <div id="flashcards-view" class="view-panel active">
            <div class="flashcard-wrapper">
                <div class="flashcard" id="mainCard" onclick="flipCard()">
                    <div class="card-face card-front">
                        <span class="card-category" id="cardCategory">Category</span>
                        <button class="ai-gen-btn" onclick="generateAIImage(event)"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Ảnh</button>
                        <i class="fa-solid fa-cloud-sun" id="cardIcon" style="font-size: 2.6rem; color: var(--primary); margin-bottom: 0.6rem;"></i>
                        <img id="cardImg" style="display:none; max-width: 140px; max-height: 90px; border-radius: 8px; margin-bottom: 0.6rem; object-fit: contain;">
                        <div class="card-hanzi" id="cardHanzi">天氣</div>
                        <div class="card-pinyin" id="cardPinyin">tiānqì</div>
                        <span class="card-type" id="cardType">N</span>
                        <button class="ctrl-btn" style="width: 38px; height: 38px; margin-top: 4px;" onclick="speakCurrentWord(event)"><i class="fa-solid fa-volume-high"></i></button>
                    </div>
                    <div class="card-face card-back">
                        <span class="card-category">Dịch nghĩa & Ghi chú</span>
                        <div class="card-meaning" id="cardMeaning">thời tiết</div>
                        <div class="card-note" id="cardNote"></div>
                    </div>
                </div>
            </div>
            <div class="controls-bar">
                <button class="ctrl-btn" onclick="prevCard()"><i class="fa-solid fa-arrow-left"></i></button>
                <span id="cardProgress" style="font-weight: 800; font-size: 1.1rem;">1 / 32</span>
                <button class="ctrl-btn" onclick="nextCard()"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div style="text-align: center; margin-top: 1.2rem; color: var(--text-muted); font-size: 0.9rem;">
                Phím <kbd>Space</kbd> để lật thẻ | Phím <kbd>←</kbd> <kbd>→</kbd> để chuyển thẻ
            </div>
        </div>

        <!-- 2. Luyện Chữ & Nghĩa (Anki Mode) -->
        <div id="quiz-view" class="view-panel">
            <div class="sub-nav">
                <button class="sub-btn active" id="btnModePinyin" onclick="setQuizMode('hanzi_to_pinyin')">Chữ Hán → Pinyin</button>
                <button class="sub-btn" id="btnModeMeaning" onclick="setQuizMode('hanzi_to_meaning')">Chữ Hán → Nghĩa Tiếng Việt</button>
            </div>
            <div class="quiz-card" id="quizContainer"></div>
        </div>

        <!-- 3. Match Game -->
        <div id="match-view" class="view-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <div style="font-weight: 800; color: var(--primary); font-size: 1.1rem;">Thời gian phản xạ: <span id="matchTimer">0.0</span>s</div>
                <button class="btn-submit" style="padding: 8px 18px;" onclick="startMatch()">Chơi lại</button>
            </div>
            <div class="match-grid" id="matchGrid"></div>
        </div>

        <!-- 4. Listen & Spell (Anki Mode) -->
        <div id="spell-view" class="view-panel">
            <div class="quiz-card" id="spellCard"></div>
        </div>
    </main>

    <script>
        const rawVocabulary = [
            // Weather & Nature
            { word: "天氣", pinyin: "tiānqì", type: "N", meaning: "thời tiết", note: "Khí hậu thời tiết hàng ngày", category: "Thời tiết & Hiện tượng", icon: "fa-cloud-sun" },
            { word: "冷", pinyin: "lěng", type: "Vs", meaning: "lạnh", note: "Nhiệt độ thấp, cảm giác giá buốt", category: "Thời tiết & Hiện tượng", icon: "fa-temperature-low" },
            { word: "風", pinyin: "fēng", type: "N", meaning: "gió", note: "Gió trời", category: "Thời tiết & Hiện tượng", icon: "fa-wind" },
            { word: "滑雪", pinyin: "huáxuě", type: "V-sep", meaning: "trượt tuyết", note: "Môn thể thao mùa đông trên tuyết", category: "Thời tiết & Hiện tượng", icon: "fa-person-skiing" },
            { word: "下雪", pinyin: "xiàxuě", type: "V-sep", meaning: "tuyết rơi", note: "Hiện tượng tuyết rơi", category: "Thời tiết & Hiện tượng", icon: "fa-snowflake" },
            { word: "雨", pinyin: "yǔ", type: "N", meaning: "mưa", note: "Cơn mưa", category: "Thời tiết & Hiện tượng", icon: "fa-cloud-showers-heavy" },
            { word: "傘", pinyin: "sǎn", type: "N", meaning: "ô, dù", note: "Vật che mưa nắng", category: "Thời tiết & Hiện tượng", icon: "fa-umbrella" },
            { word: "颱風", pinyin: "táifēng", type: "N", meaning: "bão", note: "Bão nhiệt đới thường đổ bộ vào mùa hè ở Đài Loan", category: "Thời tiết & Hiện tượng", icon: "fa-tornado" },
            { word: "濕", pinyin: "shī", type: "Vs", meaning: "ẩm, ướt", note: "Độ ẩm cao, ướt át", category: "Thời tiết & Hiện tượng", icon: "fa-droplet" },
            { word: "停", pinyin: "tíng", type: "Vp", meaning: "dừng, tạnh (mưa), ngừng", note: "Ngừng rơi mưa (雨停了) hoặc dừng lại", category: "Thời tiết & Hiện tượng", icon: "fa-circle-stop" },

            // Four Seasons & Time
            { word: "春天", pinyin: "chūntiān", type: "N", meaning: "mùa xuân", note: "Mùa bắt đầu của năm, ấm áp", category: "Bốn mùa & Thời gian", icon: "fa-seedling" },
            { word: "夏天", pinyin: "xiàtiān", type: "N", meaning: "mùa hè", note: "Mùa hạ nóng bức", category: "Bốn mùa & Thời gian", icon: "fa-sun" },
            { word: "秋天", pinyin: "qiūtiān", type: "N", meaning: "mùa thu", note: "Mùa thu mát mẻ, lá chuyển đỏ", category: "Bốn mùa & Thời gian", icon: "fa-leaf" },
            { word: "冬天", pinyin: "dōngtiān", type: "N", meaning: "mùa đông", note: "Mùa cuối năm giá lạnh", category: "Bốn mùa & Thời gian", icon: "fa-icicles" },
            { word: "新年", pinyin: "xīnnián", type: "N", meaning: "năm mới", note: "Tết, năm mới", category: "Bốn mùa & Thời gian", icon: "fa-calendar-star" },
            { word: "明年", pinyin: "míngnián", type: "N", meaning: "năm sau, năm sang", note: "Năm kế tiếp", category: "Bốn mùa & Thời gian", icon: "fa-calendar-plus" },
            { word: "十二月底", pinyin: "shí'èryuè dǐ", type: "N", meaning: "cuối tháng 12", note: "Thời điểm cuối năm", category: "Bốn mùa & Thời gian", icon: "fa-calendar-check" },

            // Vocabulary I
            { word: "想", pinyin: "xiǎng", type: "Vst", meaning: "nhớ (ai đó)", note: "Nhớ nhung gia đình, bạn bè (想父母)", category: "Từ vựng Phần I", icon: "fa-heart" },
            { word: "快", pinyin: "kuài", type: "Adv", meaning: "sắp, mau", note: "Phó từ biểu thị sự việc sắp xảy ra", category: "Từ vựng Phần I", icon: "fa-bolt" },
            { word: "父母", pinyin: "fùmǔ", type: "N", meaning: "cha mẹ, phụ mẫu", note: "Bố và mẹ", category: "Từ vựng Phần I", icon: "fa-people-roof" },
            { word: "紅葉", pinyin: "hóngyè", type: "N", meaning: "lá đỏ, lá phong đỏ", note: "Lá phong đỏ vào mùa thu", category: "Từ vựng Phần I", icon: "fa-tree" },
            { word: "只", pinyin: "zhǐ", type: "Adv", meaning: "chỉ, vỏn vẹn", note: "Phó từ giới hạn phạm vi", category: "Từ vựng Phần I", icon: "fa-asterisk" },

            // Vocabulary II
            { word: "要", pinyin: "yào", type: "Vaux", meaning: "sắp (trong 快要...了)", note: "Biểu thị sự việc sắp sửa diễn ra", category: "Từ vựng Phần II", icon: "fa-hourglass-half" },
            { word: "討厭", pinyin: "tǎoyàn", type: "Vs/V", meaning: "ghét, đáng ghét, khó chịu", note: "Tâm trạng không thích, ghét thời tiết ẩm ướt", category: "Từ vựng Phần II", icon: "fa-face-frown" },
            { word: "新聞", pinyin: "xīnwén", type: "N", meaning: "tin tức, thời sự", note: "Bản tin dự báo thời tiết, sự kiện", category: "Từ vựng Phần II", icon: "fa-newspaper" },
            { word: "更", pinyin: "gèng", type: "Adv", meaning: "càng, hơn", note: "Phó từ chỉ mức độ tăng thêm", category: "Từ vựng Phần II", icon: "fa-arrow-up-right-dots" },
            { word: "大家", pinyin: "dàjiā", type: "N", meaning: "mọi người", note: "Tất cả mọi người", category: "Từ vựng Phần II", icon: "fa-users" },
            { word: "小心", pinyin: "xiǎoxīn", type: "Vs/V", meaning: "cẩn thận, chú ý", note: "Nhắc nhở chú ý an toàn", category: "Từ vựng Phần II", icon: "fa-triangle-exclamation" },
            { word: "可怕", pinyin: "kěpà", type: "Vs", meaning: "đáng sợ", note: "Gây cảm giác khiếp sợ (ví dụ bão to)", category: "Từ vựng Phần II", icon: "fa-skull" },

            // Names & Phrases
            { word: "玉山", pinyin: "Yùshān", type: "N", meaning: "Núi Ngọc (Yushan)", note: "Ngọn núi cao nhất Đài Loan (gần 4.000m, mùa đông có tuyết)", category: "Địa danh & Cụm từ", icon: "fa-mountain" },
            { word: "紐約", pinyin: "Niǔyuē", type: "N", meaning: "New York", note: "Thành phố New York (Mỹ)", category: "Địa danh & Cụm từ", icon: "fa-city" },
            { word: "慢走", pinyin: "màn zǒu", type: "Phr", meaning: "Đi thong thả, đi cẩn thận", note: "Lời chào lịch sự của chủ nhà khi tiễn khách ra về", category: "Địa danh & Cụm từ", icon: "fa-person-walking-arrow-right" }
        ];

        let dataset = [...rawVocabulary];
        let index = 0;

        // Quản lý TTS đa nền tảng
        let synth = window.speechSynthesis;
        let voices = [];
        function loadVoices() {
            if ('speechSynthesis' in window) voices = synth.getVoices();
        }
        loadVoices();
        if ('speechSynthesis' in window && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        function playSound(text) {
            if (!('speechSynthesis' in window)) return;
            synth.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            utterance.rate = 0.85;
            if (voices.length > 0) {
                let zhVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh-CN') || v.lang.startsWith('zh'));
                if (zhVoice) utterance.voice = zhVoice;
            }
            synth.speak(utterance);
        }

        function loadCard() {
            document.getElementById('mainCard').classList.remove('flipped');
            let item = dataset[index];
            document.getElementById('cardCategory').innerText = item.category;
            document.getElementById('cardHanzi').innerText = item.word;
            document.getElementById('cardPinyin').innerText = item.pinyin;
            document.getElementById('cardType').innerText = item.type || 'N';
            document.getElementById('cardMeaning').innerText = item.meaning;
            document.getElementById('cardNote').innerText = item.note ? item.note : '';
            document.getElementById('cardProgress').innerText = `${index + 1} / ${dataset.length}`;

            let imgEl = document.getElementById('cardImg');
            let iconEl = document.getElementById('cardIcon');
            
            if (item.customImg) {
                imgEl.src = item.customImg;
                imgEl.style.display = 'block';
                iconEl.style.display = 'none';
            } else {
                imgEl.style.display = 'none';
                iconEl.style.display = 'block';
                iconEl.className = `fa-solid ${item.icon || 'fa-cloud-sun'}`;
            }
        }

        function filterCategory(cat) {
            dataset = cat === 'ALL' ? [...rawVocabulary] : rawVocabulary.filter(v => v.category === cat);
            index = 0;
            loadCard();
            if(document.getElementById('quiz-view').classList.contains('active')) startQuiz();
            if(document.getElementById('match-view').classList.contains('active')) startMatch();
            if(document.getElementById('spell-view').classList.contains('active')) startSpell();
        }

        function flipCard() { document.getElementById('mainCard').classList.toggle('flipped'); }
        function nextCard() { if(index < dataset.length - 1) { index++; loadCard(); } }
        function prevCard() { if(index > 0) { index--; loadCard(); } }
        function speakCurrentWord(e) { if(e) e.stopPropagation(); playSound(dataset[index].word); }

        function generateAIImage(e) {
            e.stopPropagation();
            let btn = e.currentTarget;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang tạo...';
            let query = dataset[index].meaning.split(',')[0].trim();
            let imageUrl = `https://pollinations.ai/p/${encodeURIComponent('Taiwan winter weather and beautiful four seasons scenery illustration of ' + query)}?width=300&height=200&seed=${Math.floor(Math.random()*1000)}`;
            let tempImg = new Image();
            tempImg.src = imageUrl;
            tempImg.onload = () => {
                dataset[index].customImg = imageUrl;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Đã tạo';
                loadCard();
            };
            tempImg.onerror = () => { btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Thử lại'; };
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`${tab}-view`).classList.add('active');
            if(tab === 'match') startMatch();
            if(tab === 'quiz') startQuiz();
            if(tab === 'spell') startSpell();
        }

        /* =========================================
           2. LUYỆN CHỮ & NGHĨA (CƠ CHẾ ANKI)
           ========================================= */
        let quizQueue = [];
        let quizMastered = 0;
        let quizTotal = 0;
        let quizMode = 'hanzi_to_pinyin';
        let quizLocked = false;

        function setQuizMode(mode) {
            quizMode = mode;
            document.getElementById('btnModePinyin').classList.toggle('active', mode === 'hanzi_to_pinyin');
            document.getElementById('btnModeMeaning').classList.toggle('active', mode === 'hanzi_to_meaning');
            startQuiz();
        }

        function startQuiz() {
            quizQueue = dataset.map(item => ({ ...item, isReview: false }));
            quizMastered = 0;
            quizTotal = quizQueue.length;
            quizLocked = false;
            renderQuiz();
        }

        function renderQuiz() {
            let container = document.getElementById('quizContainer');
            if (quizQueue.length === 0) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                container.innerHTML = `
                    <h2 style="color:var(--primary); margin-bottom: 0.5rem;">🎉 Xuất sắc! Bạn đã thuộc hết!</h2>
                    <p style="color:var(--text-muted); font-size: 1.05rem;">Đã hoàn thành <strong>${quizMastered} / ${quizTotal}</strong> từ vựng trong danh mục này.</p>
                    <button class="btn-submit" style="margin:1.5rem auto 0; display:inline-block; padding:0.8rem 2rem;" onclick="startQuiz()">Luyện tập lại</button>
                `;
                return;
            }

            quizLocked = false;
            let q = quizQueue[0];
            let isPinyinMode = quizMode === 'hanzi_to_pinyin';
            let correctVal = isPinyinMode ? q.pinyin : q.meaning;

            let pool = rawVocabulary.map(item => isPinyinMode ? item.pinyin : item.meaning).filter(val => val !== correctVal);
            let opts = [correctVal];
            while (opts.length < 4 && pool.length > 0) {
                let randIdx = Math.floor(Math.random() * pool.length);
                let randVal = pool.splice(randIdx, 1)[0];
                if (!opts.includes(randVal)) opts.push(randVal);
            }
            opts.sort(() => 0.5 - Math.random());

            container.innerHTML = `
                <div class="anki-bar">
                    <span class="stat-pill stat-mastered"><i class="fa-solid fa-check"></i> Đã thuộc: ${quizMastered} / ${quizTotal}</span>
                    <span class="stat-pill stat-left"><i class="fa-solid fa-rotate"></i> Còn lại: ${quizQueue.length}</span>
                </div>
                <div>
                    <span class="tag-badge">${q.category}</span>
                    ${q.isReview ? '<span class="review-badge">Ôn lại</span>' : ''}
                </div>
                <div class="hanzi-display">${q.word}</div>
                <div>
                    <button class="sound-circle-btn" onclick="playSound('${q.word}')" title="Phát âm">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>
                <div class="options-grid">
                    ${opts.map(opt => `<button class="option-btn" data-correct="${opt === correctVal}" onclick="checkQuizAnswer(this, ${opt === correctVal})">${opt}</button>`).join('')}
                </div>
            `;
        }

        function checkQuizAnswer(btn, isCorrect) {
            if (quizLocked) return;
            quizLocked = true;

            const allBtns = document.querySelectorAll('#quizContainer .option-btn');
            allBtns.forEach(b => b.disabled = true);

            const currentItem = quizQueue.shift();

            if (isCorrect) {
                btn.style.background = 'var(--success)';
                btn.style.borderColor = 'var(--success)';
                btn.style.color = 'white';
                quizMastered++;
                setTimeout(renderQuiz, 550);
            } else {
                btn.style.background = 'var(--danger)';
                btn.style.borderColor = 'var(--danger)';
                btn.style.color = 'white';

                allBtns.forEach(b => {
                    if (b.getAttribute('data-correct') === 'true') {
                        b.style.background = 'var(--success)';
                        b.style.borderColor = 'var(--success)';
                        b.style.color = 'white';
                    }
                });

                currentItem.isReview = true;
                const insertPos = Math.min(3, quizQueue.length);
                quizQueue.splice(insertPos, 0, currentItem);

                setTimeout(renderQuiz, 1100);
            }
        }

        /* =========================================
           3. MATCH GAME
           ========================================= */
        let selectedMatch = [], timerInt, time = 0;
        function startMatch() {
            clearInterval(timerInt);
            time = 0;
            selectedMatch = [];
            document.getElementById('matchTimer').innerText = '0.0';
            timerInt = setInterval(() => { time += 0.1; document.getElementById('matchTimer').innerText = time.toFixed(1); }, 100);

            let grid = document.getElementById('matchGrid');
            grid.innerHTML = '';
            let items = [...dataset].sort(() => 0.5 - Math.random()).slice(0, 6);
            let cards = [];
            items.forEach((item, i) => {
                cards.push({ id: i, text: `${item.word}`, isHanzi: true });
                cards.push({ id: i, text: `${item.meaning}`, isHanzi: false });
            });
            cards.sort(() => 0.5 - Math.random());
            cards.forEach(c => {
                let div = document.createElement('div');
                div.className = 'match-card' + (c.isHanzi ? ' hanzi-font' : '');
                div.innerText = c.text;
                div.onclick = () => {
                    if (div.classList.contains('correct') || div.classList.contains('selected')) return;
                    div.classList.add('selected');
                    selectedMatch.push({ el: div, id: c.id });
                    if(selectedMatch.length === 2) {
                        if(selectedMatch[0].id === selectedMatch[1].id) {
                            selectedMatch[0].el.className = 'match-card correct';
                            selectedMatch[1].el.className = 'match-card correct';
                            if(document.querySelectorAll('.match-card:not(.correct)').length === 0) {
                                clearInterval(timerInt);
                                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                            }
                        } else {
                            let a = selectedMatch[0].el, b = selectedMatch[1].el;
                            setTimeout(() => { a.classList.remove('selected'); b.classList.remove('selected'); }, 400);
                        }
                        selectedMatch = [];
                    }
                };
                grid.appendChild(div);
            });
        }

        /* =========================================
           4. LUYỆN NGHE & VIẾT (CƠ CHẾ ANKI + NÚT TIẾP THEO)
           ========================================= */
        let spellQueue = [];
        let currentSpellItem = null;
        let spellMastered = 0;
        let spellTotal = 0;
        let spellLocked = false;

        function startSpell() {
            spellQueue = dataset.map(item => ({ ...item, isReview: false }));
            spellMastered = 0;
            spellTotal = spellQueue.length;
            spellLocked = false;
            renderSpell();
        }

        function renderSpell() {
            const card = document.getElementById('spellCard');
            if (spellQueue.length === 0) {
                currentSpellItem = null;
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                card.innerHTML = `
                    <h2 style="color:var(--primary); margin-bottom: 0.6rem;">🎉 Hoàn thành Luyện Nghe & Viết!</h2>
                    <p style="font-size: 1.1rem; color: var(--text-muted); margin-bottom: 0.5rem;">
                        Bạn đã nghe và viết đúng toàn bộ <strong style="color: var(--success);">${spellMastered} / ${spellTotal}</strong> từ.
                    </p>
                    <button class="btn-submit" style="margin-top: 1.2rem; padding: 0.8rem 2rem;" onclick="startSpell()">Luyện tập lại</button>
                `;
                return;
            }

            spellLocked = false;
            currentSpellItem = spellQueue[0];

            card.innerHTML = `
                <div class="anki-bar">
                    <span class="stat-pill stat-mastered"><i class="fa-solid fa-check"></i> Đã thuộc: ${spellMastered} / ${spellTotal}</span>
                    <span class="stat-pill stat-left"><i class="fa-solid fa-rotate"></i> Còn lại: ${spellQueue.length}</span>
                </div>
                <div style="margin-bottom: 0.8rem;">
                    <span class="tag-badge">${currentSpellItem.category}</span>
                    ${currentSpellItem.isReview ? '<span class="review-badge">Ôn lại</span>' : ''}
                </div>
                <button class="ctrl-btn" style="width: 75px; height: 75px; font-size: 2rem; margin: 0 auto 1.2rem; color: var(--primary);" onclick="speakSpellWord()" title="Nghe lại">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <div style="font-size: 1.05rem; font-weight: 600;">Nghe phát âm và gõ lại chữ Hán (hoặc Pinyin không dấu):</div>
                <div class="input-box" style="max-width: 480px; margin: 1.2rem auto;">
                    <input type="text" id="spellInput" placeholder="Nhập chữ Hán hoặc pinyin..." onkeyup="if(event.key==='Enter') checkSpell()">
                    <button class="btn-submit" id="btnCheckSpell" onclick="checkSpell()">Kiểm tra</button>
                    <button class="btn-submit" id="btnSkipSpell" style="background: #95a5a6; padding: 0 1rem;" onclick="skipSpellWord()">Bỏ qua</button>
                </div>
                <div id="spellFeedback" style="margin-top: 1.2rem; font-weight: 800; font-size: 1.05rem; min-height: 28px; line-height: 1.6;"></div>
                <button id="nextSpellBtn" class="btn-next-spell" onclick="renderSpell()">
                    Từ tiếp theo <i class="fa-solid fa-arrow-right"></i>
                </button>
            `;

            document.getElementById('spellInput').focus();
            speakSpellWord();
        }

        function speakSpellWord() {
            if (currentSpellItem) playSound(currentSpellItem.word);
        }

        function showSpellNextState() {
            document.getElementById('spellInput').disabled = true;
            document.getElementById('btnCheckSpell').disabled = true;
            document.getElementById('btnSkipSpell').disabled = true;
            const nextBtn = document.getElementById('nextSpellBtn');
            nextBtn.style.display = 'inline-flex';
            nextBtn.focus();
        }

        function checkSpell() {
            if (spellLocked || spellQueue.length === 0) return;

            const inputEl = document.getElementById('spellInput');
            let input = inputEl.value.trim().toLowerCase();
            if (!input) return;

            spellLocked = true;
            const current = spellQueue.shift();
            currentSpellItem = current;

            let targetWord = current.word.toLowerCase();
            let validPinyins = current.pinyin
                .split('/')
                .map(p => p.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/['\s]+/g, '').toLowerCase());
            let rawInput = input.replace(/['\s]+/g, '');
            let fb = document.getElementById('spellFeedback');

            if (input === targetWord || validPinyins.includes(rawInput)) {
                spellMastered++;
                fb.style.color = '#27ae60';
                fb.innerHTML = `
                    <div><i class="fa-solid fa-circle-check"></i> Chính xác!</div>
                    <div style="margin-top: 4px; color: #1e272e;">
                        <span style="font-family:var(--font-kai); font-size:1.8rem; font-weight:normal;">${current.word}</span>
                        <span style="color:#d35400; margin: 0 6px;">(${current.pinyin})</span>
                        — <span style="color:var(--primary);">${current.meaning}</span>
                    </div>
                `;
            } else {
                fb.style.color = '#e74c3c';
                fb.innerHTML = `
                    <div><i class="fa-solid fa-circle-xmark"></i> Chưa đúng! Từ này sẽ xuất hiện lại để bạn ôn.</div>
                    <div style="margin-top: 4px; color: #1e272e;">
                        Đáp án: <span style="font-family:var(--font-kai); font-size:1.8rem; font-weight:normal;">${current.word}</span>
                        <span style="color:#d35400; margin: 0 6px;">(${current.pinyin})</span>
                        — <span style="color:var(--primary);">${current.meaning}</span>
                    </div>
                `;

                current.isReview = true;
                const insertPos = Math.min(3, spellQueue.length);
                spellQueue.splice(insertPos, 0, current);
            }

            showSpellNextState();
        }

        function skipSpellWord() {
            if (spellLocked || spellQueue.length === 0) return;
            spellLocked = true;
            const current = spellQueue.shift();
            currentSpellItem = current;

            let fb = document.getElementById('spellFeedback');
            fb.style.color = '#7f8c8d';
            fb.innerHTML = `
                <div>Đã bỏ qua — Từ này sẽ xuất hiện lại trong danh sách ôn!</div>
                <div style="margin-top: 4px; color: #1e272e;">
                    Đáp án: <span style="font-family:var(--font-kai); font-size:1.8rem; font-weight:normal;">${current.word}</span>
                    <span style="color:#d35400; margin: 0 6px;">(${current.pinyin})</span>
                    — <span style="color:var(--primary);">${current.meaning}</span>
                </div>
            `;

            current.isReview = true;
            const insertPos = Math.min(3, spellQueue.length);
            spellQueue.splice(insertPos, 0, current);

            showSpellNextState();
        }

        document.addEventListener('keydown', (e) => {
            if(!document.getElementById('flashcards-view').classList.contains('active')) return;
            if(e.code === 'Space') { e.preventDefault(); flipCard(); }
            if(e.code === 'ArrowRight') nextCard();
            if(e.code === 'ArrowLeft') prevCard();
        });

        window.onload = loadCard;
    </script>
</body>
</html>
