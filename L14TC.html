<!-- 4. Listen & Spell -->
        <div id="spell-view" class="view-panel">
            <div class="quiz-card" id="spellCard">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; font-weight: 800; font-size: 0.95rem;">
                    <span style="color: var(--text-muted);">Tiến độ: <span id="spellProgress">1 / 31</span></span>
                    <span style="color: var(--success); background: rgba(39, 174, 96, 0.1); padding: 4px 12px; border-radius: 12px;">
                        Đúng: <span id="spellScore">0</span>
                    </span>
                </div>
                <button class="ctrl-btn" style="width: 75px; height: 75px; font-size: 2rem; margin: 0 auto 1.2rem; color: var(--primary);" onclick="speakSpellWord()">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <div style="font-size: 1.05rem; font-weight: 600;">Nghe phát âm và gõ lại chữ Hán (hoặc Pinyin không dấu):</div>
                <div class="input-box" style="max-width: 460px; margin: 1.2rem auto;">
                    <input type="text" id="spellInput" placeholder="Nhập chữ Hán hoặc pinyin..." onkeyup="if(event.key==='Enter') checkSpell()">
                    <button class="btn-submit" onclick="checkSpell()">Kiểm tra</button>
                    <button class="btn-submit" style="background: #95a5a6; padding: 0 1rem;" onclick="skipSpellWord()">Bỏ qua</button>
                </div>
                <div id="spellFeedback" style="margin-top: 1rem; font-weight: 800; font-size: 1.05rem; min-height: 28px;"></div>
            </div>
        </div>
