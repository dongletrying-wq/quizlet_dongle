<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizlet Unit 1: Family and Friends</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #4255ff;
            --primary-hover: #2e3ed4;
            --bg-main: #f6f7fb;
            --card-bg: #ffffff;
            --text-main: #1a1d28;
            --text-muted: #646f90;
            --border-color: #e2e8f0;
            --success: #23b26d;
            --danger: #ff495c;
            --radius-lg: 16px;
            --radius-md: 12px;
            --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.4rem; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        
        nav.nav-tabs { display: flex; justify-content: center; gap: 10px; padding: 1rem; background: var(--card-bg); border-bottom: 1px solid var(--border-color); flex-wrap: wrap; }
        .tab-btn { background: transparent; border: none; padding: 10px 18px; border-radius: var(--radius-md); font-weight: 600; color: var(--text-muted); cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .tab-btn:hover { background: #f1f3f9; color: var(--text-main); }
        .tab-btn.active { background: var(--primary); color: white; }

        main { flex: 1; max-width: 800px; width: 100%; margin: 0 auto; padding: 1.5rem 1rem; }
        .view-panel { display: none; }
        .view-panel.active { display: block; }

        .filter-select { padding: 8px 16px; border-radius: 20px; border: 1px solid var(--border-color); background: var(--card-bg); font-weight: 600; margin-bottom: 1rem; outline: none; cursor: pointer; }

        /* Flashcard 3D */
        .flashcard-wrapper { perspective: 1000px; width: 100%; height: 360px; margin-bottom: 1.5rem; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); cursor: pointer; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius-lg); background: var(--card-bg); border: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 2rem; text-align: center; }
        .card-back { transform: rotateY(180deg); background: #fafbff; }
        .card-category { position: absolute; top: 15px; left: 20px; font-size: 0.8rem; font-weight: 700; color: var(--primary); background: rgba(66, 85, 255, 0.08); padding: 4px 12px; border-radius: 12px; }
        .ai-gen-btn { position: absolute; top: 15px; right: 20px; background: #f0f4ff; color: var(--primary); border: 1px solid rgba(66, 85, 255, 0.2); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .card-word { font-size: 2.2rem; font-weight: 800; margin-bottom: 0.4rem; }
        .card-phonetic { font-size: 1rem; color: var(--text-muted); margin-bottom: 1rem; font-family: monospace; }
        .card-meaning { font-size: 1.8rem; font-weight: 700; color: var(--primary); }
        .controls-bar { display: flex; justify-content: space-between; align-items: center; }
        .ctrl-btn { background: var(--card-bg); border: 1px solid var(--border-color); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; }

        /* Match Game */
        .match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .match-card { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: var(--radius-md); height: 100px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0.8rem; font-weight: 700; cursor: pointer; user-select: none; }
        .match-card.selected { border-color: var(--primary); background: rgba(66, 85, 255, 0.08); color: var(--primary); }
        .match-card.correct { border-color: var(--success); background: rgba(35, 178, 109, 0.1); opacity: 0.2; pointer-events: none; }

        /* Quiz & Spell */
        .quiz-card { background: var(--card-bg); padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-md); }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 1.5rem; }
        .option-btn { padding: 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); background: white; font-weight: 600; cursor: pointer; text-align: left; }
        .input-box { display: flex; gap: 10px; margin-top: 1.5rem; }
        .input-box input { flex: 1; padding: 0.8rem 1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); font-size: 1rem; outline: none; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 0 1.5rem; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-users"></i> Quizlet - Unit 1: Family & Friends</div>
    </header>

    <nav class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('flashcards', this)"><i class="fa-solid fa-clone"></i> Thẻ ghi nhớ</button>
        <button class="tab-btn" onclick="switchTab('match', this)"><i class="fa-solid fa-puzzle-piece"></i> Ghép từ</button>
        <button class="tab-btn" onclick="switchTab('quiz', this)"><i class="fa-solid fa-circle-question"></i> Kiểm tra</button>
        <button class="tab-btn" onclick="switchTab('spell', this)"><i class="fa-solid fa-headphones"></i> Luyện nghe & Viết</button>
    </nav>

    <main>
        <select id="categoryFilter" class="filter-select" onchange="filterCategory(this.value)">
            <option value="ALL">Tất cả từ vựng</option>
            <option value="Family Members">Thành viên gia đình</option>
            <option value="Housework">Công việc nhà</option>
            <option value="Adjectives & Prepositions">Tính từ + Giới từ</option>
            <option value="Personality">Tính cách</option>
            <option value="Appearance">Ngoại hình</option>
        </select>

        <!-- 1. Flashcards -->
        <div id="flashcards-view" class="view-panel active">
            <div class="flashcard-wrapper">
                <div class="flashcard" id="mainCard" onclick="flipCard()">
                    <div class="card-face card-front">
                        <span class="card-category" id="cardCategory">Category</span>
                        <button class="ai-gen-btn" onclick="generateAIImage(event)"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Ảnh</button>
                        <i class="fa-solid fa-heart" id="cardIcon" style="font-size: 3rem; color: var(--primary); margin-bottom: 1rem;"></i>
                        <img id="cardImg" style="display:none; max-width: 100px; margin-bottom: 1rem;">
                        <div class="card-word" id="cardWord">Aunt</div>
                        <div class="card-phonetic" id="cardPhonetic">/ɑːnt/</div>
                        <button class="ctrl-btn" style="width: 36px; height: 36px;" onclick="speakWord(event)"><i class="fa-solid fa-volume-high"></i></button>
                    </div>
                    <div class="card-face card-back">
                        <span class="card-category">Nghĩa Tiếng Việt</span>
                        <div class="card-meaning" id="cardMeaning">cô, dì, thím, mợ</div>
                    </div>
                </div>
            </div>
            <div class="controls-bar">
                <button class="ctrl-btn" onclick="prevCard()"><i class="fa-solid fa-arrow-left"></i></button>
                <span id="cardProgress" style="font-weight: bold;">1 / 50</span>
                <button class="ctrl-btn" onclick="nextCard()"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div style="text-align: center; margin-top: 1rem; color: var(--text-muted); font-size: 0.85rem;">
                Dùng phím <kbd>Space</kbd> để lật | Phím <kbd>←</kbd> <kbd>→</kbd> để chuyển thẻ
            </div>
        </div>

        <!-- 2. Match Game -->
        <div id="match-view" class="view-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <div style="font-weight: bold; color: var(--primary);">Thời gian: <span id="matchTimer">0.0</span>s</div>
                <button class="btn-submit" style="padding: 6px 16px;" onclick="startMatch()">Chơi lại</button>
            </div>
            <div class="match-grid" id="matchGrid"></div>
        </div>

        <!-- 3. Quiz -->
        <div id="quiz-view" class="view-panel">
            <div class="quiz-card" id="quizContainer"></div>
        </div>

        <!-- 4. Listen & Spell -->
        <div id="spell-view" class="view-panel">
            <div class="quiz-card" style="text-align: center;">
                <button class="ctrl-btn" style="width: 70px; height: 70px; font-size: 1.8rem; margin: 0 auto 1rem;" onclick="speakSpellWord()"><i class="fa-solid fa-volume-high"></i></button>
                <div>Nghe phát âm và gõ lại từ vựng chính xác:</div>
                <div class="input-box" style="max-width: 400px; margin: 1rem auto;">
                    <input type="text" id="spellInput" placeholder="Nhập từ tiếng Anh..." onkeyup="if(event.key==='Enter') checkSpell()">
                    <button class="btn-submit" onclick="checkSpell()">Gửi</button>
                </div>
                <div id="spellFeedback" style="margin-top: 1rem; font-weight: bold;"></div>
            </div>
        </div>
    </main>

    <script>
        const rawVocabulary = [
            // Family
            { word: "Aunt", meaning: "cô, dì, thím, mợ", category: "Family Members", phonetic: "/ɑːnt/" },
            { word: "Uncle", meaning: "chú, bác, cậu, dượng", category: "Family Members", phonetic: "/ˈʌŋ.kəl/" },
            { word: "Cousin", meaning: "anh, chị, em họ", category: "Family Members", phonetic: "/ˈkʌz.ən/" },
            { word: "Nephew", meaning: "cháu trai (con của anh/chị/em)", category: "Family Members", phonetic: "/ˈnef.juː/" },
            { word: "Niece", meaning: "cháu gái (con của anh/chị/em)", category: "Family Members", phonetic: "/niːs/" },
            { word: "Stepbrother", meaning: "anh/em trai kế", category: "Family Members", phonetic: "/ˈstepˌbrʌð.ər/" },
            { word: "Stepsister", meaning: "chị/em gái kế", category: "Family Members", phonetic: "/ˈstepˌsɪs.tər/" },
            
            // Housework
            { word: "Clean the house", meaning: "dọn dẹp nhà cửa", category: "Housework", phonetic: "/kliːn ðə haʊs/" },
            { word: "Do the ironing", meaning: "là/ủi quần áo", category: "Housework", phonetic: "/duː ðə ˈaɪə.nɪŋ/" },
            { word: "Do the washing", meaning: "giặt giũ quần áo", category: "Housework", phonetic: "/duː ðə ˈwɒʃ.ɪŋ/" },
            { word: "Set the table", meaning: "dọn bàn ăn", category: "Housework", phonetic: "/set ðə ˈteɪ.bəl/" },
            { word: "Load the dishwasher", meaning: "xếp bát vào máy rửa", category: "Housework", phonetic: "/ləʊd ðə ˈdɪʃˌwɒʃ.ər/" },

            // Adjectives & Prepositions
            { word: "Excited about", meaning: "hào hứng về...", category: "Adjectives & Prepositions", phonetic: "/ɪkˈsaɪ.tɪd əˈbaʊt/" },
            { word: "Famous for", meaning: "nổi tiếng về...", category: "Adjectives & Prepositions", phonetic: "/ˈfeɪ.məs fɔːr/" },
            { word: "Frightened of", meaning: "sợ hãi...", category: "Adjectives & Prepositions", phonetic: "/ˈfraɪ.tənd ɒv/" },
            { word: "Good at", meaning: "giỏi về...", category: "Adjectives & Prepositions", phonetic: "/ɡʊd æt/" },
            { word: "Proud of", meaning: "tự hào về...", category: "Adjectives & Prepositions", phonetic: "/praʊd ɒv/" },
            { word: "Similar to", meaning: "giống với...", category: "Adjectives & Prepositions", phonetic: "/ˈsɪm.ɪ.lər tuː/" },

            // Personality
            { word: "Brave", meaning: "dũng cảm", category: "Personality", phonetic: "/breɪv/" },
            { word: "Creative", meaning: "sáng tạo", category: "Personality", phonetic: "/kriˈeɪ.tɪv/" },
            { word: "Patient", meaning: "kiên nhẫn", category: "Personality", phonetic: "/ˈpeɪ.ʃənt/" },
            { word: "Sensible", meaning: "biết điều, khôn ngoan", category: "Personality", phonetic: "/ˈsen.sə.bəl/" },
            { word: "Moody", meaning: "dễ thay đổi tâm trạng", category: "Personality", phonetic: "/ˈmuː.di/" },
            { word: "Selfish", meaning: "ích kỷ", category: "Personality", phonetic: "/ˈsel.fɪʃ/" },

            // Appearance
            { word: "Attractive", meaning: "thu hút, lôi cuốn", category: "Appearance", phonetic: "/əˈtræk.tɪv/" },
            { word: "Good-looking", meaning: "ưa nhìn, đẹp trai/gái", category: "Appearance", phonetic: "/ˌɡʊdˈlʊk.ɪŋ/" },
            { word: "Curly hair", meaning: "tóc xoăn", category: "Appearance", phonetic: "/ˈkɜː.li heər/" },
            { word: "Wavy hair", meaning: "tóc gợn sóng", category: "Appearance", phonetic: "/ˈweɪ.vi heər/" },
            { word: "Beard", meaning: "râu quai nón", category: "Appearance", phonetic: "/bɪəd/" },
            { word: "Moustache", meaning: "ria mép", category: "Appearance", phonetic: "/məsˈtɑːʃ/" }
        ];

        let dataset = [...rawVocabulary];
        let index = 0;

        function loadCard() {
            document.getElementById('mainCard').classList.remove('flipped');
            let item = dataset[index];
            document.getElementById('cardCategory').innerText = item.category;
            document.getElementById('cardWord').innerText = item.word;
            document.getElementById('cardPhonetic').innerText = item.phonetic;
            document.getElementById('cardMeaning').innerText = item.meaning;
            document.getElementById('cardProgress').innerText = `${index + 1} / ${dataset.length}`;

            let imgEl = document.getElementById('cardImg');
            let iconEl = document.getElementById('cardIcon');
            if (item.customImg) {
                imgEl.src = item.customImg;
                imgEl.style.display = 'block';
                iconEl.style.display = 'none';
            } else {
                imgEl.style.display = 'none';
                iconEl.style.display = 'block';
            }
            speakWord();
        }

        function filterCategory(cat) {
            dataset = cat === 'ALL' ? [...rawVocabulary] : rawVocabulary.filter(v => v.category === cat);
            index = 0;
            loadCard();
        }

        function flipCard() { document.getElementById('mainCard').classList.toggle('flipped'); }
        function nextCard() { if(index < dataset.length - 1) { index++; loadCard(); } }
        function prevCard() { if(index > 0) { index--; loadCard(); } }

        function speakWord(e) {
            if(e) e.stopPropagation();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let utterance = new SpeechSynthesisUtterance(dataset[index].word);
                utterance.lang = 'en-US';
                window.speechSynthesis.speak(utterance);
            }
        }

        function generateAIImage(e) {
            e.stopPropagation();
            let btn = e.currentTarget;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            setTimeout(() => {
                let svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="80" viewBox="0 0 100 80"><rect width="100" height="80" rx="10" fill="#4255ff" opacity="0.2"/><text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-weight="bold" fill="#4255ff">${dataset[index].word}</text></svg>`;
                dataset[index].customImg = 'data:image/svg+xml;base64,' + btoa(svg);
                btn.innerHTML = '<i class="fa-solid fa-check"></i>';
                loadCard();
            }, 500);
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`${tab}-view`).classList.add('active');
            if(tab === 'match') startMatch();
            if(tab === 'quiz') startQuiz();
            if(tab === 'spell') startSpell();
        }

        // Match Game
        let selectedMatch = [], timerInt, time = 0;
        function startMatch() {
            clearInterval(timerInt);
            time = 0;
            document.getElementById('matchTimer').innerText = '0.0';
            timerInt = setInterval(() => { time += 0.1; document.getElementById('matchTimer').innerText = time.toFixed(1); }, 100);

            let grid = document.getElementById('matchGrid');
            grid.innerHTML = '';
            let items = [...dataset].sort(() => 0.5 - Math.random()).slice(0, 6);
            let cards = [];
            items.forEach((item, i) => {
                cards.push({ id: i, text: item.word });
                cards.push({ id: i, text: item.meaning });
            });
            cards.sort(() => 0.5 - Math.random());
            cards.forEach(c => {
                let div = document.createElement('div');
                div.className = 'match-card';
                div.innerText = c.text;
                div.onclick = () => {
                    if (div.classList.contains('correct') || div.classList.contains('selected')) return;
                    div.classList.add('selected');
                    selectedMatch.push({ el: div, id: c.id });
                    if(selectedMatch.length === 2) {
                        if(selectedMatch[0].id === selectedMatch[1].id) {
                            selectedMatch[0].el.className = 'match-card correct';
                            selectedMatch[1].el.className = 'match-card correct';
                            if(document.querySelectorAll('.match-card:not(.correct)').length === 0) clearInterval(timerInt);
                        } else {
                            let a = selectedMatch[0].el, b = selectedMatch[1].el;
                            setTimeout(() => { a.classList.remove('selected'); b.classList.remove('selected'); }, 400);
                        }
                        selectedMatch = [];
                    }
                };
                grid.appendChild(div);
            });
        }

        // Quiz
        let qIndex = 0;
        function startQuiz() { qIndex = 0; renderQuiz(); }
        function renderQuiz() {
            let container = document.getElementById('quizContainer');
            if(qIndex >= Math.min(dataset.length, 5)) {
                container.innerHTML = '<h3>Hoàn thành bài kiểm tra!</h3><button class="btn-submit" style="margin-top:1rem; padding:0.8rem 1.5rem;" onclick="startQuiz()">Làm lại</button>';
                return;
            }
            let q = dataset[qIndex];
            let opts = [q.meaning];
            while(opts.length < 4) {
                let r = rawVocabulary[Math.floor(Math.random()*rawVocabulary.length)].meaning;
                if(!opts.includes(r)) opts.push(r);
            }
            opts.sort(() => 0.5 - Math.random());
            container.innerHTML = `
                <div>Câu ${qIndex + 1}: Từ "<b>${q.word}</b>" nghĩa là gì?</div>
                <div class="options-grid">
                    ${opts.map(o => `<button class="option-btn" onclick="ansQuiz(this, '${o === q.meaning}')">${o}</button>`).join('')}
                </div>
            `;
        }
        function ansQuiz(btn, isCorrect) {
            btn.style.background = isCorrect ? '#23b26d' : '#ff495c';
            btn.style.color = 'white';
            setTimeout(() => { qIndex++; renderQuiz(); }, 800);
        }

        // Spell
        let sIndex = 0;
        function startSpell() { sIndex = 0; document.getElementById('spellInput').value = ''; document.getElementById('spellFeedback').innerText = ''; speakSpellWord(); }
        function speakSpellWord() {
            let u = new SpeechSynthesisUtterance(dataset[sIndex].word);
            u.lang = 'en-US';
            window.speechSynthesis.speak(u);
        }
        function checkSpell() {
            let input = document.getElementById('spellInput').value.trim().toLowerCase();
            let target = dataset[sIndex].word.toLowerCase();
            let fb = document.getElementById('spellFeedback');
            if(input === target) {
                fb.style.color = '#23b26d';
                fb.innerText = 'Chính xác!';
                setTimeout(() => { sIndex = (sIndex + 1) % dataset.length; startSpell(); }, 800);
            } else {
                fb.style.color = '#ff495c';
                fb.innerText = `Chưa đúng! Gợi ý: ${dataset[sIndex].meaning}`;
            }
        }

        document.addEventListener('keydown', (e) => {
            if(!document.getElementById('flashcards-view').classList.contains('active')) return;
            if(e.code === 'Space') { e.preventDefault(); flipCard(); }
            if(e.code === 'ArrowRight') nextCard();
            if(e.code === 'ArrowLeft') prevCard();
        });

        window.onload = loadCard;
    </script>
</body>
</html>
