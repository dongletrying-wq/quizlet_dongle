<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizlet Master - Solutions Elementary Unit 2: School Days</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #4255ff;
            --primary-hover: #2e3ed4;
            --primary-light: #eef2ff;
            --bg-color: #f6f7fb;
            --card-bg: #ffffff;
            --text-dark: #1a1d28;
            --text-muted: #586380;
            --border-color: #e3e8ee;
            --accent-green: #23b26d;
            --accent-red: #ff4949;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
            --shadow-lg: 0 16px 32px rgba(66, 85, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Lexend', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding: 0.85rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            background: var(--primary);
            color: white;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 1.15rem;
        }

        .app-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        nav {
            display: flex;
            gap: 6px;
            background: #eef2f6;
            padding: 4px;
            border-radius: 12px;
            overflow-x: auto;
        }

        .nav-btn {
            padding: 8px 14px;
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            color: var(--primary);
        }

        .nav-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        main {
            max-width: 900px;
            width: 100%;
            margin: 1.5rem auto;
            padding: 0 1rem;
            flex: 1;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Filter bar */
        .filter-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow-sm);
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-label {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-select {
            padding: 8px 14px;
            font-size: 0.9rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #f8fafc;
            color: var(--text-dark);
            outline: none;
            cursor: pointer;
            font-weight: 600;
        }

        /* 1. Flashcards Mode */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 420px;
            margin: 1rem 0;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: var(--card-bg);
            border-radius: 20px;
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem;
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #fafcff;
        }

        .card-header-tag {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-category {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-light);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .audio-btn {
            background: #f1f5f9;
            color: var(--text-dark);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .audio-btn:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.08);
        }

        .card-img-box {
            width: 130px;
            height: 130px;
            border-radius: 16px;
            overflow: hidden;
            margin: 0.5rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
        }

        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-icon {
            font-size: 4rem;
        }

        .card-text {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.01em;
        }

        .card-ipa {
            font-size: 1.05rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 4px;
        }

        .ai-gen-btn {
            margin-top: 4px;
            padding: 6px 14px;
            font-size: 0.82rem;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .ai-gen-btn:hover {
            opacity: 0.9;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-outline { background: white; border: 1.5px solid var(--border-color); color: var(--text-dark); }
        .btn-outline:hover { border-color: var(--primary); color: var(--primary); }

        .shortcut-hint {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        /* 2. Match Game Mode */
        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .match-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .match-card {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1.2rem 0.8rem;
            min-height: 95px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            user-select: none;
            transition: all 0.2s ease;
        }

        .match-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .match-card.selected { 
            border-color: var(--primary); 
            background: var(--primary-light); 
            color: var(--primary);
        }

        .match-card.matched { 
            visibility: hidden; 
            opacity: 0; 
            pointer-events: none; 
            transition: all 0.3s ease; 
        }

        /* 3. Quiz & Spell Mode */
        .quiz-card, .spell-card {
            background: white;
            border-radius: 20px;
            padding: 2.2rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .quiz-options { 
            display: grid; 
            gap: 12px; 
            margin: 1.5rem 0; 
        }

        .quiz-option {
            padding: 14px 20px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: white;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .quiz-option:hover {
            border-color: var(--primary);
            background: #fafbff;
        }

        .quiz-option.correct { 
            background: #e6f4ea !important; 
            border-color: var(--accent-green) !important; 
            color: #137333 !important; 
        }

        .quiz-option.wrong { 
            background: #fce8e6 !important; 
            border-color: var(--accent-red) !important; 
            color: #c5221f !important; 
        }

        .spell-speaker {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, var(--primary), #06b6d4);
            color: white;
            border-radius: 50%;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            margin: 0.5rem auto 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
            transition: transform 0.2s;
        }

        .spell-speaker:hover {
            transform: scale(1.08);
        }

        .spell-input-box {
            display: flex;
            max-width: 440px;
            margin: 1.5rem auto 1rem;
            gap: 8px;
        }

        .spell-input {
            flex: 1;
            padding: 12px 18px;
            font-size: 1.1rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            outline: none;
        }

        .spell-input:focus {
            border-color: var(--primary);
        }

        @media (max-width: 650px) {
            .match-grid { grid-template-columns: repeat(2, 1fr); }
            .flashcard-container { height: 460px; }
            .card-text { font-size: 1.6rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-badge">Q</div>
            <div class="app-title">Solutions Elementary - Unit 2: School Days</div>
        </div>
        <nav>
            <button class="nav-btn active" onclick="switchTab('cards')">
                <i class="fa-solid fa-clone"></i> Flashcards
            </button>
            <button class="nav-btn" onclick="switchTab('match')">
                <i class="fa-solid fa-puzzle-piece"></i> Ghép từ
            </button>
            <button class="nav-btn" onclick="switchTab('quiz')">
                <i class="fa-solid fa-circle-question"></i> Kiểm tra
            </button>
            <button class="nav-btn" onclick="switchTab('spell')">
                <i class="fa-solid fa-headphones"></i> Nghe & Viết
            </button>
        </nav>
    </header>

    <main>
        <!-- TAB 1: FLASHCARDS -->
        <div id="tab-cards" class="tab-content active">
            <div class="filter-container">
                <span class="filter-label"><i class="fa-solid fa-filter"></i> Chọn chủ đề bài học:</span>
                <select class="filter-select" id="category-filter" onchange="filterCategory()">
                    <option value="ALL">🌟 Tất cả từ vựng (53 từ)</option>
                    <option value="1. Daily routine">1. Daily routine (Thói quen hàng ngày)</option>
                    <option value="2. School subjects">2. School subjects (Các môn học)</option>
                    <option value="3. Days of the week">3. Days of the week (Thứ trong tuần)</option>
                    <option value="4. Landscape">4. Landscape (Phong cảnh thiên nhiên)</option>
                    <option value="5. Feelings">5. Feelings (Cảm xúc & Trạng thái)</option>
                    <option value="6. School events">6. School events (Sự kiện & Hoạt động trường)</option>
                    <option value="7. Adjectives for places">7. Adjectives (Tính từ miêu tả)</option>
                    <option value="8. Adverbs of frequency">8. Adverbs of frequency (Trạng từ chỉ tần suất)</option>
                </select>
            </div>

            <div class="flashcard-container">
                <div class="flashcard" id="flashcard" onclick="flipCard()">
                    <!-- Mặt trước -->
                    <div class="card-face card-front">
                        <div class="card-header-tag">
                            <span class="card-category" id="card-cat">Daily routine</span>
                            <button class="audio-btn" onclick="event.stopPropagation(); speakCurrentTerm()">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>
                        
                        <div class="card-img-box" id="card-img-container">
                            <span class="card-icon" id="card-icon">⏰</span>
                        </div>

                        <div>
                            <div class="card-text" id="card-term">wake up</div>
                            <div class="card-ipa" id="card-ipa">/weɪk ʌp/</div>
                        </div>

                        <button class="ai-gen-btn" onclick="event.stopPropagation(); generateAIImage()">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> AI Tạo Ảnh Minh Họa
                        </button>
                    </div>

                    <!-- Mặt sau -->
                    <div class="card-face card-back">
                        <div class="card-header-tag">
                            <span class="card-category">Nghĩa tiếng Việt</span>
                            <button class="audio-btn" onclick="event.stopPropagation(); speakCurrentTerm()">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>

                        <div style="margin: auto 0;">
                            <div class="card-text" id="card-def" style="color: var(--primary);">Thức dậy</div>
                            <div id="card-sub-term" style="margin-top: 0.5rem; color: var(--text-muted); font-weight: 500;">wake up</div>
                        </div>

                        <span style="font-size: 0.8rem; color: var(--text-muted);">(Nhấn hoặc bấm Space để lật lại)</span>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-outline" onclick="prevCard()"><i class="fa-solid fa-arrow-left"></i> Thẻ trước</button>
                <div style="font-weight: 700; color: var(--text-muted);" id="card-counter">1 / 53</div>
                <button class="btn btn-outline" onclick="nextCard()">Thẻ sau <i class="fa-solid fa-arrow-right"></i></button>
            </div>

            <div class="shortcut-hint">
                💡 Phím tắt: <strong>Space</strong> để lật thẻ | <strong>← / →</strong> để chuyển thẻ
            </div>
        </div>

        <!-- TAB 2: MATCH GAME -->
        <div id="tab-match" class="tab-content">
            <div class="match-header">
                <div style="font-size: 1.25rem; font-weight: 800; color: var(--primary);" id="match-timer">⏱️ 0.0s</div>
                <button class="btn btn-outline" onclick="initMatchGame()"><i class="fa-solid fa-rotate-right"></i> Ván mới</button>
            </div>
            <div class="match-grid" id="match-grid"></div>
        </div>

        <!-- TAB 3: QUIZ -->
        <div id="tab-quiz" class="tab-content">
            <div class="quiz-card" id="quiz-box"></div>
        </div>

        <!-- TAB 4: LISTEN & SPELL -->
        <div id="tab-spell" class="tab-content">
            <div class="spell-card" style="text-align: center;" id="spell-box">
                <button class="spell-speaker" onclick="speakCurrentSpellWord()">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <p style="font-size: 1.15rem; font-weight: 700; color: var(--text-dark);" id="spell-hint">Gợi ý nghĩa: Thức dậy</p>
                <div class="spell-input-box">
                    <input type="text" class="spell-input" id="spell-input" placeholder="Gõ từ tiếng Anh..." autocomplete="off" onkeyup="if(event.key==='Enter') checkSpellAnswer()">
                    <button class="btn btn-primary" onclick="checkSpellAnswer()">Kiểm tra</button>
                </div>
                <div style="margin-top: 1rem; font-weight: 700; font-size: 1.05rem;" id="spell-feedback"></div>
            </div>
        </div>
    </main>

    <script>
        // FULL VOCABULARY DATA (Solutions Elementary Unit 2)
        const vocabData = [
            // 1. Daily routine

            // 3. Days of the week
            {term: "Monday", ipa: "/ˈmʌn.deɪ/", definition: "Thứ Hai", category: "3. Days of the week", icon: "📅"},

            {term: "Sunday", ipa: "/ˈsʌn.deɪ/", definition: "Chủ Nhật", category: "3. Days of the week", icon: "☀️"},

            // 4. Landscape
            {term: "boat", ipa: "/bəʊt/", definition: "Con thuyền", category: "4. Landscape", icon: "⛵"},
            {term: "bridge", ipa: "/brɪdʒ/", definition: "Cây cầu", category: "4. Landscape", icon: "🌉"},
            {term: "jungle", ipa: "/ˈdʒʌŋ.ɡəl/", definition: "Rừng rậm nhiệt đới", category: "4. Landscape", icon: "🌴"},
            {term: "mountain", ipa: "/ˈmaʊn.tɪn/", definition: "Ngọn núi", category: "4. Landscape", icon: "⛰️"},
            {term: "path", ipa: "/pɑːθ/", definition: "Lối đi, đường mòn", category: "4. Landscape", icon: "🚶"},
            {term: "river", ipa: "/ˈrɪv.ər/", definition: "Dòng sông", category: "4. Landscape", icon: "🌊"},
            {term: "rope", ipa: "/rəʊp/", definition: "Dây thừng", category: "4. Landscape", icon: "🪢"},
            {term: "valley", ipa: "/ˈvæl.i/", definition: "Thung lũng", category: "4. Landscape", icon: "🏞️"},

            // 5. Feelings
            {term: "embarrassed", ipa: "/ɪmˈbær.əst/", definition: "Bối rối, xấu hổ", category: "5. Feelings", icon: "😳"},
            {term: "excited", ipa: "/ɪkˈsaɪ.tɪd/", definition: "Hào hứng, phấn khích", category: "5. Feelings", icon: "🤩"},
            {term: "happy", ipa: "/ˈhæp.i/", definition: "Vui vẻ, hạnh phúc", category: "5. Feelings", icon: "😊"},
            {term: "sad", ipa: "/ˈsæd/", definition: "Buồn bã", category: "5. Feelings", icon: "😢"},
            {term: "tired", ipa: "/ˈtaɪəd/", definition: "Mệt mỏi", category: "5. Feelings", icon: "😴"},
            {term: "worried", ipa: "/ˈwʌr.id/", definition: "Lo lắng", category: "5. Feelings", icon: "😟"},

            // 6. School events
            {term: "concert", ipa: "/ˈkɒn.sət/", definition: "Buổi hòa nhạc", category: "6. School events", icon: "🎶"},
            {term: "musical play", ipa: "/ˈmjuː.zɪ.kəl pleɪ/", definition: "Vở nhạc kịch", category: "6. School events", icon: "🎭"},
            {term: "school camp", ipa: "/skuːl kæmp/", definition: "Cắm trại trường học", category: "6. School events", icon: "🏕️"},
            {term: "school club", ipa: "/skuːl klʌb/", definition: "Câu lạc bộ trường học", category: "6. School events", icon: "👥"},
            {term: "school trip", ipa: "/skuːl trɪp/", definition: "Chuyến dã ngoại", category: "6. School events", icon: "🚌"},
            {term: "sports day", ipa: "/spɔːts deɪ/", definition: "Ngày hội thể thao", category: "6. School events", icon: "🏆"},

            // 7. Adjectives for places
            {term: "dangerous", ipa: "/ˈdeɪn.dʒər.əs/", definition: "Nguy hiểm", category: "7. Adjectives for places", icon: "⚠️"},
            {term: "safe", ipa: "/seɪf/", definition: "An toàn", category: "7. Adjectives for places", icon: "🛡️"},
            {term: "dry", ipa: "/draɪ/", definition: "Khô ráo", category: "7. Adjectives for places", icon: "🌵"},
            {term: "wet", ipa: "/wet/", definition: "Ẩm ướt", category: "7. Adjectives for places", icon: "🌧️"},
            {term: "large", ipa: "/lɑːdʒ/", definition: "Rộng lớn", category: "7. Adjectives for places", icon: "🐘"},
            {term: "small", ipa: "/smɔːl/", definition: "Nhỏ bé", category: "7. Adjectives for places", icon: "🐭"},
            {term: "narrow", ipa: "/ˈnær.əʊ/", definition: "Hẹp", category: "7. Adjectives for places", icon: "📏"},
            {term: "wide", ipa: "/waɪd/", definition: "Rộng", category: "7. Adjectives for places", icon: "↔️"},

            // 8. Adverbs of frequency
            {term: "always", ipa: "/ˈɔːl.weɪz/", definition: "Luôn luôn (100%)", category: "8. Adverbs of frequency", icon: "💯"},
            {term: "usually", ipa: "/ˈjuː.ʒu.ə.li/", definition: "Thường xuyên (~80%)", category: "8. Adverbs of frequency", icon: "🔄"},
            {term: "often", ipa: "/ˈɒf.ən/", definition: "Thường (~60%)", category: "8. Adverbs of frequency", icon: "📈"},
            {term: "sometimes", ipa: "/ˈsʌm.taɪmz/", definition: "Thỉnh thoảng (~40%)", category: "8. Adverbs of frequency", icon: "🎲"},
            {term: "hardly ever", ipa: "/ˌhɑːd.li ˈev.ər/", definition: "Hầu như không bao giờ (~10%)", category: "8. Adverbs of frequency", icon: "📉"},
            {term: "never", ipa: "/ˈnev.ər/", definition: "Không bao giờ (0%)", category: "8. Adverbs of frequency", icon: "🚫"}
        ];

        let filteredVocab = [...vocabData];
        let currentCardIdx = 0;
        let aiImageCache = {};

        // Audio & TTS Engine (Được tối ưu cho mọi trình duyệt)
        let activeUtterance = null;
        function speakText(text) {
            if (!('speechSynthesis' in window) || !text) return;
            window.speechSynthesis.cancel(); // Huỷ lệnh đọc trước đó
            activeUtterance = new SpeechSynthesisUtterance(text);
            activeUtterance.lang = 'en-US';
            activeUtterance.rate = 0.9;
            window.speechSynthesis.speak(activeUtterance);
        }

        window.addEventListener('DOMContentLoaded', () => {
            updateFlashcard();
            initMatchGame();
            initQuiz();
            initSpell();
        });

        // Tab Navigation
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('tab-' + tabName).classList.add('active');
            event.currentTarget.classList.add('active');

            if (tabName === 'match') initMatchGame();
            if (tabName === 'quiz') initQuiz();
            if (tabName === 'spell') initSpell();
        }

        // Filter Category
        function filterCategory() {
            const selectedCat = document.getElementById('category-filter').value;
            if (selectedCat === 'ALL') {
                filteredVocab = [...vocabData];
            } else {
                filteredVocab = vocabData.filter(item => item.category === selectedCat);
            }
            currentCardIdx = 0;
            updateFlashcard();
            initMatchGame();
            initQuiz();
            initSpell();
        }

        // 1. FLASHCARD LOGIC
        function updateFlashcard() {
            if (filteredVocab.length === 0) return;
            const item = filteredVocab[currentCardIdx];
            document.getElementById('card-term').innerText = item.term;
            document.getElementById('card-ipa').innerText = item.ipa || '';
            document.getElementById('card-def').innerText = item.definition;
            document.getElementById('card-sub-term').innerText = item.term;
            document.getElementById('card-cat').innerText = item.category;
            document.getElementById('card-counter').innerText = `${currentCardIdx + 1} / ${filteredVocab.length}`;
            
            const imgContainer = document.getElementById('card-img-container');
            if (aiImageCache[item.term]) {
                imgContainer.innerHTML = `<img src="${aiImageCache[item.term]}" alt="AI Visual">`;
            } else {
                imgContainer.innerHTML = `<span class="card-icon">${item.icon || '📌'}</span>`;
            }
            document.getElementById('flashcard').classList.remove('flipped');
        }

        function flipCard() { 
            document.getElementById('flashcard').classList.toggle('flipped'); 
        }

        function nextCard() { 
            if (filteredVocab.length === 0) return;
            currentCardIdx = (currentCardIdx + 1) % filteredVocab.length; 
            updateFlashcard(); 
        }

        function prevCard() { 
            if (filteredVocab.length === 0) return;
            currentCardIdx = (currentCardIdx - 1 + filteredVocab.length) % filteredVocab.length; 
            updateFlashcard(); 
        }

        function speakCurrentTerm() { 
            if (filteredVocab.length > 0) {
                const term = filteredVocab[currentCardIdx].term.split('(')[0].trim();
                speakText(term);
            }
        }

        function generateAIImage() {
            if (filteredVocab.length === 0) return;
            const item = filteredVocab[currentCardIdx];
            const imgContainer = document.getElementById('card-img-container');
            imgContainer.innerHTML = `<span style="font-size:0.85rem; color:var(--primary); font-weight:600;"><i class="fa-solid fa-spinner fa-spin"></i> AI đang vẽ...</span>`;
            
            const cleanTerm = item.term.split('(')[0].trim();
            const prompt = encodeURIComponent(`minimalist clean 3D illustration of ${cleanTerm}, high quality`);
            const imageUrl = `https://image.pollinations.ai/prompt/${prompt}?width=200&height=200&nologo=true`;

            const img = new Image();
            img.onload = () => {
                aiImageCache[item.term] = imageUrl;
                imgContainer.innerHTML = `<img src="${imageUrl}" alt="AI Visual">`;
            };
            img.src = imageUrl;
        }

        document.addEventListener('keydown', (e) => {
            if (document.getElementById('tab-cards').classList.contains('active')) {
                if (e.code === 'Space') { e.preventDefault(); flipCard(); }
                if (e.code === 'ArrowRight') nextCard();
                if (e.code === 'ArrowLeft') prevCard();
            }
        });

        // 2. MATCH GAME LOGIC
        let matchTimerInterval, matchTime = 0, firstSelected = null;

        function initMatchGame() {
            clearInterval(matchTimerInterval);
            matchTime = 0;
            document.getElementById('match-timer').innerText = '⏱️ 0.0s';
            firstSelected = null;

            let sample = [...filteredVocab].sort(() => Math.random() - 0.5).slice(0, 4);
            let deck = [];
            sample.forEach((item, i) => {
                deck.push({ id: i, type: 'TERM', label: item.term });
                deck.push({ id: i, type: 'DEF', label: item.definition });
            });
            deck.sort(() => Math.random() - 0.5);

            const grid = document.getElementById('match-grid');
            grid.innerHTML = '';

            deck.forEach(card => {
                const el = document.createElement('div');
                el.className = 'match-card';
                el.innerText = card.label;
                el.onclick = () => handleMatchClick(el, card);
                grid.appendChild(el);
            });

            matchTimerInterval = setInterval(() => {
                matchTime += 0.1;
                document.getElementById('match-timer').innerText = `⏱️ ${matchTime.toFixed(1)}s`;
            }, 100);
        }

        function handleMatchClick(el, card) {
            if (el.classList.contains('matched') || el.classList.contains('selected')) return;
            el.classList.add('selected');

            if (!firstSelected) {
                firstSelected = { el, card };
            } else {
                const secondSelected = { el, card };
                if (firstSelected.card.id === secondSelected.card.id && firstSelected.card.type !== secondSelected.card.type) {
                    setTimeout(() => {
                        firstSelected.el.classList.add('matched');
                        secondSelected.el.classList.add('matched');
                        firstSelected = null;
                        checkMatchVictory();
                    }, 200);
                } else {
                    setTimeout(() => {
                        firstSelected.el.classList.remove('selected');
                        secondSelected.el.classList.remove('selected');
                        firstSelected = null;
                    }, 400);
                }
            }
        }

        function checkMatchVictory() {
            if (document.querySelectorAll('.match-card:not(.matched)').length === 0) {
                clearInterval(matchTimerInterval);
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
        }

        // 3. QUIZ LOGIC
        let currentQuizItem = null;
        let quizScore = 0;

        function initQuiz() {
            if (filteredVocab.length === 0) return;
            currentQuizItem = filteredVocab[Math.floor(Math.random() * filteredVocab.length)];

            let options = [currentQuizItem];
            while (options.length < 4 && options.length < filteredVocab.length) {
                let rand = filteredVocab[Math.floor(Math.random() * filteredVocab.length)];
                if (!options.includes(rand)) options.push(rand);
            }
            options.sort(() => Math.random() - 0.5);

            const quizBox = document.getElementById('quiz-box');
            quizBox.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
                    <span style="font-weight:700; color:var(--primary); font-size:0.9rem;">CHỌN NGHĨA ĐÚNG CỦA TỪ</span>
                    <span style="font-weight:700; color:var(--accent-green);">Điểm: ${quizScore}</span>
                </div>
                <div style="text-align:center; margin-bottom:1.5rem;">
                    <div style="font-size:2.2rem; font-weight:800; color:var(--text-dark);">${currentQuizItem.term}</div>
                    <div style="color:var(--text-muted); font-size:1rem; margin-top:4px;">${currentQuizItem.ipa}</div>
                </div>
                <div class="quiz-options">
                    ${options.map(opt => `
                        <button class="quiz-option" onclick="checkQuizAnswer(this, '${opt.term}')">
                            <span>${opt.definition}</span>
                            <i class="fa-regular fa-circle"></i>
                        </button>
                    `).join('')}
                </div>
            `;
        }

        function checkQuizAnswer(btn, selectedTerm) {
            const allBtns = document.querySelectorAll('.quiz-option');
            allBtns.forEach(b => b.disabled = true);

            if (selectedTerm === currentQuizItem.term) {
                btn.classList.add('correct');
                btn.querySelector('i').className = 'fa-solid fa-circle-check';
                quizScore += 10;
            } else {
                btn.classList.add('wrong');
                btn.querySelector('i').className = 'fa-solid fa-circle-xmark';
                allBtns.forEach(b => {
                    if (b.innerText.includes(currentQuizItem.definition)) {
                        b.classList.add('correct');
                    }
                });
            }
            setTimeout(initQuiz, 1400);
        }

        // 4. LISTEN & SPELL LOGIC
        let currentSpellItem = null;

        function initSpell() {
            if (filteredVocab.length === 0) return;
            currentSpellItem = filteredVocab[Math.floor(Math.random() * filteredVocab.length)];
            document.getElementById('spell-hint').innerText = `Gợi ý nghĩa: ${currentSpellItem.definition}`;
            document.getElementById('spell-input').value = '';
            document.getElementById('spell-feedback').innerText = '';
        }

        function speakCurrentSpellWord() {
            if (currentSpellItem) {
                const term = currentSpellItem.term.split('(')[0].trim();
                speakText(term);
            }
        }

        function checkSpellAnswer() {
            const val = document.getElementById('spellInput' || 'spell-input').value.trim().toLowerCase();
            const feedback = document.getElementById('spell-feedback');
            if (!val) return;

            const target = currentSpellItem.term.toLowerCase();
            if (val === target) {
                feedback.style.color = 'var(--accent-green)';
                feedback.innerHTML = '<i class="fa-solid fa-check"></i> Chính xác! Rất tuyệt vời!';
                setTimeout(initSpell, 1400);
            } else {
                feedback.style.color = 'var(--accent-red)';
                feedback.innerHTML = `<i class="fa-solid fa-xmark"></i> Chưa đúng! Đáp án: <strong>${currentSpellItem.term}</strong>`;
            }
        }
    </script>
</body>
</html>
