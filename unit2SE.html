<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizlet Master - Solutions Elementary Unit 2: School Days</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --primary: #4255ff;
            --primary-hover: #2e3ed4;
            --primary-light: #eef2ff;
            --bg-color: #f6f7fb;
            --card-bg: #ffffff;
            --text-dark: #1a1d28;
            --text-muted: #586380;
            --border-color: #e3e8ee;
            --accent-green: #23b26d;
            --accent-red: #ff4949;
            --accent-orange: #f59e0b;
            --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
            --shadow-md: 0 8px 24px rgba(0,0,0,0.06);
            --shadow-lg: 0 16px 32px rgba(66, 85, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Lexend', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #ffffff;
            border-bottom: 1px solid var(--border-color);
            padding: 0.85rem 1.5rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-badge {
            background: var(--primary);
            color: white;
            font-weight: 800;
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 1.15rem;
        }

        .app-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        nav {
            display: flex;
            gap: 6px;
            background: #eef2f6;
            padding: 4px;
            border-radius: 12px;
            overflow-x: auto;
        }

        .nav-btn {
            padding: 8px 14px;
            border: none;
            background: transparent;
            font-weight: 600;
            font-size: 0.88rem;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            color: var(--primary);
        }

        .nav-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        main {
            max-width: 900px;
            width: 100%;
            margin: 1.5rem auto;
            padding: 0 1rem;
            flex: 1;
        }

        .tab-content {
            display: none;
            animation: fadeIn 0.25s ease;
        }

        .tab-content.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .filter-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: white;
            padding: 12px 18px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            margin-bottom: 1.25rem;
            box-shadow: var(--shadow-sm);
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .filter-label {
            font-weight: 600;
            color: var(--text-dark);
            font-size: 0.92rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-select {
            padding: 8px 14px;
            font-size: 0.9rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #f8fafc;
            color: var(--text-dark);
            outline: none;
            cursor: pointer;
            font-weight: 600;
        }

        .anki-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
            font-weight: 700;
            font-size: 0.88rem;
            flex-wrap: wrap;
            gap: 8px;
        }

        .stat-pill {
            padding: 5px 12px;
            border-radius: 12px;
        }

        .stat-mastered {
            color: #137333;
            background: #e6f4ea;
        }

        .stat-left {
            color: #b45309;
            background: #fef3c7;
        }

        .review-badge {
            background: #fef3c7;
            color: #b45309;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.78rem;
            margin-left: 6px;
            display: inline-block;
        }

        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 420px;
            margin: 1rem 0;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            border-radius: 20px;
            box-shadow: var(--shadow-md);
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            background: var(--card-bg);
            border-radius: 20px;
            border: 2px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem;
            text-align: center;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #fafcff;
        }

        .card-header-tag {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-category {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--primary);
            background: var(--primary-light);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .audio-btn {
            background: #f1f5f9;
            color: var(--text-dark);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.15rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .audio-btn:hover {
            background: var(--primary);
            color: white;
            transform: scale(1.08);
        }

        .card-img-box {
            width: 130px;
            height: 130px;
            border-radius: 16px;
            overflow: hidden;
            margin: 0.5rem 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
        }

        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-icon {
            font-size: 4rem;
        }

        .card-text {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: -0.01em;
        }

        .card-ipa {
            font-size: 1.05rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-top: 4px;
        }

        .ai-gen-btn {
            margin-top: 4px;
            padding: 6px 14px;
            font-size: 0.82rem;
            background: linear-gradient(135deg, #a855f7, #6366f1);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
        }

        .ai-gen-btn:hover {
            opacity: 0.9;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.92rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
        .btn-outline { background: white; border: 1.5px solid var(--border-color); color: var(--text-dark); }
        .btn-outline:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }

        .shortcut-hint {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .match-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .match-card {
            background: white;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1.2rem 0.8rem;
            min-height: 95px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            user-select: none;
            transition: all 0.2s ease;
        }

        .match-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
        }

        .match-card.selected { 
            border-color: var(--primary); 
            background: var(--primary-light); 
            color: var(--primary);
        }

        .match-card.matched { 
            visibility: hidden; 
            opacity: 0; 
            pointer-events: none; 
            transition: all 0.3s ease; 
        }

        .quiz-card, .spell-card {
            background: white;
            border-radius: 20px;
            padding: 2.2rem;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        .quiz-options { 
            display: grid; 
            gap: 12px; 
            margin: 1.5rem 0; 
        }

        .quiz-option {
            padding: 14px 20px;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            background: white;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .quiz-option:hover:not(:disabled) {
            border-color: var(--primary);
            background: #fafbff;
        }

        .quiz-option:disabled {
            cursor: default;
        }

        .quiz-option.correct { 
            background: #e6f4ea !important; 
            border-color: var(--accent-green) !important; 
            color: #137333 !important; 
        }

        .quiz-option.wrong { 
            background: #fce8e6 !important; 
            border-color: var(--accent-red) !important; 
            color: #c5221f !important; 
        }

        .spell-speaker {
            width: 76px;
            height: 76px;
            background: linear-gradient(135deg, var(--primary), #06b6d4);
            color: white;
            border-radius: 50%;
            border: none;
            font-size: 1.85rem;
            cursor: pointer;
            margin: 0.5rem auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-md);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .spell-speaker:hover {
            transform: scale(1.08);
            box-shadow: var(--shadow-lg);
        }

        .spell-input-box {
            display: flex;
            max-width: 500px;
            margin: 1.25rem auto 0.75rem;
            gap: 8px;
        }

        .spell-input {
            flex: 1;
            padding: 12px 18px;
            font-size: 1.15rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            outline: none;
            background: #f8fafc;
            transition: border-color 0.2s;
        }

        .spell-input:focus {
            border-color: var(--primary);
            background: white;
        }

        .spell-input:disabled {
            background: #f1f5f9;
            color: var(--text-muted);
        }

        .btn-next-spell {
            display: none;
            margin: 1.2rem auto 0;
            padding: 12px 28px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }

        .btn-next-spell:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        @media (max-width: 650px) {
            .match-grid { grid-template-columns: repeat(2, 1fr); }
            .flashcard-container { height: 460px; }
            .card-text { font-size: 1.6rem; }
            .spell-input-box { flex-direction: column; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-area">
            <div class="logo-badge">Q</div>
            <div class="app-title">Solutions Elementary - Unit 2: School Days</div>
        </div>
        <nav>
            <button class="nav-btn active" onclick="switchTab('cards', this)">
                <i class="fa-solid fa-clone"></i> Flashcards
            </button>
            <button class="nav-btn" onclick="switchTab('match', this)">
                <i class="fa-solid fa-puzzle-piece"></i> Ghép từ
            </button>
            <button class="nav-btn" onclick="switchTab('quiz', this)">
                <i class="fa-solid fa-circle-question"></i> Kiểm tra (Anki)
            </button>
            <button class="nav-btn" onclick="switchTab('spell', this)">
                <i class="fa-solid fa-headphones"></i> Nghe & Viết (Anki)
            </button>
        </nav>
    </header>

    <main>
        <div class="filter-container">
            <span class="filter-label"><i class="fa-solid fa-filter"></i> Chọn chủ đề bài học:</span>
            <select class="filter-select" id="category-filter" onchange="filterCategory()">
                <option value="ALL">🌟 Tất cả từ vựng (63 từ)</option>
                <option value="1. Daily routine">1. Daily routine (Thói quen hàng ngày)</option>
                <option value="2. School subjects">2. School subjects (Các môn học)</option>
                <option value="3. Days of the week">3. Days of the week (Thứ trong tuần)</option>
                <option value="4. Landscape">4. Landscape (Phong cảnh thiên nhiên)</option>
                <option value="5. Feelings">5. Feelings (Cảm xúc & Trạng thái)</option>
                <option value="6. School events">6. School events (Sự kiện & Hoạt động trường)</option>
                <option value="7. Adjectives for places">7. Adjectives (Tính từ miêu tả)</option>
                <option value="8. Adverbs of frequency">8. Adverbs of frequency (Trạng từ chỉ tần suất)</option>
            </select>
        </div>

        <div id="tab-cards" class="tab-content active">
            <div class="flashcard-container">
                <div class="flashcard" id="flashcard" onclick="flipCard()">
                    <div class="card-face card-front">
                        <div class="card-header-tag">
                            <span class="card-category" id="card-cat">Daily routine</span>
                            <button class="audio-btn" onclick="event.stopPropagation(); speakCurrentTerm()">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>
                        
                        <div class="card-img-box" id="card-img-container">
                            <span class="card-icon" id="card-icon">⏰</span>
                        </div>

                        <div>
                            <div class="card-text" id="card-term">wake up</div>
                            <div class="card-ipa" id="card-ipa">/weɪk ʌp/</div>
                        </div>

                        <button class="ai-gen-btn" onclick="event.stopPropagation(); generateAIImage()">
                            <i class="fa-solid fa-wand-magic-sparkles"></i> AI Tạo Ảnh Minh Họa
                        </button>
                    </div>

                    <div class="card-face card-back">
                        <div class="card-header-tag">
                            <span class="card-category">Nghĩa tiếng Việt</span>
                            <button class="audio-btn" onclick="event.stopPropagation(); speakCurrentTerm()">
                                <i class="fa-solid fa-volume-high"></i>
                            </button>
                        </div>

                        <div style="margin: auto 0;">
                            <div class="card-text" id="card-def" style="color: var(--primary);">Thức dậy</div>
                            <div id="card-sub-term" style="margin-top: 0.5rem; color: var(--text-muted); font-weight: 500;">wake up</div>
                        </div>

                        <span style="font-size: 0.8rem; color: var(--text-muted);">(Nhấn hoặc bấm Space để lật lại)</span>
                    </div>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-outline" onclick="prevCard()"><i class="fa-solid fa-arrow-left"></i> Thẻ trước</button>
                <div style="font-weight: 700; color: var(--text-muted);" id="card-counter">1 / 63</div>
                <button class="btn btn-outline" onclick="nextCard()">Thẻ sau <i class="fa-solid fa-arrow-right"></i></button>
            </div>

            <div class="shortcut-hint">
                💡 Phím tắt: <strong>Space</strong> để lật thẻ | <strong>← / →</strong> để chuyển thẻ
            </div>
        </div>

        <div id="tab-match" class="tab-content">
            <div class="match-header">
                <div style="font-size: 1.25rem; font-weight: 800; color: var(--primary);" id="match-timer">⏱️ 0.0s</div>
                <button class="btn btn-outline" onclick="initMatchGame()"><i class="fa-solid fa-rotate-right"></i> Ván mới</button>
            </div>
            <div class="match-grid" id="match-grid"></div>
        </div>

        <div id="tab-quiz" class="tab-content">
            <div class="quiz-card" id="quiz-box"></div>
        </div>

        <div id="tab-spell" class="tab-content">
            <div class="spell-card" style="text-align: center;" id="spell-box"></div>
        </div>
    </main>

    <script>
        const vocabData = [
            {term: "wake up", ipa: "/weɪk ʌp/", definition: "Thức dậy", category: "1. Daily routine", icon: "⏰"},
            {term: "get dressed", ipa: "/ɡet drest/", definition: "Mặc quần áo", category: "1. Daily routine", icon: "👔"},
            {term: "have breakfast", ipa: "/hæv ˈbrek.fəst/", definition: "Ăn sáng", category: "1. Daily routine", icon: "🍳"},
            {term: "have lunch", ipa: "/hæv lʌntʃ/", definition: "Ăn trưa", category: "1. Daily routine", icon: "🥪"},
            {term: "have dinner", ipa: "/hæv ˈdɪn.ər/", definition: "Ăn tối", category: "1. Daily routine", icon: "🍽️"},
            {term: "arrive at school", ipa: "/əˈraɪv æt skuːl/", definition: "Đến trường", category: "1. Daily routine", icon: "🏫"},
            {term: "leave school", ipa: "/liːv skuːl/", definition: "Tan học, rời trường", category: "1. Daily routine", icon: "🚶‍♂️"},
            {term: "go to bed", ipa: "/ɡəʊ tə bed/", definition: "Đi ngủ", category: "1. Daily routine", icon: "🛏️"},

            {term: "art and design", ipa: "/ˌɑːt ənd dɪˈzaɪn/", definition: "Mỹ thuật và thiết kế", category: "2. School subjects", icon: "🎨"},
            {term: "biology", ipa: "/baɪˈɒl.ə.dʒi/", definition: "Sinh học", category: "2. School subjects", icon: "🧬"},
            {term: "chemistry", ipa: "/ˈkem.ɪ.stri/", definition: "Hóa học", category: "2. School subjects", icon: "🧪"},
            {term: "economics", ipa: "/ˌiː.kəˈnɒm.ɪks/", definition: "Kinh tế học", category: "2. School subjects", icon: "📊"},
            {term: "English", ipa: "/ˈɪŋ.ɡlɪʃ/", definition: "Tiếng Anh", category: "2. School subjects", icon: "🇬🇧"},
            {term: "French", ipa: "/frentʃ/", definition: "Tiếng Pháp", category: "2. School subjects", icon: "🇫🇷"},
            {term: "geography", ipa: "/dʒiˈɒɡ.rə.fi/", definition: "Địa lý", category: "2. School subjects", icon: "🌍"},
            {term: "German", ipa: "/ˈdʒɜː.mən/", definition: "Tiếng Đức", category: "2. School subjects", icon: "🇩🇪"},
            {term: "history", ipa: "/ˈhɪs.tər.i/", definition: "Lịch sử", category: "2. School subjects", icon: "📜"},
            {term: "I.C.T.", ipa: "/ˌaɪ.siːˈtiː/", definition: "Công nghệ thông tin (ICT)", category: "2. School subjects", icon: "💻"},
            {term: "maths", ipa: "/mæθs/", definition: "Toán học", category: "2. School subjects", icon: "➕"},
            {term: "music", ipa: "/ˈmjuː.zɪk/", definition: "Âm nhạc", category: "2. School subjects", icon: "🎵"},
            {term: "P.E.", ipa: "/ˌpiːˈiː/", definition: "Thể dục (Physical Education)", category: "2. School subjects", icon: "⚽"},
            {term: "physics", ipa: "/ˈfɪz.ɪks/", definition: "Vật lý", category: "2. School subjects", icon: "⚛️"},
            {term: "R.E.", ipa: "/ˌɑːˈiː/", definition: "Giáo dục tôn giáo (R.E.)", category: "2. School subjects", icon: "⛪"},
