<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 10: 臺灣的水果很好吃 (Hoa quả ở Đài Loan rất ngon) - Flashcard & Game</title>
    <!-- Google Font Noto Serif TC (Khải Thể / Phồn Thể chuẩn nét thư pháp giáo trình) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #e67e22;
            --primary-hover: #d35400;
            --bg-main: #fefaf5;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #faebd7;
            --success: #27ae60;
            --danger: #e74c3c;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-md: 0 10px 25px rgba(230, 126, 34, 0.08);
            /* Bộ font Khải Thể chuẩn nét bút tập viết */
            --font-kai: 'DFKai-SB', 'BiauKai', 'KaiTi', 'STKaiti', 'KaiTi_GB2312', 'Noto Serif TC', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.3rem; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .logo span { font-family: var(--font-kai); font-weight: normal; }
        
        nav.nav-tabs { display: flex; justify-content: center; gap: 8px; padding: 0.8rem; background: var(--card-bg); border-bottom: 1px solid var(--border-color); flex-wrap: wrap; }
        .tab-btn { background: transparent; border: none; padding: 10px 18px; border-radius: var(--radius-md); font-weight: 700; color: var(--text-muted); cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
        .tab-btn:hover { background: #fdf2e9; color: var(--primary); }
        .tab-btn.active { background: var(--primary); color: white; }

        main { flex: 1; max-width: 800px; width: 100%; margin: 0 auto; padding: 1.5rem 1rem; }
        .view-panel { display: none; }
        .view-panel.active { display: block; }

        .filter-select { padding: 10px 18px; border-radius: 20px; border: 1.5px solid var(--border-color); background: var(--card-bg); font-weight: 700; margin-bottom: 1.2rem; outline: none; cursor: pointer; color: var(--text-main); width: 100%; max-width: 420px; font-size: 0.95rem; }

        /* Flashcard 3D */
        .flashcard-wrapper { perspective: 1000px; width: 100%; height: 410px; margin-bottom: 1.5rem; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); cursor: pointer; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius-lg); background: var(--card-bg); border: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.8rem; text-align: center; }
        .card-back { transform: rotateY(180deg); background: #fffdf9; }
        .card-category { position: absolute; top: 16px; left: 20px; font-size: 0.8rem; font-weight: 700; color: var(--primary); background: rgba(230, 126, 34, 0.08); padding: 5px 14px; border-radius: 12px; }
        .ai-gen-btn { position: absolute; top: 16px; right: 20px; background: #fdf2e9; color: var(--primary); border: 1px solid rgba(230, 126, 34, 0.2); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        
        /* Chữ Hán Font Khải Thể chuẩn nét bút tập viết */
        .card-hanzi { font-family: var(--font-kai); font-size: 4.2rem; font-weight: normal; margin-bottom: 0.1rem; color: #1e272e; letter-spacing: 2px; }
        .card-pinyin { font-size: 1.35rem; color: #d35400; margin-bottom: 0.4rem; font-weight: 700; }
        .card-type { font-size: 0.85rem; font-weight: 700; color: #8e44ad; background: #f4ecf7; padding: 2px 10px; border-radius: 6px; margin-bottom: 0.8rem; }
        .card-meaning { font-size: 1.9rem; font-weight: 800; color: var(--primary); margin-bottom: 0.8rem; }
        .card-note { font-size: 1rem; color: var(--text-muted); font-style: italic; max-width: 90%; line-height: 1.4; }
        .controls-bar { display: flex; justify-content: space-between; align-items: center; }
        .ctrl-btn { background: var(--card-bg); border: 1px solid var(--border-color); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; color: var(--text-main); transition: 0.2s; }
        .ctrl-btn:hover { background: #fdf2e9; color: var(--primary); }

        /* Sub-navigation & Luyện Chữ & Nghĩa */
        .sub-nav { display: flex; justify-content: center; background: #faede1; border-radius: 12px; padding: 4px; margin-bottom: 2rem; }
        .sub-btn { flex: 1; border: none; background: transparent; padding: 10px 14px; font-weight: 700; font-size: 0.95rem; border-radius: 9px; cursor: pointer; color: var(--text-muted); transition: 0.2s; text-align: center; }
        .sub-btn.active { background: white; color: var(--primary); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }

        .tag-badge { background: #ffedd5; color: #c2410c; padding: 4px 14px; border-radius: 20px; font-weight: 800; font-size: 0.8rem; letter-spacing: 0.5px; display: inline-block; text-transform: uppercase; }
        .hanzi-display { font-family: var(--font-kai); font-size: 5rem; font-weight: normal; color: #1e272e; margin: 0.5rem 0 0.8rem; }
        .sound-circle-btn { width: 48px; height: 48px; border-radius: 50%; background: #edf2f7; border: none; color: #4a5568; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 1.25rem; transition: 0.2s; margin-bottom: 1.2rem; }
        .sound-circle-btn:hover { background: #e2e8f0; color: var(--primary); }

        /* Match Game */
        .match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .match-card { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: var(--radius-md); height: 100px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0.8rem; font-weight: 700; cursor: pointer; user-select: none; font-size: 1.15rem; transition: 0.2s; }
        .match-card.hanzi-font { font-family: var(--font-kai); font-size: 1.65rem; font-weight: normal; }
        .match-card.selected { border-color: var(--primary); background: rgba(230, 126, 34, 0.08); color: var(--primary); transform: scale(1.02); }
        .match-card.correct { border-color: var(--success); background: rgba(39, 174, 96, 0.1); opacity: 0.2; pointer-events: none; }

        /* Quiz & Spell */
        .quiz-card { background: var(--card-bg); padding: 2.2rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-md); text-align: center; }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 1rem; }
        .option-btn { padding: 1.1rem; border: 2px solid #edf2f7; border-radius: var(--radius-md); background: white; font-weight: 700; cursor: pointer; text-align: center; font-size: 1.15rem; color: #2d3748; transition: 0.2s; }
        .option-btn:hover { border-color: var(--primary); background: #fffaf0; }
        .input-box { display: flex; gap: 10px; margin-top: 1.5rem; }
        .input-box input { flex: 1; padding: 0.9rem 1.2rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); font-size: 1.15rem; outline: none; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 0 1.6rem; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-lemon"></i> Bài 10: <span>臺灣的水果很好吃</span> (Hoa quả ở Đài Loan rất ngon)</div>
    </header>

    <nav class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('flashcards', this)"><i class="fa-solid fa-clone"></i> Thẻ Ghi Nhớ 3D</button>
        <button class="tab-btn" onclick="switchTab('quiz', this)"><i class="fa-solid fa-circle-question"></i> Luyện Chữ & Nghĩa</button>
        <button class="tab-btn" onclick="switchTab('match', this)"><i class="fa-solid fa-puzzle-piece"></i> Ghép Cặp (Match Game)</button>
        <button class="tab-btn" onclick="switchTab('spell', this)"><i class="fa-solid fa-headphones"></i> Luyện Nghe & Viết</button>
    </nav>

    <main>
        <select id="categoryFilter" class="filter-select" onchange="filterCategory(this.value)">
            <option value="ALL">Tất cả bài học (28 mục)</option>
            <option value="Hoa quả & Màu sắc">Hoa quả & Màu sắc (水果與顏色)</option>
            <option value="Ngoại hình & Quần áo">Ngoại hình & Quần áo (外表與衣服)</option>
            <option value="Từ vựng Phần I">Từ vựng Phần I (Hương vị & Mua bán)</option>
            <option value="Từ vựng Phần II">Từ vựng Phần II (Nhà ở & Không gian)</option>
            <option value="Cụm từ thường dùng">Cụm từ thường dùng</option>
        </select>

        <!-- 1. Flashcards -->
        <div id="flashcards-view" class="view-panel active">
            <div class="flashcard-wrapper">
                <div class="flashcard" id="mainCard" onclick="flipCard()">
                    <div class="card-face card-front">
                        <span class="card-category" id="cardCategory">Category</span>
                        <button class="ai-gen-btn" onclick="generateAIImage(event)"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Ảnh</button>
                        <i class="fa-solid fa-apple-whole" id="cardIcon" style="font-size: 2.6rem; color: var(--primary); margin-bottom: 0.6rem;"></i>
                        <img id="cardImg" style="display:none; max-width: 140px; max-height: 90px; border-radius: 8px; margin-bottom: 0.6rem; object-fit: contain;">
                        <div class="card-hanzi" id="cardHanzi">水果</div>
                        <div class="card-pinyin" id="cardPinyin">shuǐguǒ</div>
                        <span class="card-type" id="cardType">N</span>
                        <button class="ctrl-btn" style="width: 38px; height: 38px; margin-top: 4px;" onclick="speakCurrentWord(event)"><i class="fa-solid fa-volume-high"></i></button>
                    </div>
                    <div class="card-face card-back">
                        <span class="card-category">Dịch nghĩa & Ghi chú</span>
                        <div class="card-meaning" id="cardMeaning">hoa quả, trái cây</div>
                        <div class="card-note" id="cardNote"></div>
                    </div>
                </div>
            </div>
            <div class="controls-bar">
                <button class="ctrl-btn" onclick="prevCard()"><i class="fa-solid fa-arrow-left"></i></button>
                <span id="cardProgress" style="font-weight: 800; font-size: 1.1rem;">1 / 28</span>
                <button class="ctrl-btn" onclick="nextCard()"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div style="text-align: center; margin-top: 1.2rem; color: var(--text-muted); font-size: 0.9rem;">
                Phím <kbd>Space</kbd> để lật thẻ | Phím <kbd>←</kbd> <kbd>→</kbd> để chuyển thẻ
            </div>
        </div>

        <!-- 2. Luyện Chữ & Nghĩa -->
        <div id="quiz-view" class="view-panel">
            <div class="sub-nav">
                <button class="sub-btn active" id="btnModePinyin" onclick="setQuizMode('hanzi_to_pinyin')">Chữ Hán → Pinyin</button>
                <button class="sub-btn" id="btnModeMeaning" onclick="setQuizMode('hanzi_to_meaning')">Chữ Hán → Nghĩa Tiếng Việt</button>
            </div>
            <div class="quiz-card" id="quizContainer"></div>
        </div>

        <!-- 3. Match Game -->
        <div id="match-view" class="view-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <div style="font-weight: 800; color: var(--primary); font-size: 1.1rem;">Thời gian phản xạ: <span id="matchTimer">0.0</span>s</div>
                <button class="btn-submit" style="padding: 8px 18px;" onclick="startMatch()">Chơi lại</button>
            </div>
            <div class="match-grid" id="matchGrid"></div>
        </div>

        <!-- 4. Listen & Spell -->
        <div id="spell-view" class="view-panel">
            <div class="quiz-card">
                <button class="ctrl-btn" style="width: 75px; height: 75px; font-size: 2rem; margin: 0 auto 1.2rem; color: var(--primary);" onclick="speakSpellWord()"><i class="fa-solid fa-volume-high"></i></button>
                <div style="font-size: 1.05rem; font-weight: 600;">Nghe phát âm và gõ lại chữ Hán (hoặc Pinyin không dấu):</div>
                <div class="input-box" style="max-width: 420px; margin: 1.2rem auto;">
                    <input type="text" id="spellInput" placeholder="Nhập chữ Hán hoặc pinyin..." onkeyup="if(event.key==='Enter') checkSpell()">
                    <button class="btn-submit" onclick="checkSpell()">Kiểm tra</button>
                </div>
                <div id="spellFeedback" style="margin-top: 1rem; font-weight: 800; font-size: 1.05rem;"></div>
            </div>
        </div>
    </main>

    <script>
        const rawVocabulary = [
            // Fruit & Colors
            { word: "水果", pinyin: "shuǐguǒ", type: "N", meaning: "hoa quả, trái cây", note: "Trái cây tươi ngon", category: "Hoa quả & Màu sắc", icon: "fa-apple-whole" },
            { word: "芒果", pinyin: "mángguǒ", type: "N", meaning: "quả xoài", note: "Trái xoài nổi tiếng ở Đài Loan", category: "Hoa quả & Màu sắc", icon: "fa-lemon" },
            { word: "西瓜", pinyin: "xīguā", type: "N", meaning: "dưa hấu", note: "Trái dưa hấu ruột đỏ", category: "Hoa quả & Màu sắc", icon: "fa-bowl-rice" },
            { word: "黃色", pinyin: "huángsè", type: "N", meaning: "màu vàng", note: "Màu sắc vàng tươi", category: "Hoa quả & Màu sắc", icon: "fa-palette" },
            { word: "紅色", pinyin: "hóngsè", type: "N", meaning: "màu đỏ", note: "Màu sắc đỏ thắm", category: "Hoa quả & Màu sắc", icon: "fa-palette" },
            { word: "藍色", pinyin: "lánsè", type: "N", meaning: "màu xanh nước biển, xanh lam", note: "Màu xanh da trời, xanh lam", category: "Hoa quả & Màu sắc", icon: "fa-palette" },
            { word: "黑色", pinyin: "hēisè", type: "N", meaning: "màu đen", note: "Màu sắc đen huyền", category: "Hoa quả & Màu sắc", icon: "fa-palette" },
            { word: "白色", pinyin: "báisè", type: "N", meaning: "màu trắng", note: "Màu sắc trắng tinh", category: "Hoa quả & Màu sắc", icon: "fa-palette" },

            // Appearance & Clothes
            { word: "胖", pinyin: "pàng", type: "Vs", meaning: "béo, mập", note: "Ngoại hình đẫy đà, béo tốt", category: "Ngoại hình & Quần áo", icon: "fa-user" },
            { word: "瘦", pinyin: "shòu", type: "Vs", meaning: "gầy, ốm", note: "Ngoại hình thon thả, gầy", category: "Ngoại hình & Quần áo", icon: "fa-user" },
            { word: "高", pinyin: "gāo", type: "Vs", meaning: "cao", note: "Chiều cao vượt trội", category: "Ngoại hình & Quần áo", icon: "fa-up-long" },
            { word: "矮", pinyin: "ǎi", type: "Vs", meaning: "thấp, lùn", note: "Chiều cao khiêm tốn", category: "Ngoại hình & Quần áo", icon: "fa-down-long" },
            { word: "穿", pinyin: "chuān", type: "V", meaning: "mặc (quần áo), đi (giày, tất)", note: "Hành động mặc trang phục, mang tất giày", category: "Ngoại hình & Quần áo", icon: "fa-shirt" },
            { word: "衣服", pinyin: "yīfu", type: "N", meaning: "quần áo", note: "Trang phục thường ngày", category: "Ngoại hình & Quần áo", icon: "fa-vest" },

            // Vocabulary I
            { word: "給", pinyin: "gěi", type: "V", meaning: "cho, đưa cho", note: "Trao tặng hoặc đưa vật cho ai", category: "Từ vựng Phần I", icon: "fa-hand-holding-heart" },
            { word: "塊", pinyin: "kuài", type: "M", meaning: "miếng, mảnh (lượng từ)", note: "Lượng từ cho thức ăn cắt nhỏ: bánh, trái cây...", category: "Từ vựng Phần I", icon: "fa-cube" },
            { word: "香", pinyin: "xiāng", type: "Vs", meaning: "thơm", note: "Mùi hương dễ chịu, ngát thơm", category: "Từ vựng Phần I", icon: "fa-wind" },
            { word: "甜", pinyin: "tián", type: "Vs", meaning: "ngọt", note: "Vị ngọt ngào của hoa quả, đường", category: "Từ vựng Phần I", icon: "fa-candy-cane" },
            { word: "吧", pinyin: "ba", type: "Ptc", meaning: "trợ từ đoán phỏng / thương lượng", note: "Đặt cuối câu biểu thị sự phỏng đoán hoặc gợi ý", category: "Từ vựng Phần I", icon: "fa-comment" },
            { word: "對", pinyin: "duì", type: "Vs", meaning: "đúng, chính xác", note: "Khẳng định điều gì là chính xác", category: "Từ vựng Phần I", icon: "fa-check" },
            { word: "以前", pinyin: "yǐqián", type: "N", meaning: "trước đây, ngày trước", note: "Mốc thời gian trong quá khứ", category: "Từ vựng Phần I", icon: "fa-clock-rotate-left" },

            // Vocabulary II
            { word: "乾淨", pinyin: "gānjìng", type: "Vs", meaning: "sạch sẽ", note: "Không gian hoặc đồ vật tinh tươm", category: "Từ vựng Phần II", icon: "fa-sparkles" },
            { word: "窗戶", pinyin: "chuānghu", type: "N", meaning: "cửa sổ", note: "Cửa sổ đón ánh sáng trong phòng", category: "Từ vựng Phần II", icon: "fa-table-cells" },
            { word: "往", pinyin: "wǎng", type: "Prep", meaning: "hướng về, đi về phía", note: "Giới từ chỉ phương hướng (往+hướng+đi)", category: "Từ vựng Phần II", icon: "fa-arrow-trend-up" },
            { word: "因為", pinyin: "yīnwèi", type: "Conj", meaning: "bởi vì, vì", note: "Liên từ biểu thị nguyên nhân (thường đi với 所以)", category: "Từ vựng Phần II", icon: "fa-circle-info" },
            { word: "住", pinyin: "zhù", type: "V", meaning: "ở, cư trú", note: "Sinh sống tại một nơi nào đó", category: "Từ vựng Phần II", icon: "fa-house-user" },

            // Phrases
            { word: "上個月", pinyin: "shàng ge yuè", type: "N", meaning: "tháng trước", note: "Tháng vừa trôi qua", category: "Cụm từ thường dùng", icon: "fa-calendar-minus" },
            { word: "這些", pinyin: "zhèxiē", type: "Det", meaning: "những cái này, những thứ này", note: "Chỉ số lượng nhiều ở vị trí gần", category: "Cụm từ thường dùng", icon: "fa-layer-group" }
        ];

        let dataset = [...rawVocabulary];
        let index = 0;

        // Quản lý TTS đa nền tảng
        let synth = window.speechSynthesis;
        let voices = [];
        function loadVoices() {
            if ('speechSynthesis' in window) voices = synth.getVoices();
        }
        loadVoices();
        if ('speechSynthesis' in window && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        function playSound(text) {
            if (!('speechSynthesis' in window)) return;
            synth.cancel();
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'zh-TW';
            utterance.rate = 0.85;
            if (voices.length > 0) {
                let zhVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh-CN') || v.lang.startsWith('zh'));
                if (zhVoice) utterance.voice = zhVoice;
            }
            synth.speak(utterance);
        }

        function loadCard() {
            document.getElementById('mainCard').classList.remove('flipped');
            let item = dataset[index];
            document.getElementById('cardCategory').innerText = item.category;
            document.getElementById('cardHanzi').innerText = item.word;
            document.getElementById('cardPinyin').innerText = item.pinyin;
            document.getElementById('cardType').innerText = item.type || 'N';
            document.getElementById('cardMeaning').innerText = item.meaning;
            document.getElementById('cardNote').innerText = item.note ? item.note : '';
            document.getElementById('cardProgress').innerText = `${index + 1} / ${dataset.length}`;

            let imgEl = document.getElementById('cardImg');
            let iconEl = document.getElementById('cardIcon');
            
            if (item.customImg) {
                imgEl.src = item.customImg;
                imgEl.style.display = 'block';
                iconEl.style.display = 'none';
            } else {
                imgEl.style.display = 'none';
                iconEl.style.display = 'block';
                iconEl.className = `fa-solid ${item.icon || 'fa-lemon'}`;
            }
        }

        function filterCategory(cat) {
            dataset = cat === 'ALL' ? [...rawVocabulary] : rawVocabulary.filter(v => v.category === cat);
            index = 0;
            loadCard();
            if(document.getElementById('quiz-view').classList.contains('active')) startQuiz();
        }

        function flipCard() { document.getElementById('mainCard').classList.toggle('flipped'); }
        function nextCard() { if(index < dataset.length - 1) { index++; loadCard(); } }
        function prevCard() { if(index > 0) { index--; loadCard(); } }
        function speakCurrentWord(e) { if(e) e.stopPropagation(); playSound(dataset[index].word); }

        function generateAIImage(e) {
            e.stopPropagation();
            let btn = e.currentTarget;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang tạo...';
            let query = dataset[index].meaning.split(',')[0].trim();
            let imageUrl = `https://pollinations.ai/p/${encodeURIComponent('fresh Taiwanese fruit and lifestyle illustration of ' + query)}?width=300&height=200&seed=${Math.floor(Math.random()*1000)}`;
            let tempImg = new Image();
            tempImg.src = imageUrl;
            tempImg.onload = () => {
                dataset[index].customImg = imageUrl;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Đã tạo';
                loadCard();
            };
            tempImg.onerror = () => { btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Thử lại'; };
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`${tab}-view`).classList.add('active');
            if(tab === 'match') startMatch();
            if(tab === 'quiz') startQuiz();
            if(tab === 'spell') startSpell();
        }

        /* Luyện Chữ & Nghĩa */
        let qIndex = 0;
        let quizMode = 'hanzi_to_pinyin';

        function setQuizMode(mode) {
            quizMode = mode;
            document.getElementById('btnModePinyin').classList.toggle('active', mode === 'hanzi_to_pinyin');
            document.getElementById('btnModeMeaning').classList.toggle('active', mode === 'hanzi_to_meaning');
            startQuiz();
        }

        function startQuiz() {
            qIndex = 0;
            renderQuiz();
        }

        function renderQuiz() {
            let container = document.getElementById('quizContainer');
            if(qIndex >= dataset.length) {
                container.innerHTML = `
                    <h2 style="color:var(--primary); margin-bottom: 0.5rem;">🎉 Hoàn thành bài luyện tập!</h2>
                    <p style="color:var(--text-muted);">Bạn đã hoàn thành tất cả các từ vựng trong danh mục này.</p>
                    <button class="btn-submit" style="margin:1.5rem auto 0; display:inline-block; padding:0.8rem 2rem;" onclick="startQuiz()">Luyện tập lại</button>
                `;
                return;
            }

            let q = dataset[qIndex];
            let isPinyinMode = quizMode === 'hanzi_to_pinyin';
            let correctVal = isPinyinMode ? q.pinyin : q.meaning;

            let pool = rawVocabulary.map(item => isPinyinMode ? item.pinyin : item.meaning).filter(val => val !== correctVal);
            let opts = [correctVal];
            while(opts.length < 4 && pool.length > 0) {
                let randIdx = Math.floor(Math.random() * pool.length);
                let randVal = pool.splice(randIdx, 1)[0];
                if(!opts.includes(randVal)) opts.push(randVal);
            }
            opts.sort(() => 0.5 - Math.random());

            container.innerHTML = `
                <div><span class="tag-badge">${q.category}</span></div>
                <div class="hanzi-display">${q.word}</div>
                <div>
                    <button class="sound-circle-btn" onclick="playSound('${q.word}')" title="Phát âm">
                        <i class="fa-solid fa-volume-high"></i>
                    </button>
                </div>
                <div class="options-grid">
                    ${opts.map(opt => `<button class="option-btn" onclick="checkQuizAnswer(this, ${opt === correctVal})">${opt}</button>`).join('')}
                </div>
                <div style="margin-top: 1.2rem; font-size: 0.9rem; font-weight: 700; color: var(--text-muted);">
                    Tiến độ: ${qIndex + 1} / ${dataset.length}
                </div>
            `;
        }

        function checkQuizAnswer(btn, isCorrect) {
            btn.style.background = isCorrect ? 'var(--success)' : 'var(--danger)';
            btn.style.borderColor = isCorrect ? 'var(--success)' : 'var(--danger)';
            btn.style.color = 'white';
            setTimeout(() => {
                qIndex++;
                renderQuiz();
            }, 550);
        }

        /* Match Game */
        let selectedMatch = [], timerInt, time = 0;
        function startMatch() {
            clearInterval(timerInt);
            time = 0;
            document.getElementById('matchTimer').innerText = '0.0';
            timerInt = setInterval(() => { time += 0.1; document.getElementById('matchTimer').innerText = time.toFixed(1); }, 100);

            let grid = document.getElementById('matchGrid');
            grid.innerHTML = '';
            let items = [...dataset].sort(() => 0.5 - Math.random()).slice(0, 6);
            let cards = [];
            items.forEach((item, i) => {
                cards.push({ id: i, text: `${item.word}`, isHanzi: true });
                cards.push({ id: i, text: `${item.meaning}`, isHanzi: false });
            });
            cards.sort(() => 0.5 - Math.random());
            cards.forEach(c => {
                let div = document.createElement('div');
                div.className = 'match-card' + (c.isHanzi ? ' hanzi-font' : '');
                div.innerText = c.text;
                div.onclick = () => {
                    if (div.classList.contains('correct') || div.classList.contains('selected')) return;
                    div.classList.add('selected');
                    selectedMatch.push({ el: div, id: c.id });
                    if(selectedMatch.length === 2) {
                        if(selectedMatch[0].id === selectedMatch[1].id) {
                            selectedMatch[0].el.className = 'match-card correct';
                            selectedMatch[1].el.className = 'match-card correct';
                            if(document.querySelectorAll('.match-card:not(.correct)').length === 0) {
                                clearInterval(timerInt);
                                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                            }
                        } else {
                            let a = selectedMatch[0].el, b = selectedMatch[1].el;
                            setTimeout(() => { a.classList.remove('selected'); b.classList.remove('selected'); }, 400);
                        }
                        selectedMatch = [];
                    }
                };
                grid.appendChild(div);
            });
        }

        /* Spell */
        let sIndex = 0;
        function startSpell() { 
            sIndex = 0; 
            document.getElementById('spellInput').value = ''; 
            document.getElementById('spellFeedback').innerText = ''; 
            speakSpellWord(); 
        }
        function speakSpellWord() { playSound(dataset[sIndex].word); }
        function checkSpell() {
            let input = document.getElementById('spellInput').value.trim().toLowerCase();
            let targetWord = dataset[sIndex].word.toLowerCase();
            let targetPinyin = dataset[sIndex].pinyin.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, '');
            let rawInput = input.replace(/\s+/g, '');
            let fb = document.getElementById('spellFeedback');

            if(input === targetWord || rawInput === targetPinyin) {
                fb.style.color = '#27ae60';
                fb.innerHTML = `Chính xác! (<span style="font-family:var(--font-kai); font-size:1.4rem;">${dataset[sIndex].word}</span> - ${dataset[sIndex].pinyin}: ${dataset[sIndex].meaning})`;
                setTimeout(() => { sIndex = (sIndex + 1) % dataset.length; startSpell(); }, 1200);
            } else {
                fb.style.color = '#e74c3c';
                fb.innerText = `Chưa đúng! Gợi ý: ${dataset[sIndex].meaning} (Pinyin: ${dataset[sIndex].pinyin})`;
            }
        }

        document.addEventListener('keydown', (e) => {
            if(!document.getElementById('flashcards-view').classList.contains('active')) return;
            if(e.code === 'Space') { e.preventDefault(); flipCard(); }
            if(e.code === 'ArrowRight') nextCard();
            if(e.code === 'ArrowLeft') prevCard();
        });

        window.onload = loadCard;
    </script>
</body>
</html>
