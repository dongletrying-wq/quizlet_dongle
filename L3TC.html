<!-- 4. Luyện Nghe & Viết (Viết mới 100% chống lỗi IME & Pinyin) -->
        <div id="spell-view" class="view-panel">
            <div class="quiz-card" style="max-width: 620px; margin: 0 auto; padding: 2.5rem 1.8rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <span id="spellBadge" class="tag-badge" style="font-size: 0.9rem; padding: 5px 14px;">Thời gian & Thể thao</span>
                    <span id="spellProgress" style="font-weight: 800; font-size: 1.2rem; color: var(--primary);">1 / 38</span>
                </div>

                <!-- Nút phát âm to nổi bật -->
                <button type="button" class="ctrl-btn" style="width: 85px; height: 85px; font-size: 2.2rem; margin: 0 auto 1.2rem; color: var(--primary); box-shadow: 0 6px 20px rgba(211, 84, 0, 0.18);" onclick="playCurrentSpellSound()">
                    <i class="fa-solid fa-volume-high"></i>
                </button>

                <p style="font-size: 1.2rem; font-weight: 700; color: #2c3e50; margin-bottom: 0.3rem;">Nghe âm thanh và gõ lại:</p>
                <p style="font-size: 0.95rem; color: var(--text-muted); margin-bottom: 1.4rem;">Chấp nhận gõ chữ Hán (<b style="color:var(--primary);">運動</b>) hoặc Pinyin không dấu (<b style="color:var(--primary);">yundong</b>)</p>

                <!-- Khung nhập phím -->
                <div style="display: flex; gap: 10px; max-width: 480px; margin: 0 auto;">
                    <input type="text" id="spellInput" placeholder="Gõ câu trả lời vào đây..." 
                           style="flex: 1; padding: 1rem 1.2rem; font-size: 1.35rem; font-weight: 700; border: 2.5px solid var(--border-color); border-radius: var(--radius-md); outline: none; background: #fff;"
                           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
                    <button type="button" id="btnCheckSpell" class="btn-submit" onclick="submitSpellAnswer()" style="padding: 0 1.6rem; font-size: 1.1rem; white-space: nowrap;">
                        Kiểm tra
                    </button>
                </div>

                <!-- Thanh nút phụ & Chuyển câu -->
                <div style="margin-top: 1.2rem; display: flex; justify-content: center; gap: 12px; min-height: 48px;">
                    <button type="button" id="btnSkipSpell" onclick="skipSpellAnswer()" 
                            style="background: #f1f2f6; border: none; padding: 10px 18px; border-radius: 10px; font-weight: 700; color: #57606f; cursor: pointer; font-size: 0.95rem;">
                        <i class="fa-solid fa-lightbulb"></i> Bỏ qua / Xem đáp án
                    </button>

                    <button type="button" id="btnNextSpell" onclick="goNextSpell()" 
                            style="display: none; background: var(--success); color: white; border: none; padding: 10px 24px; border-radius: 10px; font-weight: 800; font-size: 1.15rem; cursor: pointer; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.3);">
                        Câu tiếp theo <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>

                <!-- Hộp hiển thị kết quả to rõ Khải Thể -->
                <div id="spellResultBox" style="margin-top: 1.5rem; display: none;"></div>
            </div>
        </div>
