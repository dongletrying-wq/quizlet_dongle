<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 11: 我要租房子 (Tôi muốn thuê nhà) - Flashcard & Game</title>
    <!-- Google Font Noto Serif TC (Khải Thể / Phồn Thể chuẩn nét thư pháp giáo trình) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #16a085;
            --primary-hover: #117864;
            --bg-main: #f4fbf9;
            --card-bg: #ffffff;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
            --border-color: #d1ece5;
            --success: #27ae60;
            --danger: #e74c3c;
            --radius-lg: 20px;
            --radius-md: 12px;
            --shadow-md: 0 10px 25px rgba(22, 160, 133, 0.08);
            /* Bộ font Khải Thể chuẩn nét bút tập viết */
            --font-kai: 'DFKai-SB', 'BiauKai', 'KaiTi', 'STKaiti', 'KaiTi_GB2312', 'Noto Serif TC', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 800; font-size: 1.3rem; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .logo span { font-family: var(--font-kai); font-weight: normal; }
        
        nav.nav-tabs { display: flex; justify-content: center; gap: 8px; padding: 0.8rem; background: var(--card-bg); border-bottom: 1px solid var(--border-color); flex-wrap: wrap; }
        .tab-btn { background: transparent; border: none; padding: 10px 18px; border-radius: var(--radius-md); font-weight: 700; color: var(--text-muted); cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; font-size: 0.95rem; }
        .tab-btn:hover { background: #e8f8f5; color: var(--primary); }
        .tab-btn.active { background: var(--primary); color: white; }

        main { flex: 1; max-width: 800px; width: 100%; margin: 0 auto; padding: 1.5rem 1rem; }
        .view-panel { display: none; }
        .view-panel.active { display: block; }

        .filter-select { padding: 10px 18px; border-radius: 20px; border: 1.5px solid var(--border-color); background: var(--card-bg); font-weight: 700; margin-bottom: 1.2rem; outline: none; cursor: pointer; color: var(--text-main); width: 100%; max-width: 420px; font-size: 0.95rem; }

        /* Flashcard 3D */
        .flashcard-wrapper { perspective: 1000px; width: 100%; height: 410px; margin-bottom: 1.5rem; }
        .flashcard { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1); cursor: pointer; border-radius: var(--radius-lg); box-shadow: var(--shadow-md); }
        .flashcard.flipped { transform: rotateY(180deg); }
        .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius-lg); background: var(--card-bg); border: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.8rem; text-align: center; }
        .card-back { transform: rotateY(180deg); background: #fffdf9; }
        .card-category { position: absolute; top: 16px; left: 20px; font-size: 0.8rem; font-weight: 700; color: var(--primary); background: rgba(22, 160, 133, 0.08); padding: 5px 14px; border-radius: 12px; }
        .ai-gen-btn { position: absolute; top: 16px; right: 20px; background: #e8f8f5; color: var(--primary); border: 1px solid rgba(22, 160, 133, 0.2); padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        
        /* Chữ Hán Font Khải Thể chuẩn nét bút tập viết */
        .card-hanzi { font-family: var(--font-kai); font-size: 4.2rem; font-weight: normal; margin-bottom: 0.1rem; color: #1e272e; letter-spacing: 2px; }
        .card-pinyin { font-size: 1.35rem; color: #d35400; margin-bottom: 0.4rem; font-weight: 700; }
        .card-type { font-size: 0.85rem; font-weight: 700; color: #8e44ad; background: #f4ecf7; padding: 2px 10px; border-radius: 6px; margin-bottom: 0.8rem; }
        .card-meaning { font-size: 1.9rem; font-weight: 800; color: var(--primary); margin-bottom: 0.8rem; }
        .card-note { font-size: 1rem; color: var(--text-muted); font-style: italic; max-width: 90%; line-height: 1.4; }
        .controls-bar { display: flex; justify-content: space-between; align-items: center; }
        .ctrl-btn { background: var(--card-bg); border: 1px solid var(--border-color); width: 45px; height: 45px; border-radius: 50%; cursor: pointer; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; color: var(--text-main); transition: 0.2s; }
        .ctrl-btn:hover { background: #e8f8f5; color: var(--primary); }

        /* Match Game */
        .match-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
        .match-card { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: var(--radius-md); height: 100px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0.8rem; font-weight: 700; cursor: pointer; user-select: none; font-size: 1.15rem; transition: 0.2s; }
        .match-card.hanzi-font { font-family: var(--font-kai); font-size: 1.65rem; font-weight: normal; }
        .match-card.selected { border-color: var(--primary); background: rgba(22, 160, 133, 0.08); color: var(--primary); transform: scale(1.02); }
        .match-card.correct { border-color: var(--success); background: rgba(39, 174, 96, 0.1); opacity: 0.2; pointer-events: none; }

        /* Quiz & Spell */
        .quiz-card { background: var(--card-bg); padding: 2.2rem; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-md); }
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 1.5rem; }
        .option-btn { padding: 1.1rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); background: white; font-weight: 700; cursor: pointer; text-align: left; font-size: 1.05rem; transition: 0.2s; }
        .option-btn:hover { border-color: var(--primary); }
        .input-box { display: flex; gap: 10px; margin-top: 1.5rem; }
        .input-box input { flex: 1; padding: 0.9rem 1.2rem; border: 2px solid var(--border-color); border-radius: var(--radius-md); font-size: 1.15rem; outline: none; }
        .btn-submit { background: var(--primary); color: white; border: none; padding: 0 1.6rem; border-radius: var(--radius-md); font-weight: 700; cursor: pointer; transition: 0.2s; }
        .btn-submit:hover { background: var(--primary-hover); }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-house-chimney-window"></i> Bài 11: <span>我要租房子</span> (Tôi muốn thuê nhà)</div>
    </header>

    <nav class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('flashcards', this)"><i class="fa-solid fa-clone"></i> Thẻ ghi nhớ 3D</button>
        <button class="tab-btn" onclick="switchTab('match', this)"><i class="fa-solid fa-puzzle-piece"></i> Ghép từ</button>
        <button class="tab-btn" onclick="switchTab('quiz', this)"><i class="fa-solid fa-circle-question"></i> Kiểm tra</button>
        <button class="tab-btn" onclick="switchTab('spell', this)"><i class="fa-solid fa-headphones"></i> Luyện nghe & Viết</button>
    </nav>

    <main>
        <select id="categoryFilter" class="filter-select" onchange="filterCategory(this.value)">
            <option value="ALL">Tất cả bài học (34 mục)</option>
            <option value="Không gian & Nhà cửa">Không gian & Nhà cửa (房屋空間)</option>
            <option value="Từ vựng Phần I">Từ vựng Phần I (Xem phòng & Vị trí)</option>
            <option value="Từ vựng Phần II">Từ vựng Phần II (Tiện nghi & Hợp đồng)</option>
            <option value="Tên riêng & Cụm từ">Tên riêng & Cụm từ thường dùng</option>
        </select>

        <!-- 1. Flashcards -->
        <div id="flashcards-view" class="view-panel active">
            <div class="flashcard-wrapper">
                <div class="flashcard" id="mainCard" onclick="flipCard()">
                    <div class="card-face card-front">
                        <span class="card-category" id="cardCategory">Category</span>
                        <button class="ai-gen-btn" onclick="generateAIImage(event)"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Ảnh</button>
                        <i class="fa-solid fa-key" id="cardIcon" style="font-size: 2.6rem; color: var(--primary); margin-bottom: 0.6rem;"></i>
                        <img id="cardImg" style="display:none; max-width: 140px; max-height: 90px; border-radius: 8px; margin-bottom: 0.6rem; object-fit: contain;">
                        <div class="card-hanzi" id="cardHanzi">租</div>
                        <div class="card-pinyin" id="cardPinyin">zū</div>
                        <span class="card-type" id="cardType">V</span>
                        <button class="ctrl-btn" style="width: 38px; height: 38px; margin-top: 4px;" onclick="speakWord(event)"><i class="fa-solid fa-volume-high"></i></button>
                    </div>
                    <div class="card-face card-back">
                        <span class="card-category">Dịch nghĩa & Ghi chú</span>
                        <div class="card-meaning" id="cardMeaning">thuê</div>
                        <div class="card-note" id="cardNote"></div>
                    </div>
                </div>
            </div>
            <div class="controls-bar">
                <button class="ctrl-btn" onclick="prevCard()"><i class="fa-solid fa-arrow-left"></i></button>
                <span id="cardProgress" style="font-weight: 800; font-size: 1.1rem;">1 / 34</span>
                <button class="ctrl-btn" onclick="nextCard()"><i class="fa-solid fa-arrow-right"></i></button>
            </div>
            <div style="text-align: center; margin-top: 1.2rem; color: var(--text-muted); font-size: 0.9rem;">
                Phím <kbd>Space</kbd> để lật thẻ | Phím <kbd>←</kbd> <kbd>→</kbd> để chuyển thẻ
            </div>
        </div>

        <!-- 2. Match Game -->
        <div id="match-view" class="view-panel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <div style="font-weight: 800; color: var(--primary); font-size: 1.1rem;">Thời gian phản xạ: <span id="matchTimer">0.0</span>s</div>
                <button class="btn-submit" style="padding: 8px 18px;" onclick="startMatch()">Chơi lại</button>
            </div>
            <div class="match-grid" id="matchGrid"></div>
        </div>

        <!-- 3. Quiz -->
        <div id="quiz-view" class="view-panel">
            <div class="quiz-card" id="quizContainer"></div>
        </div>

        <!-- 4. Listen & Spell -->
        <div id="spell-view" class="view-panel">
            <div class="quiz-card" style="text-align: center;">
                <button class="ctrl-btn" style="width: 75px; height: 75px; font-size: 2rem; margin: 0 auto 1.2rem; color: var(--primary);" onclick="speakSpellWord()"><i class="fa-solid fa-volume-high"></i></button>
                <div style="font-size: 1.05rem; font-weight: 600;">Nghe phát âm và gõ lại chữ Hán (hoặc Pinyin không dấu):</div>
                <div class="input-box" style="max-width: 420px; margin: 1.2rem auto;">
                    <input type="text" id="spellInput" placeholder="Nhập chữ Hán hoặc pinyin..." onkeyup="if(event.key==='Enter') checkSpell()">
                    <button class="btn-submit" onclick="checkSpell()">Kiểm tra</button>
                </div>
                <div id="spellFeedback" style="margin-top: 1rem; font-weight: 800; font-size: 1.05rem;"></div>
            </div>
        </div>
    </main>

    <script>
        const rawVocabulary = [
            // Housing & Rooms
            { word: "客廳", pinyin: "kètīng", type: "N", meaning: "phòng khách", note: "Không gian sinh hoạt chung", category: "Không gian & Nhà cửa", icon: "fa-couch" },
            { word: "廚房", pinyin: "chúfáng", type: "N", meaning: "phòng bếp, nhà bếp", note: "Nơi nấu nướng", category: "Không gian & Nhà cửa", icon: "fa-kitchen-set" },
            { word: "浴室", pinyin: "yùshì", type: "N", meaning: "phòng tắm", note: "Phòng tắm rửa, vệ sinh", category: "Không gian & Nhà cửa", icon: "fa-bath" },
            { word: "房間", pinyin: "fángjiān", type: "N", meaning: "căn phòng, phòng", note: "Phòng ốc trong nhà", category: "Không gian & Nhà cửa", icon: "fa-door-closed" },
            { word: "套房", pinyin: "tàofáng", type: "N", meaning: "phòng khép kín (studio)", note: "Phòng có nhà vệ sinh riêng bên trong", category: "Không gian & Nhà cửa", icon: "fa-bed" },
            { word: "左邊", pinyin: "zuǒbiān", type: "N", meaning: "bên trái", note: "Phương vị phía bên trái", category: "Không gian & Nhà cửa", icon: "fa-arrow-left" },
            { word: "右邊", pinyin: "yòubiān", type: "N", meaning: "bên phải", note: "Phương vị phía bên phải", category: "Không gian & Nhà cửa", icon: "fa-arrow-right" },
            { word: "熱水器", pinyin: "rèshuǐqì", type: "N", meaning: "bình nóng lạnh, máy nước nóng", note: "Thiết bị đun nước tắm", category: "Không gian & Nhà cửa", icon: "fa-shower" },

            // Vocabulary I
            { word: "租", pinyin: "zū", type: "V", meaning: "thuê", note: "Thuê nhà, thuê phòng hoặc đồ dùng", category: "Từ vựng Phần I", icon: "fa-key" },
            { word: "房東", pinyin: "fángdōng", type: "N", meaning: "chủ nhà (cho thuê)", note: "Người sở hữu nhà cho thuê", category: "Từ vựng Phần I", icon: "fa-user-tie" },
            { word: "超市", pinyin: "chāoshì", type: "N", meaning: "siêu thị", note: "Nơi mua sắm hàng hóa nhu yếu phẩm", category: "Từ vựng Phần I", icon: "fa-cart-shopping" },
            { word: "走路", pinyin: "zǒulù", type: "V-sep", meaning: "đi bộ", note: "Động từ ly hợp", category: "Từ vựng Phần I", icon: "fa-person-walking" },
            { word: "分鐘", pinyin: "fēnzhōng", type: "M", meaning: "phút (khoảng thời gian)", note: "Chỉ độ dài thời gian (ví dụ: 10 phút)", category: "Từ vựng Phần I", icon: "fa-stopwatch" },
            { word: "就", pinyin: "jiù", type: "Adv", meaning: "ngay, chính (nhấn mạnh nhanh)", note: "Biểu thị sự việc diễn ra thuận lợi, nhanh chóng", category: "Từ vựng Phần I", icon: "fa-bolt" },
            { word: "到", pinyin: "dào", type: "Vp", meaning: "đến, tới", note: "Đến nơi cần đến", category: "Từ vựng Phần I", icon: "fa-location-dot" },
            { word: "間", pinyin: "jiān", type: "M", meaning: "căn, gian (lượng từ phòng/nhà)", note: "Lượng từ cho gian phòng, căn nhà", category: "Từ vựng Phần I", icon: "fa-house" },
            { word: "空", pinyin: "kōng", type: "Vs", meaning: "trống, trống không", note: "Phòng trống chưa có người ở (空房間)", category: "Từ vựng Phần I", icon: "fa-border-none" },
            { word: "回去", pinyin: "huíqù", type: "Vi", meaning: "đi về, trở về", note: "Rời khỏi đây để trở về nơi xuất phát", category: "Từ vựng Phần I", icon: "fa-arrow-rotate-left" },
            { word: "想", pinyin: "xiǎng", type: "V", meaning: "suy nghĩ, nghĩ", note: "Cân nhắc, suy nghĩ về việc thuê phòng", category: "Từ vựng Phần I", icon: "fa-brain" },
            { word: "再", pinyin: "zài", type: "Adv", meaning: "lại, rồi mới (sau đó)", note: "Biểu thị hành động sẽ thực hiện sau", category: "Từ vựng Phần I", icon: "fa-clock-rotate-left" },
            { word: "電話", pinyin: "diànhuà", type: "N", meaning: "điện thoại", note: "Thiết bị hoặc cuộc gọi điện thoại", category: "Từ vựng Phần I", icon: "fa-phone" },
            { word: "給", pinyin: "gěi", type: "Prep", meaning: "cho, cho ai", note: "Giới từ chỉ đối tượng tiếp nhận (打電話給...)", category: "Từ vựng Phần I", icon: "fa-handshake-angle" },

            // Vocabulary II
            { word: "喂", pinyin: "wéi / wèi", type: "Ptc", meaning: "alo (nghe điện thoại)", note: "Thán từ mở đầu cuộc gọi điện thoại", category: "Từ vựng Phần II", icon: "fa-phone-volume" },
            { word: "房租", pinyin: "fángzū", type: "N", meaning: "tiền thuê nhà", note: "Chi phí trả tiền phòng định kỳ", category: "Từ vựng Phần II", icon: "fa-money-bill-wave" },
            { word: "已經", pinyin: "yǐjīng", type: "Adv", meaning: "đã, rồi", note: "Phó từ biểu thị việc đã hoàn thành/xảy ra", category: "Từ vựng Phần II", icon: "fa-check-double" },
            { word: "習慣", pinyin: "xíguàn", type: "Vs/V", meaning: "quen, thích nghi / thói quen", note: "Đã quen thuộc với môi trường sống mới", category: "Từ vựng Phần II", icon: "fa-thumbs-up" },
            { word: "問題", pinyin: "wèntí", type: "N", meaning: "vấn đề, câu hỏi", note: "Khó khăn phát sinh hoặc câu hỏi cần giải đáp", category: "Từ vựng Phần II", icon: "fa-circle-question" },
            { word: "好像", pinyin: "hǎoxiàng", type: "Adv", meaning: "hình như, dường như", note: "Phó từ biểu thị sự phỏng đoán", category: "Từ vựng Phần II", icon: "fa-magnifying-glass" },
            { word: "裝", pinyin: "zhuāng", type: "V", meaning: "lắp đặt", note: "Gắn thiết bị, máy móc vào phòng", category: "Từ vựng Phần II", icon: "fa-wrench" },
            { word: "付", pinyin: "fù", type: "V", meaning: "trả tiền, thanh toán", note: "Hành động chi trả tiền bạc (付房租)", category: "Từ vựng Phần II", icon: "fa-credit-card" },

            // Names & Phrases
            { word: "林", pinyin: "Lín", type: "N", meaning: "Họ Lâm", note: "Họ Lâm (林先生, 林太太...)", category: "Tên riêng & Cụm từ", icon: "fa-user-tag" },
            { word: "打電話", pinyin: "dǎ diànhuà", type: "Phr", meaning: "gọi điện thoại", note: "Cụm động từ gọi điện", category: "Tên riêng & Cụm từ", icon: "fa-phone-flip" },
            { word: "有線電視", pinyin: "yǒuxiàn diànshì", type: "Phr", meaning: "truyền hình cáp", note: "Hệ thống truyền hình cáp (thường gọi là 第四台 ở Đài Loan)", category: "Tên riêng & Cụm từ", icon: "fa-tv" },
            { word: "不好意思", pinyin: "bùhǎoyìsi", type: "Phr", meaning: "xin lỗi, ngại quá", note: "Câu cửa miệng lịch sự phổ biến nhất tại Đài Loan", category: "Tên riêng & Cụm từ", icon: "fa-face-smile" },
            { word: "沒關係", pinyin: "méiguānxi", type: "Phr", meaning: "không sao, không có gì", note: "Đáp lại lịch sự khi người khác xin lỗi", category: "Tên riêng & Cụm từ", icon: "fa-handshake" }
        ];

        let dataset = [...rawVocabulary];
        let index = 0;

        // Quản lý Text-to-Speech hỗ trợ đa nền tảng (Android / iOS / PC)
        let synth = window.speechSynthesis;
        let voices = [];
        function loadVoices() {
            if ('speechSynthesis' in window) {
                voices = synth.getVoices();
            }
        }
        loadVoices();
        if ('speechSynthesis' in window && speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }

        function loadCard() {
            document.getElementById('mainCard').classList.remove('flipped');
            let item = dataset[index];
            document.getElementById('cardCategory').innerText = item.category;
            document.getElementById('cardHanzi').innerText = item.word;
            document.getElementById('cardPinyin').innerText = item.pinyin;
            document.getElementById('cardType').innerText = item.type || 'N';
            document.getElementById('cardMeaning').innerText = item.meaning;
            document.getElementById('cardNote').innerText = item.note ? item.note : '';
            document.getElementById('cardProgress').innerText = `${index + 1} / ${dataset.length}`;

            let imgEl = document.getElementById('cardImg');
            let iconEl = document.getElementById('cardIcon');
            
            if (item.customImg) {
                imgEl.src = item.customImg;
                imgEl.style.display = 'block';
                iconEl.style.display = 'none';
            } else {
                imgEl.style.display = 'none';
                iconEl.style.display = 'block';
                iconEl.className = `fa-solid ${item.icon || 'fa-house-chimney'}`;
            }
        }

        function filterCategory(cat) {
            dataset = cat === 'ALL' ? [...rawVocabulary] : rawVocabulary.filter(v => v.category === cat);
            index = 0;
            loadCard();
        }

        function flipCard() { document.getElementById('mainCard').classList.toggle('flipped'); }
        function nextCard() { if(index < dataset.length - 1) { index++; loadCard(); } }
        function prevCard() { if(index > 0) { index--; loadCard(); } }

        function speakWord(e) {
            if(e) e.stopPropagation();
            if (!('speechSynthesis' in window)) return;
            synth.cancel();

            let utterance = new SpeechSynthesisUtterance(dataset[index].word);
            utterance.lang = 'zh-TW';
            utterance.rate = 0.85;

            if (voices.length > 0) {
                let zhVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh-CN') || v.lang.startsWith('zh'));
                if (zhVoice) utterance.voice = zhVoice;
            }
            synth.speak(utterance);
        }

        // Tích hợp AI Tạo Ảnh trực tiếp từ Pollinations AI
        function generateAIImage(e) {
            e.stopPropagation();
            let btn = e.currentTarget;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang tạo...';
            
            let query = dataset[index].meaning.split(',')[0].trim();
            let imageUrl = `https://pollinations.ai/p/${encodeURIComponent('Taiwan apartment rental and living room interior illustration of ' + query)}?width=300&height=200&seed=${Math.floor(Math.random()*1000)}`;
            
            let tempImg = new Image();
            tempImg.src = imageUrl;
            tempImg.onload = () => {
                dataset[index].customImg = imageUrl;
                btn.innerHTML = '<i class="fa-solid fa-check"></i> Đã tạo';
                loadCard();
            };
            tempImg.onerror = () => {
                btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Thử lại';
            };
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`${tab}-view`).classList.add('active');
            if(tab === 'match') startMatch();
            if(tab === 'quiz') startQuiz();
            if(tab === 'spell') startSpell();
        }

        // Match Game
        let selectedMatch = [], timerInt, time = 0;
        function startMatch() {
            clearInterval(timerInt);
            time = 0;
            document.getElementById('matchTimer').innerText = '0.0';
            timerInt = setInterval(() => { time += 0.1; document.getElementById('matchTimer').innerText = time.toFixed(1); }, 100);

            let grid = document.getElementById('matchGrid');
            grid.innerHTML = '';
            let items = [...dataset].sort(() => 0.5 - Math.random()).slice(0, 6);
            let cards = [];
            items.forEach((item, i) => {
                cards.push({ id: i, text: `${item.word}`, isHanzi: true });
                cards.push({ id: i, text: `${item.meaning}`, isHanzi: false });
            });
            cards.sort(() => 0.5 - Math.random());
            cards.forEach(c => {
                let div = document.createElement('div');
                div.className = 'match-card' + (c.isHanzi ? ' hanzi-font' : '');
                div.innerText = c.text;
                div.onclick = () => {
                    if (div.classList.contains('correct') || div.classList.contains('selected')) return;
                    div.classList.add('selected');
                    selectedMatch.push({ el: div, id: c.id });
                    if(selectedMatch.length === 2) {
                        if(selectedMatch[0].id === selectedMatch[1].id) {
                            selectedMatch[0].el.className = 'match-card correct';
                            selectedMatch[1].el.className = 'match-card correct';
                            if(document.querySelectorAll('.match-card:not(.correct)').length === 0) {
                                clearInterval(timerInt);
                                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                            }
                        } else {
                            let a = selectedMatch[0].el, b = selectedMatch[1].el;
                            setTimeout(() => { a.classList.remove('selected'); b.classList.remove('selected'); }, 400);
                        }
                        selectedMatch = [];
                    }
                };
                grid.appendChild(div);
            });
        }

        // Quiz
        let qIndex = 0;
        function startQuiz() { qIndex = 0; renderQuiz(); }
        function renderQuiz() {
            let container = document.getElementById('quizContainer');
            if(qIndex >= Math.min(dataset.length, 6)) {
                container.innerHTML = '<h3 style="text-align:center;">🎉 Hoàn thành bài kiểm tra!</h3><button class="btn-submit" style="margin:1.2rem auto 0; display:block; padding:0.8rem 1.6rem;" onclick="startQuiz()">Làm lại</button>';
                return;
            }
            let q = dataset[qIndex];
            let opts = [q.meaning];
            while(opts.length < 4) {
                let r = rawVocabulary[Math.floor(Math.random()*rawVocabulary.length)].meaning;
                if(!opts.includes(r)) opts.push(r);
            }
            opts.sort(() => 0.5 - Math.random());
            container.innerHTML = `
                <div style="font-size: 1.2rem;">Câu ${qIndex + 1}: Chữ Hán "<b style="font-family:var(--font-kai); font-size:1.8rem; font-weight:normal; color:var(--primary);">${q.word}</b>" (${q.pinyin} - ${q.type}) có nghĩa là gì?</div>
                <div class="options-grid">
                    ${opts.map(o => `<button class="option-btn" onclick="ansQuiz(this, '${o === q.meaning}')">${o}</button>`).join('')}
                </div>
            `;
        }
        function ansQuiz(btn, isCorrect) {
            btn.style.background = isCorrect === 'true' ? '#27ae60' : '#e74c3c';
            btn.style.color = 'white';
            setTimeout(() => { qIndex++; renderQuiz(); }, 700);
        }

        // Spell
        let sIndex = 0;
        function startSpell() { sIndex = 0; document.getElementById('spellInput').value = ''; document.getElementById('spellFeedback').innerText = ''; speakSpellWord(); }
        function speakSpellWord() {
            if (!('speechSynthesis' in window)) return;
            synth.cancel();
            let u = new SpeechSynthesisUtterance(dataset[sIndex].word);
            u.lang = 'zh-TW';
            if (voices.length > 0) {
                let zhVoice = voices.find(v => v.lang.includes('zh-TW') || v.lang.includes('zh-CN') || v.lang.startsWith('zh'));
                if (zhVoice) u.voice = zhVoice;
            }
            synth.speak(u);
        }
        function checkSpell() {
            let input = document.getElementById('spellInput').value.trim().toLowerCase();
            let targetWord = dataset[sIndex].word.toLowerCase();
            let targetPinyin = dataset[sIndex].pinyin.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, '');
            let rawInput = input.replace(/\s+/g, '');
            let fb = document.getElementById('spellFeedback');

            if(input === targetWord || rawInput === targetPinyin) {
                fb.style.color = '#27ae60';
                fb.innerHTML = `Chính xác! (<span style="font-family:var(--font-kai); font-size:1.4rem;">${dataset[sIndex].word}</span> - ${dataset[sIndex].pinyin}: ${dataset[sIndex].meaning})`;
                setTimeout(() => { sIndex = (sIndex + 1) % dataset.length; startSpell(); }, 1200);
            } else {
                fb.style.color = '#e74c3c';
                fb.innerText = `Chưa đúng! Gợi ý: ${dataset[sIndex].meaning} (Pinyin: ${dataset[sIndex].pinyin})`;
            }
        }

        document.addEventListener('keydown', (e) => {
            if(!document.getElementById('flashcards-view').classList.contains('active')) return;
            if(e.code === 'Space') { e.preventDefault(); flipCard(); }
            if(e.code === 'ArrowRight') nextCard();
            if(e.code === 'ArrowLeft') prevCard();
        });

        window.onload = loadCard;
    </script>
</body>
</html>
